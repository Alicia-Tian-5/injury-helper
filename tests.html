var results = [];
function test(name, fn) {
  try { fn(); results.push({name: name, ok: true}); }
  catch (e) { results.push({name: name, ok: false, msg: e.message}); }
}
function equal(actual, expected) {
  if (actual !== expected) throw new Error('expected ' + JSON.stringify(expected) + ', got ' + JSON.stringify(actual));
}

var ankle = findInjury('ankle');
var patella = findInjury('patella');
var mildAnkle = {deformity: 'no', walk: 'yes', bonePain: 'no', swelling: 'mild'};
var reducedPatella = {inPlace: 'back', swelling: 'no', locking: 'no', before: 'first'};
function withAnswer(base, id, value) {
  var copy = Object.assign({}, base);
  copy[id] = value;
  return copy;
}

test('ankle: mild sprain is self-care', function () { equal(ankle.assess(mildAnkle), 'selfCare'); });
test('ankle: deformity or numb foot is an emergency', function () { equal(ankle.assess(withAnswer(mildAnkle, 'deformity', 'yes')), 'emergency'); });
test('ankle: cannot walk four steps needs a doctor today', function () { equal(ankle.assess(withAnswer(mildAnkle, 'walk', 'no')), 'today'); });
test('ankle: bone pain needs a doctor today', function () { equal(ankle.assess(withAnswer(mildAnkle, 'bonePain', 'yes')), 'today'); });
test('ankle: limping means a visit within days', function () { equal(ankle.assess(withAnswer(mildAnkle, 'walk', 'pain')), 'soon'); });
test('ankle: clear swelling means a visit within days', function () { equal(ankle.assess(withAnswer(mildAnkle, 'swelling', 'moderate')), 'soon'); });

test('patella: not sure if still out is treated as an emergency', function () { equal(patella.assess(withAnswer(reducedPatella, 'inPlace', 'unsure')), 'emergency'); });
test('patella: big swelling needs a doctor today', function () { equal(patella.assess(withAnswer(reducedPatella, 'swelling', 'yes')), 'today'); });
test('patella: locking needs a doctor today', function () { equal(patella.assess(withAnswer(reducedPatella, 'locking', 'yes')), 'today'); });
test('patella: went back with no warning signs still needs a doctor', function () { equal(patella.assess(reducedPatella), 'soon'); });

test('city hospitals: every listed hospital has a name, department and specialty in both languages, and https map links', function () {
  CITY_HOSPITALS.forEach(function (city) {
    if (!city.name.en || !city.name.zh || city.hospitals.length === 0) throw new Error('incomplete city ' + city.id);
    city.hospitals.forEach(function (hospital) {
      ['name', 'department', 'knownFor'].forEach(function (field) {
        if (!hospital[field].en || !hospital[field].zh) throw new Error('missing ' + field + ' for ' + hospital.name.en);
      });
      // Names stay in English in the other languages, so they can be searched on a map.
      ['department', 'knownFor'].forEach(function (field) {
        if (!hospital[field].es) throw new Error('no Spanish ' + field + ' for ' + hospital.name.en);
        if (!hospital[field].fr) throw new Error('no French ' + field + ' for ' + hospital.name.en);
        if (!hospital[field].ru) throw new Error('no Russian ' + field + ' for ' + hospital.name.en);
        if (!hospital[field].ar) throw new Error('no Arabic ' + field + ' for ' + hospital.name.en);
      });
      var links = hospitalMapLinks(city, hospital);
      if (links.google.indexOf('https://www.google.com/maps/') !== 0) throw new Error('bad Google link ' + links.google);
      if (city.country === 'cn' && links.amap.indexOf('https://uri.amap.com/') !== 0) throw new Error('no Amap link for ' + hospital.name.en);
    });
  });
});

[['es', 'Spanish'], ['fr', 'French'], ['ru', 'Russian'], ['ar', 'Arabic']].forEach(function (language) {
  var code = language[0], name = language[1];
  test(name.toLowerCase() + ': every injury question, piece of advice, comfort and place has a ' + name + ' version', function () {
    var missing = [];
    function check(value, path) {
      if (!value || typeof value !== 'object') return;
      if (typeof value.en === 'string' && typeof value.zh === 'string') {
        if (!value[code]) missing.push(path + ': ' + value.en);
        return;
      }
      Object.keys(value).forEach(function (key) { check(value[key], path + '.' + key); });
    }
    check({LEVELS: LEVELS, CATEGORIES: CATEGORIES, INJURIES: INJURIES, RED_FLAGS: RED_FLAGS, COMFORT_STAGES: COMFORT_STAGES, COUNSELING: COUNSELING,
           HOSPITAL_KINDS: HOSPITAL_KINDS, KNOWLEDGE: KNOWLEDGE}, '');
    if (missing.length) throw new Error(missing.length + ' without ' + name + ', e.g. ' + missing[0]);
  });
});

  equal(painTrend([]).length, 0);

function planItem(fields) {
  return planItemFromForm(Object.assign({name: 'Straight leg raises', amount: '3 x 10', days: ALL_WEEKDAYS, start: '2026-11-09', end: ''}, fields), new Date(0));

test('plan: an exercise needs a name, at least one day and a start date, and cannot end before it starts', function () {
  equal(planItemProblems(planItem({})).length, 0);
  equal(planItemProblems(planItem({name: '   '}))[0].field, 'name');
  equal(planItemProblems(planItem({name: 'x'.repeat(PLAN_NAME_MAX + 1)}))[0].problem, 'tooLong');
  equal(planItemProblems(planItem({amount: 'x'.repeat(PLAN_AMOUNT_MAX + 1)}))[0].field, 'amount');
  equal(planItemProblems(planItem({days: []}))[0].field, 'days');
  equal(planItemProblems(planItem({start: ''}))[0].field, 'start');
  equal(planItemProblems(planItem({end: '2026-11-01'}))[0].field, 'end');
  equal(planItemProblems(planItem({end: '2026-11-09'})).length, 0);
});
test('plan: an exercise is due only on its weekdays, from its start date to its end date', function () {
  var mondaysAndFridays = planItem({days: ['5', '1', '1'], start: '2026-11-09', end: '2026-11-20'});
  equal(mondaysAndFridays.days.join(','), '1,5');
  equal(isDueOn(mondaysAndFridays, '2026-11-09'), true);   // Monday, first day
  equal(isDueOn(mondaysAndFridays, '2026-11-10'), false);  // Tuesday
  equal(isDueOn(mondaysAndFridays, '2026-11-13'), true);   // Friday
  equal(isDueOn(mondaysAndFridays, '2026-11-20'), true);   // Friday, last day
  equal(isDueOn(mondaysAndFridays, '2026-11-23'), false);  // Monday after the end
  equal(isDueOn(mondaysAndFridays, '2026-11-02'), false);  // Monday before the start
  equal(itemsDueOn([mondaysAndFridays, planItem({})], '2026-11-10').length, 1);
});
test('plan: running exercises are listed first, finished ones last', function () {
  var over = planItem({name: 'over', start: '2026-10-01', end: '2026-10-31'});
  var later = planItem({name: 'later', start: '2026-12-01'});
  var now = planItem({name: 'now', start: '2026-11-01'});
  equal(sortPlanItems([over, later, now], '2026-11-09').map(function (i) { return i.name; }).join(','), 'now,later,over');
  equal(isPlanItemOver(over, '2026-11-09'), true);
  equal(isPlanItemOver(now, '2026-11-09'), false);
});
test('rehab plan: stages with set days follow each other from day 0, and every injury but a fracture has some', function () {
  INJURIES.forEach(function (injury) {
    var timed = injury.rehab.filter(function (stage) { return stage.days; });
    if (injury.id === 'fracture') { equal(timed.length, 0); return; }
    if (timed.length === 0) throw new Error(injury.id + ' has no stage with set days');
    equal(timed[0].days[0], 0);
    timed.forEach(function (stage, index) {
      if (stage.days[0] >= stage.days[1]) throw new Error(injury.id + ': ' + stage.when.en + ' ends before it starts');
      if (index > 0 && stage.days[0] !== timed[index - 1].days[1]) throw new Error(injury.id + ': gap or overlap before ' + stage.when.en);
    });
  });
});
test('rehab plan: an ankle sprain 4 days ago skips the finished stage and dates the rest from the injury', function () {
  var ankle = INJURIES.filter(function (injury) { return injury.id === 'ankle'; })[0];
  var items = rehabPlanItems(ankle, '2026-11-05', '2026-11-09', new Date(0));
  equal(items.length, 2);  // days 0-3 are over; "back to sport" has no set days
  equal(items[0].start + ' ' + items[0].end, '2026-11-08 2026-11-18');
  equal(items[1].start + ' ' + items[1].end, '2026-11-19 2026-12-16');
  equal(items[0].days.length, 7);
  equal(planItemProblems(items[0]).length, 0);
  equal(rehabStageOf(items[0]).goal.en, 'Move normally again');
  equal(isDueOn(items[0], '2026-11-09'), true);
  equal(untimedRehabStages(ankle).map(function (stage) { return stage.when.en; }).join(), 'Back to sport');
  equal(rehabStageOf(planItem({})), null);
});
test('plan: the calendar file repeats each exercise on its days at the chosen time, until the end date', function () {
  var item = planItem({name: 'Heel raises, slow; 15', days: [2, 4], start: '2026-11-09', end: '2026-11-30'});
  item.id = 7;
  var ics = planCalendar([item], '20:30', 'Rehab', new Date(Date.UTC(2026, 10, 9, 12, 0, 0)));
  var lines = ics.split('\r\n');
  equal(lines[0], 'BEGIN:VCALENDAR');
  equal(lines.indexOf('DTSTART:20261110T203000') > 0, true);  // first Tuesday on or after the start
  equal(lines.indexOf('RRULE:FREQ=WEEKLY;BYDAY=TU,TH;UNTIL=20261130T235959') > 0, true);
  equal(lines.indexOf('SUMMARY:Rehab: Heel raises\\, slow\\; 15 3 x 10') > 0, true);
  equal(lines.indexOf('DTSTAMP:20261109T120000Z') > 0, true);
  equal(lines.filter(function (line) { return line === 'BEGIN:VEVENT'; }).length, 1);
  var everyDay = planCalendar([planItem({})], '08:00', 'Rehab', new Date(0));
  equal(everyDay.indexOf('BYDAY=SU,MO,TU,WE,TH,FR,SA\r\n') > 0, true);  // no end date, no UNTIL
});

test('knowledge: prevention and first aid, every topic in Chinese, English and Spanish', function () {
  equal(KNOWLEDGE.map(function (part) { return part.id; }).join(','), 'prevent,firstAid');
  KNOWLEDGE.forEach(function (part) {
    if (part.topics.length === 0) throw new Error(part.id + ' has no topics');
    [part.title].concat(part.topics.map(function (topic) { return topic.title; })).forEach(function (text) {
      if (!text.en || !text.es || !text.zh) throw new Error('missing a language in ' + JSON.stringify(text));
    });
    part.topics.forEach(function (topic) {
      if (topic.points.length === 0) throw new Error(topic.title.en + ' has no points');
      topic.points.forEach(function (point) {
        if (!point.en || !point.es || !point.zh) throw new Error('missing a language in ' + JSON.stringify(point));
      });
    });
  });
});

// Every answer combination must give a level that has "where" advice, and
// every text must exist in both languages.
INJURIES.forEach(function (injury) {
  test(injury.id + ': every answer combination has advice', function () {
    var combos = [{}];
    injury.questions.forEach(function (q) {
      var next = [];
      combos.forEach(function (c) { q.options.forEach(function (o) { next.push(withAnswer(c, q.id, o.value)); }); });
      combos = next;
    });
    combos.forEach(function (c) {
      var advice = buildAdvice(injury, c);
      if (!LEVELS[advice.level] || !advice.where || advice.where.length === 0) throw new Error('no advice for ' + JSON.stringify(c));
    });
  });
  test(injury.id + ': all text is in English and Chinese', function () {
    (function check(value, path) {
      if (value && typeof value === 'object') {
        if ('en' in value || 'zh' in value) {
          if (!value.en || !value.zh) throw new Error('missing translation at ' + path);
          return;
        }
        Object.keys(value).forEach(function (k) { check(value[k], path + '.' + k); });
      }
    })(injury, injury.id);
  });
});

function showResults() {
var failed = results.filter(function (r) { return !r.ok; }).length;
document.getElementById('summary').textContent = failed ? failed + ' of ' + results.length + ' tests failed' : 'All ' + results.length + ' tests passed';
document.getElementById('summary').className = failed ? 'fail' : 'pass';
results.forEach(function (r) {
  var li = document.createElement('li');
  li.className = r.ok ? 'pass' : 'fail';
  li.textContent = (r.ok ? '✓ ' : '✗ ') + r.name + (r.msg ? ': ' + r.msg : '');
  document.getElementById('log').appendChild(li);
});
}

// Opens the real page in a hidden frame as a first-time visitor (no saved
// language) and picks Spanish from the Language menu, the way a visitor
// would. Puts back the visitor's saved language afterwards, since the frame
// shares this site's storage.
function testSpanishSwitch() {
  var saved = null;
  try {
    saved = localStorage.getItem('injury-helper-lang');
    localStorage.removeItem('injury-helper-lang');
  } catch (e) { /* storage blocked */ }
  return new Promise(function (resolve) {
    var frame = document.createElement('iframe');
    frame.style.display = 'none';
    frame.src = 'index.html';
    frame.onload = function () {
      var page = frame.contentWindow;
      var doc = frame.contentDocument;
      var list = doc.getElementById('langList');
      test('language: a first visit is in English, with the language list closed', function () {
        equal(doc.documentElement.lang, 'en');
        equal(doc.getElementById('navAssess').textContent, page.T.en.navAssess);
        equal(list.hidden, true);
      });
      test('language: the Language button opens the list, and a second tap closes it', function () {
        doc.getElementById('langBtn').click();
        equal(list.hidden, false);
        equal(doc.getElementById('langBtn').getAttribute('aria-expanded'), 'true');
        doc.getElementById('langBtn').click();
        equal(list.hidden, true);
      });
      test('language: choosing Español switches to Spanish, closes the list and is remembered', function () {
        doc.getElementById('langBtn').click();
        var button = list.querySelector('[data-lang="es"]');
        if (!button) throw new Error('there is no Español in the list');
        button.click();
        equal(doc.documentElement.lang, 'es');
        equal(doc.getElementById('navAssess').textContent, 'Revisar mi lesión');
        equal(doc.getElementById('startBtn').textContent, 'Empezar la evaluación');
        equal(list.hidden, true);
        equal(button.getAttribute('aria-current'), 'true');
        equal(localStorage.getItem('injury-helper-lang'), 'es');
        equal(page.loadLang(), 'es');
      });
      test('language: every language in the list has every interface text that English has', function () {
        [].forEach.call(list.querySelectorAll('[data-lang]'), function (button) {
          var code = button.dataset.lang;
          if (!page.T[code]) throw new Error('no text for ' + code);
          Object.keys(page.T.en).forEach(function (key) {
            if (!page.T[code][key]) throw new Error(code + ' is missing ' + key);
          });
        });
      });
      test('language: French shows the machine translation note, English does not', function () {
        list.querySelector('[data-lang="fr"]').click();
        equal(doc.documentElement.lang, 'fr');
        equal(doc.getElementById('navAssess').textContent, 'Évaluer ma blessure');
        equal(doc.getElementById('translatedNote').hidden, false);
        list.querySelector('[data-lang="en"]').click();
        equal(doc.getElementById('translatedNote').hidden, true);
      });
      test('home: the languages card shows how many languages the Language menu has', function () {
        equal(doc.getElementById('languageCount').textContent, '6');
        equal(list.querySelectorAll('[data-lang]').length, 6);
      });
      test('language: Arabic turns the page right to left, and English turns it back', function () {
        list.querySelector('[data-lang="ar"]').click();
        equal(doc.documentElement.lang, 'ar');
        equal(doc.documentElement.dir, 'rtl');
        equal(doc.getElementById('navAssess').textContent, page.T.ar.navAssess);
        list.querySelector('[data-lang="en"]').click();
        equal(doc.documentElement.dir, 'ltr');
      });
      // If any start-up code throws, the texts after it stay empty. Parts
      // that are not shown yet (results, the trend) are filled later.
      test('page: starts without errors, so every heading and button has its text', function () {
        var empty = [].slice.call(doc.querySelectorAll('h1, h2, h3, button, summary'))
          .filter(function (element) {
            var name = element.textContent.trim() || element.getAttribute('aria-label') || '';
            return !element.closest('[hidden]:not(.view)') && name === '';
          })
          .map(function (element) { return element.id || element.className || element.tagName; });
        if (empty.length) throw new Error('empty: ' + empty.join(', '));
      });
      test('language: Spanish has every interface text that English has', function () {
        if (!page.T.es) throw new Error('there is no Spanish interface text');
        Object.keys(page.T.en).forEach(function (key) {
          if (!page.T.es[key]) throw new Error('Spanish is missing ' + key);
        });
      });
      try {
        if (saved === null) localStorage.removeItem('injury-helper-lang');
        else localStorage.setItem('injury-helper-lang', saved);
      } catch (e) { /* storage blocked: nothing was saved either */ }
      frame.remove();
      resolve();
    };
    document.body.appendChild(frame);
  });
}

// Opens the real page and pretends Firebase reports who is signed in, then
// opens the private sections. The rule in account.js can be right while the
// page forgets to use it, so this checks the page itself. Puts back the
// device's owner afterwards, since the frame shares this site's storage.
function testAccountLock() {
  var savedOwner = null;
  try { savedOwner = localStorage.getItem(ACCOUNT_OWNER_KEY); } catch (e) { /* storage blocked */ }
  return new Promise(function (resolve) {
    var frame = document.createElement('iframe');
    frame.style.display = 'none';
    frame.src = 'index.html';
    frame.onload = function () {
      var page = frame.contentWindow;
      var doc = frame.contentDocument;
      function open(view) {
        page.location.hash = view;
        page.showView();
        return {section: !doc.getElementById('view-' + view).hidden, signIn: !doc.getElementById('accountLock').hidden};
      }
      function user(daysAgo) {
        return {uid: 'lock-test', email: 'lock-test@example.com', emailVerified: true,
          lastSignIn: new Date(Date.now() - daysAgo * 86400000).toUTCString()};
      }
      test('account: signed out, the recovery log and comfort show the sign-in form instead', function () {
        page.onAccountChange(null);
        ['log', 'comfort'].forEach(function (view) {
          var shown = open(view);
          if (shown.section) throw new Error(view + ' is shown while signed out');
          if (!shown.signIn) throw new Error('no sign-in form on ' + view);
        });
        equal(open('assess').section, true);
      });
      test('account: a sign-in older than 7 days locks the recovery log again', function () {
        try { localStorage.setItem(ACCOUNT_OWNER_KEY, JSON.stringify({uid: 'lock-test', email: 'lock-test@example.com'})); } catch (e) { /* storage blocked */ }
        page.onAccountChange(user(8));
        var shown = open('log');
        equal(shown.section, false);
        equal(shown.signIn, true);
      });
      test('account: signed in, the recovery log opens', function () {
        page.onAccountChange(user(1));
        var shown = open('log');
        equal(shown.section, true);
        equal(shown.signIn, false);
      });
      try {
        if (savedOwner === null) localStorage.removeItem(ACCOUNT_OWNER_KEY);
        else localStorage.setItem(ACCOUNT_OWNER_KEY, savedOwner);
      } catch (e) { /* storage blocked: nothing was saved either */ }
      frame.remove();
      resolve();
    };
    document.body.appendChild(frame);
  });
}

// A saved record must come back when the page is opened again. The test
// record is removed afterwards so it never shows up in the real log.
// ---- Sign-in (account.js) ----
var signInAt = new Date('2026-11-01T10:00:00Z');
function signedInUser(fields) {
  return Object.assign({uid: 'me', email: 'me@example.com', emailVerified: true, lastSignIn: signInAt.toUTCString()}, fields);
}
function daysAfterSignIn(days) {
  return new Date(signInAt.getTime() + days * 86400000);
}
test('account: nobody signed in sees the sign-in form', function () {
  equal(accountState(null, null, daysAfterSignIn(0)), 'signedOut');
});
test('account: a sign-in lasts 7 days, then ends', function () {
  equal(accountState(signedInUser(), null, daysAfterSignIn(6.9)), 'signedIn');
  equal(accountState(signedInUser(), null, daysAfterSignIn(7.1)), 'expired');
});
test('account: an email that is not verified yet does not open the sections', function () {
  equal(accountState(signedInUser({emailVerified: false}), null, daysAfterSignIn(1)), 'unverified');
});
test('account: another account cannot open this device\'s records', function () {
  var owner = {uid: 'someone-else', email: 'other@example.com'};
  equal(accountState(signedInUser(), owner, daysAfterSignIn(1)), 'otherAccount');
  equal(accountState(signedInUser(), {uid: 'me', email: 'me@example.com'}, daysAfterSignIn(1)), 'signedIn');
});
test('account: only the recovery log and comfort are locked', function () {
  equal(['home', 'assess', 'comfort', 'cases', 'hospitals', 'log', 'learn'].filter(isLockedView).join(), 'comfort,log');
});
test('account: registering needs a valid email, 6+ characters and the same password twice', function () {

    return accountProblems(form, mode).map(function (p) { return p.field + ':' + p.problem; }).join();
  }
  equal(fields({email: ' a@b.co ', password: '123456', confirm: '123456'}, 'signUp'), '');
  equal(fields({email: '', password: '12345', confirm: '12345'}, 'signUp'), 'email:missing,password:tooShort');
  equal(fields({email: 'not-an-email', password: '123456', confirm: '654321'}, 'signUp'), 'email:bad,confirm:different');
  equal(fields({email: 'a@b.co', password: '123', confirm: ''}, 'signIn'), '');
  equal(fields({email: 'a@b.co', password: '', confirm: ''}, 'reset'), '');
});
test('account: a wrong password and an unknown email give the same message', function () {

// Every file the page loads must be saved for offline use, or the page
// breaks without internet.
var offlineChecked = Promise.all(['index.html', 'sw.js', 'manifest.webmanifest'].map(function (file) {
  return fetch(file, {cache: 'no-store'}).then(function (r) { return r.text(); });
})).then(function (texts) {
  var page = texts[0], worker = texts[1], manifest = JSON.parse(texts[2]);
  test('offline: every script the page loads is saved by sw.js', function () {
    var scripts = (page.match(/<script[^>]* src="[^"]+"/g) || []).map(function (tag) { return tag.match(/src="([^"]+)"/)[1]; });
    var missing = scripts.filter(function (file) { return worker.indexOf("'" + file + "'") < 0; });
    if (missing.length) throw new Error('not saved: ' + missing.join(', '));
  });
  test('offline: the app is named Injury Helper on the home screen', function () {
    equal(manifest.short_name, 'Injury Helper');
    equal(manifest.display, 'standalone');
  });
  return Promise.all(manifest.icons.map(function (icon) {
    return fetch(icon.src, {cache: 'no-store'}).then(function (r) { return icon.src + ':' + r.ok; });
  })).then(function (found) {
    test('offline: every home screen icon exists', function () {
      var missing = found.filter(function (f) { return /:false$/.test(f); });
      if (missing.length) throw new Error('missing: ' + missing.join(', '));
    });
  });
}).catch(function (e) {
  results.push({name: 'offline: the app files can be read', ok: false, msg: String(e && e.message || e)});
});

var logStorageChecked = logStore.add({date: '2000-01-01', text: 'test record', photo: null, createdAt: 0}).then(function (id) {
  return logStore.all().then(function (entries) {
    test('log: a saved record can be read back', function () {
      var found = entries.filter(function (e) { return e.id === id; })[0];
      equal(found && found.text, 'test record');
    });
    return logStore.remove(id);
  }).then(logStore.all).then(function (entries) {
    test('log: a deleted record is gone', function () {
      equal(entries.some(function (e) { return e.id === id; }), false);
    });
  });
}).catch(function (e) {
  results.push({name: 'log: records can be stored in this browser', ok: false, msg: String(e && e.message || e)});
});
var planStorageChecked = planStore.save(planItem({name: 'test exercise'})).then(function (id) {
  return planStore.setDone(id, '2000-01-01', true).then(function () {
    return Promise.all([planStore.all(), planStore.doneOn('2000-01-01'), planStore.doneOn('2000-01-02')]);
  }).then(function (results) {
    test('plan: a saved exercise and its tick for one day can be read back', function () {
      equal(results[0].some(function (item) { return item.id === id && item.name === 'test exercise'; }), true);
      equal(results[1].indexOf(id) >= 0, true);
      equal(results[2].indexOf(id) >= 0, false);
    });
    return planStore.setDone(id, '2000-01-01', false);
  }).then(function () {
    return planStore.remove(id);
  }).then(function () {
    return Promise.all([planStore.all(), planStore.doneOn('2000-01-01')]);
  }).then(function (results) {
    test('plan: unticking and deleting remove the tick and the exercise', function () {
      equal(results[0].some(function (item) { return item.id === id; }), false);
      equal(results[1].indexOf(id) >= 0, false);
    });
  });
}).catch(function (e) {
  results.push({name: 'plan: exercises can be stored in this browser', ok: false, msg: String(e && e.message || e)});
});
var rehabReplaceChecked = planStorageChecked.then(function () {
  var stage = {name: 'stage', amount: '', days: ALL_WEEKDAYS, start: '2000-01-01', end: '2000-01-05', ref: {injury: 'test-injury', stage: 0}, createdAt: 0};
  var ids = [];
  return planStore.save(planItem({name: 'typed exercise'})).then(function (id) { ids.push(id); })
    .then(function () { return planStore.replaceRehab('test-injury', [stage, Object.assign({}, stage, {name: 'second'})]); })
    .then(function () { return planStore.replaceRehab('test-injury', [Object.assign({}, stage, {name: 'again'})]); })
    .then(planStore.all)
    .then(function (items) {
      test('rehab plan: adding the same injury again replaces its stages and keeps typed exercises', function () {
        var stages = items.filter(function (item) { return item.ref && item.ref.injury === 'test-injury'; });
        equal(stages.map(function (item) { return item.name; }).join(), 'again');
        equal(items.some(function (item) { return item.id === ids[0]; }), true);
      });
      return planStore.replaceRehab('test-injury', []).then(function () { return planStore.remove(ids[0]); });
    });
}).catch(function (e) {
  results.push({name: 'rehab plan: stages can be stored in this browser', ok: false, msg: String(e && e.message || e)});
});
Promise.all([rulesChecked, testSpanishSwitch(), testAccountLock(), logStorageChecked, planStorageChecked, rehabReplaceChecked, offlineChecked]).then(showResults);
