<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Injury Helper Tests</title>
<style>
body{margin:0;padding:16px;background:#fff;color:#1d2330;font:15px/1.5 -apple-system,BlinkMacSystemFont,sans-serif}
.pass{color:#2e7d32}.fail{color:#c62828;font-weight:700}
</style>
</head>
<body>
<h1 id="summary">Running…</h1>
<ul id="log"></ul>
<script src="triage.js"></script>
<script src="share.js"></script>
<script src="chat.js"></script>
<script src="recovery-log.js"></script>
<script src="knowledge.js"></script>
<script>
var results = [];
function test(name, fn) {
  try { fn(); results.push({name: name, ok: true}); }
  catch (e) { results.push({name: name, ok: false, msg: e.message}); }
}
function equal(actual, expected) {
  if (actual !== expected) throw new Error('expected ' + JSON.stringify(expected) + ', got ' + JSON.stringify(actual));
}

var ankle = findInjury('ankle');
var patella = findInjury('patella');
var mildAnkle = {deformity: 'no', walk: 'yes', bonePain: 'no', swelling: 'mild'};
var reducedPatella = {inPlace: 'back', swelling: 'no', locking: 'no', before: 'first'};
function withAnswer(base, id, value) {
  var copy = Object.assign({}, base);
  copy[id] = value;
  return copy;
}

test('ankle: mild sprain is self-care', function () { equal(ankle.assess(mildAnkle), 'selfCare'); });
test('ankle: deformity or numb foot is an emergency', function () { equal(ankle.assess(withAnswer(mildAnkle, 'deformity', 'yes')), 'emergency'); });
test('ankle: cannot walk four steps needs a doctor today', function () { equal(ankle.assess(withAnswer(mildAnkle, 'walk', 'no')), 'today'); });
test('ankle: bone pain needs a doctor today', function () { equal(ankle.assess(withAnswer(mildAnkle, 'bonePain', 'yes')), 'today'); });
test('ankle: limping means a visit within days', function () { equal(ankle.assess(withAnswer(mildAnkle, 'walk', 'pain')), 'soon'); });
test('ankle: clear swelling means a visit within days', function () { equal(ankle.assess(withAnswer(mildAnkle, 'swelling', 'moderate')), 'soon'); });

test('patella: still out is an emergency', function () { equal(patella.assess(withAnswer(reducedPatella, 'inPlace', 'out')), 'emergency'); });
test('patella: not sure if still out is treated as an emergency', function () { equal(patella.assess(withAnswer(reducedPatella, 'inPlace', 'unsure')), 'emergency'); });
test('patella: big swelling needs a doctor today', function () { equal(patella.assess(withAnswer(reducedPatella, 'swelling', 'yes')), 'today'); });
test('patella: locking needs a doctor today', function () { equal(patella.assess(withAnswer(reducedPatella, 'locking', 'yes')), 'today'); });
test('patella: went back with no warning signs still needs a doctor', function () { equal(patella.assess(reducedPatella), 'soon'); });
test('patella: repeat dislocation adds the surgery advice', function () {
  equal(buildAdvice(patella, withAnswer(reducedPatella, 'before', 'again')).where.length, patella.where.soon.length + 1);
});
test('patella: first dislocation has no surgery advice', function () {
  equal(buildAdvice(patella, reducedPatella).where.length, patella.where.soon.length);
});

test('sprain: a pop means a visit within days', function () {
  equal(findInjury('sprain').assess({deformity: 'no', use: 'yes', pop: 'yes', swelling: 'mild'}), 'soon');
});
test('strain: cannot rise on toes after an Achilles injury needs a doctor today', function () {
  equal(findInjury('strain').assess({achilles: 'yes', gap: 'no', use: 'yes', bruise: 'mild'}), 'today');
});
test('dislocation: a shoulder still out is an emergency, a finger still out is today', function () {
  var d = findInjury('dislocation');
  equal(d.assess({part: 'shoulder', inPlace: 'out', numb: 'no', before: 'first'}), 'emergency');
  equal(d.assess({part: 'finger', inPlace: 'out', numb: 'no', before: 'first'}), 'today');
});
test('fracture: a neck, back, hip or thigh injury is an emergency', function () {
  equal(findInjury('fracture').assess({open: 'no', spine: 'yes', bonePain: 'no', use: 'yes'}), 'emergency');
});
test('concussion: any symptom needs a doctor today', function () {
  equal(findInjury('concussion').assess({danger: 'no', neck: 'no', symptoms: 'yes'}), 'today');
});
test('bruise: rock-hard swelling is an emergency', function () {
  equal(findInjury('bruise').assess({tense: 'yes', trunk: 'no', use: 'yes', swelling: 'small'}), 'emergency');
});
test('wound: bleeding that will not stop is an emergency', function () {
  equal(findInjury('wound').assess({bleeding: 'yes', deep: 'no', dirty: 'no', infected: 'no'}), 'emergency');
});
test('cramp: a swollen red leg needs a doctor today', function () {
  equal(findInjury('cramp').assess({heat: 'no', swollen: 'yes', eased: 'yes', often: 'no'}), 'today');
});
test('overuse: one painful spot on a bone means a visit within days', function () {
  equal(findInjury('overuse').assess({boneSpot: 'yes', rest: 'no', limp: 'no', weeks: 'short'}), 'soon');
});
test('heat: confusion is an emergency', function () {
  equal(findInjury('heat').assess({mind: 'yes', vomit: 'no', better: 'yes'}), 'emergency');
});

test('every injury belongs to exactly one category, with a unique id', function () {
  var seen = {};
  CATEGORIES.forEach(function (c) {
    c.injuries.forEach(function (injury) {
      if (seen[injury.id]) throw new Error(injury.id + ' appears twice');
      seen[injury.id] = true;
    });
  });
  equal(Object.keys(seen).length, INJURIES.length);
});
test('categories have names in English and Chinese', function () {
  CATEGORIES.forEach(function (c) {
    if (!c.name.en || !c.name.zh || !c.hint.en || !c.hint.zh) throw new Error('missing text in category ' + c.id);
  });
});
test('comfort: every recovery stage has words and a tip in both languages', function () {
  equal(COMFORT_STAGES.length, 3);
  COMFORT_STAGES.forEach(function (stage) {
    [stage.when, stage.words, stage.tryThis].forEach(function (text) {
      if (!text.en || !text.zh) throw new Error('missing comfort text in ' + stage.when.en);
    });
  });
});
test('comfort: every counseling entry has a name and a link that opens a phone, text or website', function () {
  COUNSELING.forEach(function (place) {
    if (!place.name.en || !place.name.zh || !place.detail.en || !place.detail.zh) throw new Error('missing text for ' + place.name.en);
    if (place.links.length === 0) throw new Error('no link for ' + place.name.en);
    place.links.forEach(function (link) {
      if (!/^(tel:|sms:|https:\/\/)/.test(link.href)) throw new Error('bad link ' + link.href);
    });
  });
});
test('hospitals: every kind of place has text in both languages and https map links', function () {
  HOSPITAL_KINDS.forEach(function (kind) {
    if (!kind.name.en || !kind.name.zh || !kind.when.en || !kind.when.zh) throw new Error('missing text for ' + kind.name.en);
    var links = mapLinks(kind);
    if (links.google.indexOf('https://www.google.com/maps/') !== 0) throw new Error('bad Google link ' + links.google);
    if (links.amap.indexOf('https://uri.amap.com/') !== 0) throw new Error('bad Amap link ' + links.amap);
  });
});
test('hospitals: Amap searches in Chinese, Google Maps in English near the visitor', function () {
  var links = mapLinks(HOSPITAL_KINDS[0]);
  equal(links.amap, 'https://uri.amap.com/search?keyword=' + encodeURIComponent('医院急诊'));
  equal(links.google, 'https://www.google.com/maps/search/?api=1&query=emergency%20room%20near%20me');
});
test('chat: messages about suicide or self-harm show the hotlines, in both languages', function () {
  equal(isCrisisMessage('我现在不想活了'), true);
  equal(isCrisisMessage('I want to die'), true);
  equal(isCrisisMessage('I keep thinking I might HURT MYSELF'), true);
});
test('chat: an ordinary sad message does not show the crisis hotlines', function () {
  equal(isCrisisMessage('我现在很难受'), false);
  equal(isCrisisMessage('I miss playing soccer so much'), false);
});
test('chat: when the AI writes Spanish itself, it is told to sound like a native speaker', function () {
  var prompt = chatSystemPrompt('es');
  if (prompt.indexOf('Reply only in Spanish') === -1) throw new Error('no Spanish instruction');
  if (prompt.indexOf('native Spanish speaker') === -1) throw new Error('no native-speaker instruction');
  equal(chatSystemPrompt('en'), CHAT_SYSTEM_PROMPT);
});
test('chat: empty messages are not sent and long ones are cut to the limit', function () {
  equal(cleanChatMessage('   '), null);
  equal(cleanChatMessage('  我很难受 '), '我很难受');
  equal(cleanChatMessage('a'.repeat(900)).length, CHAT_MAX_LENGTH);
});
test('knowledge: prevention and first aid, every topic in Chinese and English', function () {
  equal(KNOWLEDGE.map(function (part) { return part.id; }).join(','), 'prevent,firstAid');
  KNOWLEDGE.forEach(function (part) {
    if (part.topics.length === 0) throw new Error(part.id + ' has no topics');
    [part.title].concat(part.topics.map(function (topic) { return topic.title; })).forEach(function (text) {
      if (!text.en || !text.zh) throw new Error('missing a language in ' + JSON.stringify(text));
    });
    part.topics.forEach(function (topic) {
      if (topic.points.length === 0) throw new Error(topic.title.en + ' has no points');
      topic.points.forEach(function (point) {
        if (!point.en || !point.zh) throw new Error('missing a language in ' + JSON.stringify(point));
      });
    });
  });
});
test('knowledge: the danger signs give the emergency numbers', function () {
  var firstAid = KNOWLEDGE.filter(function (part) { return part.id === 'firstAid'; })[0];
  var text = JSON.stringify(firstAid.topics);
  if (text.indexOf('120') === -1 || text.indexOf('911') === -1) throw new Error('emergency numbers missing');
});

test('log: a record needs a date and some words', function () {
  var now = new Date(2026, 10, 9, 20, 0);
  equal(logEntryProblems(logEntryFromForm({date: '2026-11-09', text: '  肿消了一点 '}, now)).length, 0);
  equal(logEntryFromForm({date: '2026-11-09', text: '  肿消了一点 '}, now).text, '肿消了一点');
  equal(logEntryProblems(logEntryFromForm({date: '2026-11-09', text: '   '}, now))[0].field, 'text');
  equal(logEntryProblems(logEntryFromForm({date: '', text: 'ok'}, now))[0].field, 'date');
  equal(logEntryProblems(logEntryFromForm({date: '2026-11-09', text: 'a'.repeat(LOG_TEXT_MAX + 1)}, now))[0].problem, 'tooLong');
});
test('log: both pain scores are optional and must be 0 to 10', function () {
  var now = new Date(2026, 10, 9, 20, 0);
  var entry = logEntryFromForm({date: '2026-11-09', text: 'ok', painRest: '2', painExercise: ''}, now);
  equal(entry.painRest, 2);
  equal(entry.painExercise, null);
  LOG_PAIN_FIELDS.forEach(function (field) {
    function problems(pain) {
      var input = {date: '2026-11-09', text: 'ok'};
      input[field] = pain;
      return logEntryProblems(logEntryFromForm(input, now));
    }
    equal(problems('').length, 0);
    equal(problems('0').length, 0);
    equal(problems('10').length, 0);
    equal(problems('11')[0].field, field);
    equal(problems('2.5').length, 1);
  });
});
test('log: newest day first, and the later record first on the same day', function () {
  var sorted = sortLogEntries([
    {id: 1, date: '2026-11-07', createdAt: 5},
    {id: 2, date: '2026-11-09', createdAt: 1},
    {id: 3, date: '2026-11-09', createdAt: 2}
  ]);
  equal(sorted.map(function (e) { return e.id; }).join(','), '3,2,1');
});
test('log: today is written the way a date input expects', function () {
  equal(logDateString(new Date(2026, 0, 5)), '2026-01-05');
});

test('photo: fills unanswered questions from the AI result', function () {
  var answers = {};
  var filled = applyPhotoResult(ankle, answers, {isInjury: true, description: '', deformity: 'unknown', swelling: 'severe'});
  equal(filled.join(','), 'swelling');
  equal(answers.swelling, 'severe');
});
test('photo: never overwrites an answer the person gave', function () {
  var answers = {swelling: 'mild'};
  equal(applyPhotoResult(ankle, answers, {isInjury: true, description: '', deformity: 'unknown', swelling: 'severe'}).length, 0);
  equal(answers.swelling, 'mild');
});
test('photo: cannot rule out a warning sign (ankle deformity "no" is ignored)', function () {
  var answers = {};
  applyPhotoResult(ankle, answers, {isInjury: true, description: '', deformity: 'no', swelling: 'unknown'});
  equal(answers.deformity, undefined);
});
test('photo: a photo without an injury fills nothing', function () {
  equal(applyPhotoResult(ankle, {}, {isInjury: false, description: '', deformity: 'yes', swelling: 'severe'}).length, 0);
});
test('photo: the schema only allows permitted values plus "unknown"', function () {
  equal(photoSchema(ankle).properties.deformity.enum.join(','), 'yes,unknown');
  equal(photoSchema(ankle).properties.swelling.enum.join(','), 'mild,moderate,severe,unknown');
});
test('photo: every check points at a real question and real answers', function () {
  Object.keys(PHOTO_CHECKS).forEach(function (id) {
    var injury = findInjury(id);
    if (!injury) throw new Error('no injury ' + id);
    PHOTO_CHECKS[id].forEach(function (check) {
      var question = findQuestion(injury, check.question);
      if (!question) throw new Error(id + ' has no question ' + check.question);
      (check.allow || []).forEach(function (value) {
        if (!question.options.some(function (o) { return o.value === value; })) throw new Error(id + '.' + check.question + ' has no answer ' + value);
      });
    });
  });
});
test('photo: injuries with nothing visible get no photo checks', function () {
  equal(photoChecks(findInjury('concussion')).length, 0);
});

var goodCase = {injury: 'ankle', nickname: '', story: 'Rolled my ankle playing basketball.', treatment: '', recovery: '', lesson: ''};
test('cases: a complete case has no problems', function () {
  equal(caseProblems(caseFromForm(goodCase, 'en')).length, 0);
});
test('cases: the story is required and needs 10 characters', function () {
  equal(caseProblems(caseFromForm(withAnswer(goodCase, 'story', '   '), 'en'))[0].problem, 'missing');
  equal(caseProblems(caseFromForm(withAnswer(goodCase, 'story', 'Too short'), 'en'))[0].problem, 'tooShort');
});
test('cases: too long a field is rejected', function () {
  equal(caseProblems(caseFromForm(withAnswer(goodCase, 'nickname', new Array(32).join('x')), 'en'))[0].field, 'nickname');
});
test('cases: an unknown injury is rejected', function () {
  equal(caseProblems(caseFromForm(withAnswer(goodCase, 'injury', 'knee'), 'en'))[0].field, 'injury');
});
test('cases: caseFromForm trims text and drops unknown fields', function () {
  var c = caseFromForm({injury: 'ankle', story: '  hello there friend  ', extra: 'x'}, 'zh');
  equal(c.story, 'hello there friend');
  equal(c.lang, 'zh');
  equal(c.extra, undefined);
});
test('cases: filter by injury keeps the order', function () {
  var list = [{id: 1, injury: 'ankle'}, {id: 2, injury: 'wound'}, {id: 3, injury: 'ankle'}];
  equal(filterCases(list, 'ankle').map(function (c) { return c.id; }).join(','), '1,3');
  equal(filterCases(list, '').length, 3);
});
test('cases: dates show as year-month-day', function () {
  equal(formatCaseDate(new Date(2026, 9, 6)), '2026-10-06');
});

test('missingAnswers lists unanswered questions', function () {
  equal(missingAnswers(ankle, {walk: 'yes'}).join(','), 'deformity,bonePain,swelling');
});

// Every answer combination must give a level that has "where" advice, and
// every text must exist in both languages.
INJURIES.forEach(function (injury) {
  test(injury.id + ': every answer combination has advice', function () {
    var combos = [{}];
    injury.questions.forEach(function (q) {
      var next = [];
      combos.forEach(function (c) { q.options.forEach(function (o) { next.push(withAnswer(c, q.id, o.value)); }); });
      combos = next;
    });
    combos.forEach(function (c) {
      var advice = buildAdvice(injury, c);
      if (!LEVELS[advice.level] || !advice.where || advice.where.length === 0) throw new Error('no advice for ' + JSON.stringify(c));
    });
  });
  test(injury.id + ': all text is in English and Chinese', function () {
    (function check(value, path) {
      if (value && typeof value === 'object') {
        if ('en' in value || 'zh' in value) {
          if (!value.en || !value.zh) throw new Error('missing translation at ' + path);
          return;
        }
        Object.keys(value).forEach(function (k) { check(value[k], path + '.' + k); });
      }
    })(injury, injury.id);
  });
});

function showResults() {
var failed = results.filter(function (r) { return !r.ok; }).length;
document.getElementById('summary').textContent = failed ? failed + ' of ' + results.length + ' tests failed' : 'All ' + results.length + ' tests passed';
document.getElementById('summary').className = failed ? 'fail' : 'pass';
results.forEach(function (r) {
  var li = document.createElement('li');
  li.className = r.ok ? 'pass' : 'fail';
  li.textContent = (r.ok ? '✓ ' : '✗ ') + r.name + (r.msg ? ': ' + r.msg : '');
  document.getElementById('log').appendChild(li);
});
}

// Opens the real page in a hidden frame and clicks the ES button, the way a
// visitor would. Puts back the visitor's saved language afterwards, since the
// frame shares this site's storage.
function testSpanishSwitch() {
  var saved = null;
  try { saved = localStorage.getItem('injury-helper-lang'); } catch (e) { /* storage blocked */ }
  return new Promise(function (resolve) {
    var frame = document.createElement('iframe');
    frame.style.display = 'none';
    frame.src = 'index.html';
    frame.onload = function () {
      var page = frame.contentWindow;
      var doc = frame.contentDocument;
      test('language: the ES button switches the interface to Spanish', function () {
        var button = doc.querySelector('#langs [data-lang="es"]');
        if (!button) throw new Error('there is no ES button');
        button.click();
        equal(doc.documentElement.lang, 'es');
        equal(doc.getElementById('navAssess').textContent, 'Revisar mi lesión');
        equal(doc.getElementById('startBtn').textContent, 'Empezar la evaluación');
      });
      test('language: Spanish has every interface text that English has', function () {
        if (!page.T.es) throw new Error('there is no Spanish interface text');
        Object.keys(page.T.en).forEach(function (key) {
          if (!page.T.es[key]) throw new Error('Spanish is missing ' + key);
        });
      });
      try {
        if (saved === null) localStorage.removeItem('injury-helper-lang');
        else localStorage.setItem('injury-helper-lang', saved);
      } catch (e) { /* storage blocked: nothing was saved either */ }
      frame.remove();
      resolve();
    };
    document.body.appendChild(frame);
  });
}

// firestore.rules must accept exactly what the page lets people post.
var rulesChecked = fetch('firestore.rules').then(function (r) { return r.text(); }).then(function (rules) {
  test('rules: list every injury id', function () {
    INJURIES.forEach(function (injury) {
      if (rules.indexOf("'" + injury.id + "'") === -1) throw new Error('rules miss ' + injury.id);
    });
  });
  test('rules: use the same length limits as the form', function () {
    Object.keys(CASE_FIELDS).forEach(function (field) {
      var limits = CASE_FIELDS[field];
      var expected = 'isText(c.' + field + ', ' + (limits.min || 0) + ', ' + limits.max + ')';
      if (rules.indexOf(expected) === -1) throw new Error('rules should contain ' + expected);
    });
  });
}).catch(function (e) {
  results.push({name: 'rules: firestore.rules can be read', ok: false, msg: e.message});
});
// A saved record must come back when the page is opened again. The test
// record is removed afterwards so it never shows up in the real log.
var logStorageChecked = logStore.add({date: '2000-01-01', text: 'test record', photo: null, createdAt: 0}).then(function (id) {
  return logStore.all().then(function (entries) {
    test('log: a saved record can be read back', function () {
      var found = entries.filter(function (e) { return e.id === id; })[0];
      equal(found && found.text, 'test record');
    });
    return logStore.remove(id);
  }).then(logStore.all).then(function (entries) {
    test('log: a deleted record is gone', function () {
      equal(entries.some(function (e) { return e.id === id; }), false);
    });
  });
}).catch(function (e) {
  results.push({name: 'log: records can be stored in this browser', ok: false, msg: String(e && e.message || e)});
});
Promise.all([rulesChecked, testSpanishSwitch(), logStorageChecked]).then(showResults);
</script>
</body>
</html>
