<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>运动损伤急救助手 · Sports Injury Helper</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f4e79">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Injury Helper">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&family=Noto+Serif+SC:wght@600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
:root{
  --bg:#f4f6f9;--card:#fff;--text:#1b2733;--muted:#56626f;--line:#d9e0e8;
  --acc:#1f4e79;--acc-dark:#163a5c;--on-acc:#fff;--acc-soft:#e7eef6;--tint:#f0f4f8;--shadow:0 1px 3px rgba(20,40,70,.08);
  --red:#c62828;--red-soft:#fdecec;--orange:#d9480f;--orange-soft:#fff1e6;
  --yellow:#a86400;--yellow-soft:#fff8e1;--green:#2e7d32;--green-soft:#e8f5e9;
  --sans:"IBM Plex Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;
  --serif:"Source Serif 4","Noto Serif SC","Songti SC",SimSun,Georgia,serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1620;--card:#17212c;--text:#e6ebf1;--muted:#9eabb9;--line:#2b3846;
  --acc:#7fb0e0;--acc-dark:#a6c8ea;--on-acc:#0f1620;--acc-soft:#1c2b3c;--tint:#141e29;--shadow:none;
  --red:#ff6b6b;--red-soft:#3a1d1f;--orange:#ff9b5c;--orange-soft:#3a2617;
  --yellow:#f2c14e;--yellow-soft:#352d17;--green:#6fcf73;--green-soft:#1c3220;
}}
*{box-sizing:border-box}
/* Elements with display rules below must still disappear when hidden. */
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.6 var(--sans)}
/* Headings in a serif, like a printed medical handbook; body text in a plain sans for easy reading on phones. */
h1,h2,h3{font-family:var(--serif)}
html,body{overflow-x:clip}
html{scroll-padding-top:calc(var(--header-height,120px) + 10px)}
main{max-width:680px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:21px;font-weight:700;margin:0;line-height:1.3;letter-spacing:.01em}
h2{font-size:20px;font-weight:600;margin:0 0 10px}
h3{font-size:17px;font-weight:600;margin:0 0 6px}
button{font:inherit;cursor:pointer;border:0;border-radius:4px}
.lang-menu{flex:0 0 auto;position:relative}
#langBtn{display:inline-flex;align-items:center;gap:6px;background:var(--card);color:var(--text);border:1px solid var(--line);padding:8px 12px;min-height:40px;font-size:15px;white-space:nowrap}
#langBtn svg{width:18px;height:18px;color:var(--acc)}
#langBtn[aria-expanded="true"]{border-color:var(--acc)}
.lang-list{position:absolute;inset-inline-end:0;top:calc(100% + 4px);z-index:20;min-width:160px;margin:0;padding:4px;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 14px rgba(20,40,70,.18)}
.lang-list button{display:flex;justify-content:space-between;width:100%;background:none;color:var(--text);text-align:start;padding:10px 12px;min-height:44px;font-size:16px}
.lang-list button:hover{background:var(--acc-soft)}
.lang-list button[aria-current="true"]{color:var(--acc);font-weight:600}
.lang-list button[aria-current="true"]::after{content:"✓"}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.alert{background:var(--red-soft);border-color:var(--red)}
.alert h2{color:var(--red)}
.alert ul{margin:0 0 8px;padding-inline-start:20px}
.alert .numbers{font-weight:700;margin:0}
.muted{color:var(--muted);font-size:15px}
.injuries{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.injury{background:var(--card);color:var(--text);border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;text-align:start;min-height:72px}
.injury strong{display:block;font-size:18px;font-weight:600;color:var(--acc)}
.injury small{display:block;color:var(--muted);font-size:14px}
.injury:hover{border-color:var(--acc)}
.injury[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);box-shadow:inset 0 0 0 1px var(--acc)}
.welcome{border-inline-start:4px solid var(--acc)}
.welcome h2{margin:0 0 2px;color:var(--acc)}
.welcome p{margin:0}
fieldset{border:0;margin:0 0 16px;padding:0}
fieldset.missing legend{color:var(--red)}
legend{font-weight:600;margin-bottom:8px;padding:0}
.options{display:flex;flex-wrap:wrap;gap:8px}
.options label{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:4px;padding:10px 14px;cursor:pointer;min-height:44px}
.options input{width:18px;height:18px;margin:0;accent-color:var(--acc)}
.options label:has(input:checked){border-color:var(--acc);background:var(--acc-soft)}
.primary{background:var(--acc);color:var(--on-acc);font-weight:600;padding:13px 22px;width:100%;font-size:18px}
.primary:hover{background:var(--acc-dark)}
.secondary{background:transparent;color:var(--acc);border:1.5px solid var(--acc);padding:10px 18px;font-weight:600}
.secondary:hover{background:var(--acc-soft)}
.error{color:var(--red);font-weight:600;margin:10px 0 0}
.photo{border:1.5px dashed var(--line);border-radius:6px;padding:14px;margin-bottom:18px}
.photo .muted{margin:0 0 10px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.file-btn{display:inline-block;position:relative;border-radius:4px;cursor:pointer}
.file-btn:focus-within{outline:2px solid var(--acc);outline-offset:2px}
.photo-result{display:flex;gap:12px;align-items:flex-start;margin-top:12px}
.photo-result img{width:96px;height:96px;object-fit:cover;border-radius:4px;flex:0 0 auto;background:var(--line)}
.photo-result p{margin:0 0 6px}
#photoDesc{font-style:italic}
.tag{font-size:12px;font-weight:600;color:var(--acc);background:var(--acc-soft);border-radius:3px;padding:1px 6px;margin-inline-start:4px;white-space:nowrap}
.level{border-width:2px}
.level h2{margin-bottom:4px}
.level p{margin:0}
.level-emergency{background:var(--red-soft);border-color:var(--red)}.level-emergency h2{color:var(--red)}
.level-today{background:var(--orange-soft);border-color:var(--orange)}.level-today h2{color:var(--orange)}
.level-soon{background:var(--yellow-soft);border-color:var(--yellow)}.level-soon h2{color:var(--yellow)}
.level-selfCare{background:var(--green-soft);border-color:var(--green)}.level-selfCare h2{color:var(--green)}
.step-num{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--on-acc);font-size:15px;margin-inline-end:8px;vertical-align:2px}
.advice-now,.advice-where,.advice-rehab,.advice-comfort{border-top:4px solid var(--acc)}
.comfort-stage{border-inline-start:3px solid var(--acc);padding:4px 0;padding-inline-start:12px;margin-top:12px}
.comfort-stage .when{font-weight:700}
.comfort-stage p{margin:2px 0}
.comfort-stage .try{color:var(--muted);font-size:15px}
.counseling{background:var(--tint);border:1px solid var(--line);border-radius:6px;padding:14px;margin-top:16px}
.counseling h3{color:var(--acc)}
.counselor{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0}
.counselor+.counselor{border-top:1px solid var(--line)}
.counselor .detail{color:var(--muted);font-size:14px}
.counselor .links{display:flex;gap:8px}
.counselor a{background:var(--acc);color:var(--on-acc);text-decoration:none;font-weight:600;border-radius:4px;padding:8px 16px;min-height:40px;display:inline-flex;align-items:center}
ol.steps,ul.points{margin:0;padding-inline-start:22px}
ol.steps li,ul.points li{margin-bottom:6px}
.phase{border-inline-start:3px solid var(--acc);padding:4px 0;padding-inline-start:12px;margin-top:14px}
.phase .when{font-weight:700}
.phase .goal{color:var(--muted);font-size:15px;margin-bottom:4px}
.phase ul{margin:0;padding-inline-start:20px}
.actions{display:flex;justify-content:center;margin-top:6px}
.actions{gap:10px;flex-wrap:wrap}
.cases-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.cases-head h2{margin:0}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-weight:600;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;font:inherit;color:var(--text);background:var(--card);border:1.5px solid var(--line);border-radius:4px;padding:10px 12px}
.field textarea{resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:var(--acc)}
#caseForm{border:1.5px solid var(--line);border-radius:6px;padding:14px;margin:12px 0}
.success{color:var(--green);font-weight:600}
.filter{max-width:280px;margin-top:12px}
.case{border-top:1px solid var(--line);padding:12px 0}
.case-meta{color:var(--muted);font-size:14px;margin-bottom:4px}
.case-meta strong{color:var(--text)}
.case p{margin:0 0 6px;white-space:pre-wrap}
.case dl{margin:0}
.case dt{font-weight:600;font-size:15px;margin-top:6px}
.case dd{margin:0;white-space:pre-wrap}
.learn-intro{margin:-4px 0 16px}
.learn-part details{border-top:1px solid var(--line)}
.learn-part summary{cursor:pointer;font-weight:600;color:var(--acc);padding:12px 0;min-height:44px}
.learn-part details ul{margin:0 0 14px;padding-inline-start:22px}
.learn-part details li{margin-bottom:6px}
.log-date input{max-width:240px}
/* 0-5 and 6-10 on two rows on phones, all eleven on one row when there is room. */
.pain-scale{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:560px}
@media (min-width:520px){.pain-scale{grid-template-columns:repeat(11,1fr)}}
.pain-scale label{position:relative;min-height:40px;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--line);border-radius:4px;cursor:pointer;font-weight:600}
.pain-scale label:has(input:checked){background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.pain-scale label:focus-within{outline:2px solid var(--acc);outline-offset:2px}
#logPainHint{margin:0}
.pain-name{font-weight:600;margin:12px 0 6px}
.log-photo{display:block;max-width:220px;max-height:220px;object-fit:cover;border-radius:4px;margin-top:10px}
.link-btn{background:none;color:var(--acc);text-decoration:underline;padding:8px;margin-inline-start:6px}
.account-lock{max-width:480px;margin-inline:auto;border-top:4px solid var(--acc)}
.account-modes{display:flex;gap:8px;margin:4px 0 14px}
.account-modes button{flex:1;background:transparent;color:var(--text);border:1.5px solid var(--line);padding:10px 12px;font-weight:600}
.account-modes button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.account-lock .primary:disabled{opacity:.6}
.account-lock .link-btn{margin:8px 0 0;padding:8px 0}
.account-lock .actions{justify-content:flex-start;margin-top:12px}
.account-bar{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:4px 8px;margin:0 0 8px;font-size:15px;color:var(--muted)}
.account-bar .link-btn{margin:0}
.log-entry img{display:block;max-width:100%;max-height:360px;object-fit:contain;border-radius:4px;margin:6px 0 8px}
.log-entry .secondary{padding:6px 14px;font-size:15px}
#subPick{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.site-header{position:sticky;top:0;z-index:10;background:var(--card);border-top:4px solid var(--acc);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
h1 a{color:var(--acc)}
.site-header .wrap{max-width:680px;margin:0 auto;padding:10px 16px 8px;display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.site-header h1{flex:1 1 0;min-width:0}
.tabs{order:3;width:100%;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
/* On phones the menu scrolls sideways; the fading far edge shows there is more. */
.tabs.more-end{-webkit-mask-image:linear-gradient(90deg,#000 75%,transparent);mask-image:linear-gradient(90deg,#000 75%,transparent)}
[dir=rtl] .tabs.more-end{-webkit-mask-image:linear-gradient(270deg,#000 75%,transparent);mask-image:linear-gradient(270deg,#000 75%,transparent)}
.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);font-weight:600;border-radius:4px;padding:8px 14px;min-height:40px;display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--line)}
.tabs a[aria-current="page"]{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
/* Home stays at the start while the other sections scroll under it. */
.tabs a[data-view="home"]{position:sticky;inset-inline-start:0;z-index:1;box-shadow:6px 0 0 var(--card)}
[dir=rtl] .tabs a[data-view="home"]{box-shadow:-6px 0 0 var(--card)}
.place{padding:12px 0}
.place+.place{border-top:1px solid var(--line)}
.place .detail{color:var(--muted);font-size:15px}
.place .links{display:flex;gap:8px;margin-top:8px}
.city-form{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.city-form .field{flex:1 1 220px;margin-bottom:0}
.city-form .primary{width:auto;flex:0 0 auto}
#cityResult h3{margin-top:16px}
.city-note{font-size:14px;margin:12px 0 0}
.plan-progress{font-weight:600;margin:4px 0 8px}
.plan-today{list-style:none;margin:0 0 12px;padding:0}
.plan-today>li{border-top:1px solid var(--line)}
.plan-today label{display:flex;align-items:center;gap:12px;padding:10px 0;min-height:44px;cursor:pointer}
.plan-today input{width:22px;height:22px;flex:0 0 auto;accent-color:var(--acc)}
.plan-today .done span{color:var(--muted);text-decoration:line-through}
.plan-today small{color:var(--muted);font-size:15px;margin-inline-start:6px}
.plan-form{border:1px solid var(--line);border-radius:6px;padding:14px;margin:12px 0;background:var(--tint)}
.plan-form h3{margin-top:0}
.day-picks{display:flex;flex-wrap:wrap;gap:6px}
.day-picks label{position:relative}
.day-picks span{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:40px;padding:0 10px;border:1.5px solid var(--line);border-radius:4px;background:var(--card)}
.day-picks input:checked+span{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:600}
.day-picks input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.plan-dates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan-dates .field,.plan-dates input{min-width:0}
@media (max-width:420px){.plan-dates{grid-template-columns:1fr}}
.calendar-row .primary:disabled{opacity:.45;cursor:not-allowed}
.plan-buttons{display:flex;gap:8px}
.plan-buttons .primary{width:auto;flex:1}
.plan-all{margin-top:14px}
.plan-all summary{cursor:pointer;font-weight:600;color:var(--acc);padding:10px 0;min-height:44px}
.plan-item{border-top:1px solid var(--line);padding:10px 0}
.plan-item .case-meta{margin:2px 0 6px}
.plan-item small{color:var(--muted);font-weight:400;font-size:15px;margin-inline-start:6px}
.plan-item button{margin-inline-end:6px}
.plan-calendar{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.calendar-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.calendar-row .field{margin-bottom:0}
.calendar-row .primary{width:auto}
.rehab-to-plan{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.rehab-to-plan .success,.rehab-to-plan .muted{margin:10px 0 0}
.go-plan{display:inline-flex;align-items:center;min-height:40px;margin-top:10px;text-decoration:none;border-radius:4px}
.plan-moves{margin:0 0 6px;margin-inline-start:34px;padding-inline-start:18px;color:var(--muted);font-size:15px}
.plan-moves li{margin:2px 0}
.home-today{display:block;text-decoration:none;color:var(--text);border-inline-start:4px solid var(--acc);margin:0 0 12px}
.home-today strong{color:var(--acc)}
.translated-note{margin:0;padding:6px 16px;background:var(--tint);color:var(--muted);border-bottom:1px solid var(--line);font-size:14px;text-align:center}
.offline-banner{margin:0;padding:10px 16px;background:var(--yellow-soft);color:var(--text);border-bottom:1px solid var(--yellow);font-size:15px;text-align:center}
.install{border-inline-start:4px solid var(--acc);margin:0 0 18px}
.install h2{margin:0 0 4px;font-size:19px}
.install p{margin:0}
.install .actions{justify-content:flex-start;margin-top:12px}
.install .primary{width:auto}
.install .link-btn{margin:0;padding:8px 0}
.rts-result{border-top:1px solid var(--line);margin-top:16px;padding-top:4px}
.rts-result h3{margin-top:12px}
.rts-note{font-size:14px;margin:12px 0 0}
.rts-result h4{margin:14px 0 2px}
.risk{margin-bottom:16px}
.warmup{margin-bottom:16px}
.warmup-run{text-align:center}
.warmup-run h3{font-size:24px;margin:4px 0 8px;color:var(--acc)}
.warmup-clock{font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;margin:8px 0;color:var(--acc)}
.warmup-clock.paused{color:var(--muted)}
.warmup-buttons{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.warmup-buttons .primary{width:auto;flex:1 1 140px}
.warmup-buttons .secondary{flex:1 1 100px;min-height:48px}
#warmupList{text-align:start}
.training{margin-bottom:16px}
.training-list{list-style:none;margin:0;padding:0}
.training-list li{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:8px 0}
.training-list .secondary{padding:6px 14px;font-size:15px}
.training-jump{color:var(--red);font-weight:600}
.gear{margin-bottom:16px}
#gearAdvice{margin-bottom:8px}
.weather{margin-bottom:16px}
.weather-here{margin-top:10px}
.weather-good{color:var(--green);font-weight:600}
.dv h3{margin-top:18px}
.dv fieldset{margin-bottom:14px}
.dv .options label small{display:block;color:var(--muted);font-size:14px}
.dv .options label:has(small){align-items:flex-start;flex:1 1 220px}
.dv .options input{flex-shrink:0}
.dv-score-meaning{margin:6px 0 0}
.dv-note{border:1.5px solid var(--acc);border-radius:6px;padding:12px 14px;margin:16px 0;background:var(--acc-soft)}
.dv-note h3{margin-top:0}
.dv-note-text p{margin:0 0 4px}
.dv-note-text{margin-bottom:10px}
.dv-bring label{flex:1 1 100%}
.dv-report{margin:8px 0 0;padding:8px 0}
.dv-asks-tip{display:block;color:var(--muted);font-size:15px}
.search-btn{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;background:var(--card);color:var(--acc);border:1px solid var(--line)}
.search-btn svg{width:20px;height:20px}
.search-btn[aria-expanded="true"]{border-color:var(--acc);background:var(--acc-soft)}
.search-panel{order:4;width:100%;padding:4px 0 6px}
.search-box input{width:100%;font:inherit;font-size:17px;color:var(--text);background:var(--card);border:1.5px solid var(--acc);border-radius:6px;padding:11px 14px}
.search-box input:focus{outline:2px solid var(--acc);outline-offset:0}
.search-panel .search-results{max-height:60vh;overflow-y:auto}
.search-results:empty{display:none}
.search-results{margin-top:6px;text-align:start}
.search-hint{font-size:15px;color:var(--muted);margin:6px 0}
.search-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.search-chips button{background:var(--acc-soft);color:var(--acc);border:1px solid var(--line);border-radius:16px;padding:6px 12px;min-height:36px;font-size:15px}
.search-list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--card);overflow:hidden}
.search-list li+li{border-top:1px solid var(--line)}
.search-list button{display:block;width:100%;text-align:start;background:none;color:var(--text);padding:10px 14px;min-height:48px}
.search-list button:hover,.search-list button:focus{background:var(--acc-soft);outline:none}
.search-type{display:inline-block;font-size:12px;font-weight:600;color:var(--acc);border:1px solid var(--acc);border-radius:10px;padding:0 8px;margin-inline-end:8px;vertical-align:2px}
.search-list strong{font-weight:600}
.search-list small{display:block;color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.learn-toc{margin:0 0 16px}
.learn-toc-list{display:flex;flex-wrap:wrap;gap:8px}
.learn-toc-list button{background:var(--card);color:var(--acc);border:1.5px solid var(--acc);border-radius:18px;padding:7px 14px;min-height:40px;font-size:15px;font-weight:600}
.learn-toc-list button:hover{background:var(--acc-soft)}
.toc-back{display:block;width:fit-content;margin:-8px 0 2px;margin-inline-start:auto;padding:6px 0;font-size:14px}
.flash-outline{animation:flash-outline 1.6s ease-out}
@keyframes flash-outline{0%,40%{box-shadow:0 0 0 3px #e8a33d}100%{box-shadow:0 0 0 3px transparent}}
@media (prefers-reduced-motion:reduce){.flash-outline{animation:none;outline:3px solid #e8a33d}}
.tour-again{margin:10px 0 0}
.tour-again .link-btn{margin:0;padding:8px 0}
.tour-backdrop{position:fixed;inset:0;z-index:20;background:rgba(10,20,35,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.tour-backdrop[hidden]{display:none}
.tour-card{background:var(--card);color:var(--text);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.3);width:100%;max-width:460px;max-height:calc(100vh - 32px);overflow-y:auto;padding:16px 18px}
.tour-card h2{margin:6px 0 8px;color:var(--acc)}
.tour-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tour-dots{display:flex;gap:6px}
.tour-dots span{width:8px;height:8px;border-radius:50%;background:var(--line)}
.tour-dots span.on{background:var(--acc);width:20px;border-radius:4px}
.tour-skip{margin:0;padding:8px 0}
.tour-body{display:grid;gap:8px;margin:10px 0}
.tour-body:empty{display:none}
.tour-body .secondary,.tour-body .primary{width:100%;min-height:48px}
.tour-nav{display:flex;gap:8px;margin-top:12px}
.tour-nav button{flex:1;min-height:48px}
.tour-nav .primary{width:auto}
.tour-sos{color:var(--red);font-size:14px;font-weight:600;margin:12px 0 0;text-align:center}
/* While the tour is open the header sits above the dimmed page, so the
   outlined tab can be seen; it cannot be clicked until the tour closes. */
body.touring .site-header{z-index:21;pointer-events:none}
.tabs a.tour-target{outline:3px solid #e8a33d;outline-offset:-3px;animation:tour-pulse 1.2s ease-in-out 3}
@keyframes tour-pulse{50%{outline-color:transparent}}
@media (prefers-reduced-motion:reduce){.tabs a.tour-target{animation:none}}
@media (max-width:600px){
  .tour-backdrop{align-items:flex-end;padding:0}
  .tour-card{max-width:none;border-radius:14px 14px 0 0;max-height:70vh}
}
.trend{margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.trend svg{display:block;width:100%;height:auto}
.trend .grid{stroke:var(--line);stroke-width:1}
.trend .axis-label{fill:var(--muted);font-size:13px}
.trend polyline{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.trend-legend{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px}
.trend-legend li::before{content:"";display:inline-block;width:14px;height:4px;border-radius:2px;margin-inline-end:6px;vertical-align:middle;background:currentColor}
.trend-rest{color:var(--acc);stroke:var(--acc);fill:var(--acc)}
.trend-exercise{color:var(--orange);stroke:var(--orange);fill:var(--orange)}
.trend-legend li span{color:var(--text)}
/* While the report is open it is the only thing in the log, and the only thing printed. */
#view-log.reporting > section:not(#report){display:none}
.report-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
#backupCard .plan-buttons{flex-wrap:wrap}
#backupCard .plan-buttons>*{flex:1 1 180px;text-align:center}
.backup-ask{background:var(--acc-soft);border-radius:4px;padding:12px;margin-top:12px}
.backup-ask p{margin:0 0 10px}
.report-actions button{width:auto}
#reportSheet h2{margin:0}
#reportSheet h3{margin:20px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.report-range{font-weight:600;margin:4px 0 2px}
#reportSheet .trend{border-bottom:0;margin-bottom:0;padding-bottom:0}
.report-exercises{margin:0;padding-inline-start:22px}
.report-exercises small{color:var(--muted);font-size:15px}
.report-record{padding:10px 0}
.report-record+.report-record{border-top:1px solid var(--line)}
.report-record p{margin:4px 0 0;white-space:pre-wrap}
.report-record img{display:block;max-width:100%;max-height:320px;object-fit:contain;border-radius:4px;margin-top:8px}
@media print{
  :root{--bg:#fff;--card:#fff;--text:#111;--muted:#444;--line:#ccc;--acc:#1f4e79;--orange:#d9480f}
  body:has(#view-log.reporting:not([hidden])) > :not(main),
  body:has(#view-log.reporting:not([hidden])) main > :not(#view-log),
  .report-actions{display:none !important}
  #report{border:0;box-shadow:none;padding:0;margin:0}
  .report-record{break-inside:avoid}
}
.place a{background:var(--acc);color:var(--on-acc);text-decoration:none;font-weight:600;border-radius:4px;padding:8px 14px;min-height:40px;display:inline-flex;align-items:center}
/* Cover photos are free under the Unsplash License; COVER_SLIDES in the
   script lists each one with its photographer. */
/* Photos change every few seconds behind a light veil that keeps the words readable. */
.cover{--veil:244,247,251;position:relative;overflow:hidden;background:#e7eef6;
  text-align:center;margin:-16px calc(50% - 50vw) 18px;padding:48px 16px;min-height:calc(100vh - 110px);display:flex;align-items:center}
.cover-slide{position:absolute;inset:0;background-size:cover;background-position:var(--position);opacity:0;transition:opacity .9s ease}
.cover-slide.on{opacity:1}
.cover-veil{position:absolute;inset:0;background:rgba(var(--veil),.8)}
.cover-inner{position:relative;z-index:1}
.cover-dots{position:absolute;left:0;right:0;bottom:10px;z-index:1;display:flex;justify-content:center;gap:2px}
.cover-dots button{width:32px;height:32px;background:none;padding:0;display:flex;align-items:center;justify-content:center}
.cover-dots button::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--acc);opacity:.3}
.cover-dots button[aria-current="true"]::before{opacity:1}
@media (prefers-reduced-motion:reduce){.cover-slide{transition:none}}
/* Soft glow behind the words so they stay sharp over the photo. */
.cover-text{text-shadow:0 0 18px rgba(var(--veil),.9)}
.cover-inner{max-width:1180px;margin:0 auto}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.facts div{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--acc);border-radius:4px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.facts strong{display:block;font-size:28px;font-weight:700;color:var(--acc);line-height:1.2}
.facts span{color:var(--muted);font-size:15px}
.section-title{font-size:22px;font-weight:600;margin:0 0 12px}
.row-2>.card{margin-bottom:14px}
.site-footer{background:#13283f;color:#e3eaf2;margin-top:24px}
.site-footer .wrap{max-width:1180px;margin:0 auto;padding:28px 16px;text-align:center}
.site-footer p{margin:0 0 8px}
.footer-name{font-weight:600;font-size:18px}
.footer-note{color:#a9b8c8;font-size:14px}
.footer-note a{color:inherit}
.slogan{font-size:28px;font-weight:700;line-height:1.3;margin:14px 0 12px;color:var(--acc)}
.cover-intro{color:var(--text);margin:0 auto 22px;max-width:460px}
.cover-sos{color:var(--red);font-size:15px;font-weight:600;margin:16px 0 0}
.features{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.feature{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;color:var(--text);text-decoration:none;box-shadow:var(--shadow)}
.feature svg{width:30px;height:30px;color:var(--acc);margin-bottom:6px}
.feature strong{color:var(--acc);font-weight:600}
.feature:hover{border-color:var(--acc)}
h1 a{text-decoration:none}
.chat-log{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.bubble{max-width:85%;padding:10px 14px;border-radius:8px;white-space:pre-wrap}
.bubble.me{align-self:flex-end;background:var(--acc);color:var(--on-acc);border-end-end-radius:2px}
.bubble.ai{align-self:flex-start;background:var(--acc-soft);color:var(--text);border-end-start-radius:2px}
.chat-form{display:flex;gap:8px;align-items:flex-end}
.chat-form textarea{flex:1;font:inherit;color:var(--text);background:var(--card);border:1.5px solid var(--line);border-radius:4px;padding:10px 12px;resize:vertical}
.chat-form textarea:focus{outline:2px solid var(--acc);border-color:var(--acc)}
.chat-form .primary{width:auto;padding:12px 18px;font-size:17px}
.chat-form .primary:disabled{opacity:.45;cursor:not-allowed}
.group-log{max-height:420px;overflow-y:auto;padding:4px 2px}
.bubble.other{align-self:flex-start;background:var(--tint);color:var(--text);border:1px solid var(--line);border-end-start-radius:2px}
.bubble-meta{font-size:13px;opacity:.8;margin-bottom:2px}
.bubble .link-btn{font-size:13px;padding:4px 0 0;margin:0;display:block}
.group-name{display:flex;gap:8px;align-items:flex-end}
.group-name .field{flex:1;margin:0}
.group-name .primary{width:auto}
.group-you{margin:8px 0}
.group-you .link-btn{margin:0}
.bubble .bubble-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.bubble .bubble-note{font-size:13px;opacity:.8;padding-top:4px}
.friend-requests{background:var(--acc-soft);border-radius:4px;padding:12px;margin:12px 0}
.friend-requests h3{margin:0 0 8px}
.friend-request{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:6px 0}
.friend-request .plan-buttons .primary{flex:none}
.friend-list{list-style:none;padding:0;margin:8px 0 0}
.friend-list button{display:flex;align-items:center;gap:8px;width:100%;min-height:48px;padding:10px 12px;background:var(--card);color:var(--text);border:1.5px solid var(--line);border-radius:4px;font:inherit;text-align:start;cursor:pointer;margin-bottom:8px}
.friend-list button:hover{border-color:var(--acc)}
.unread-dot{width:10px;height:10px;border-radius:50%;background:var(--red);margin-inline-start:auto;flex:none}
.private-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.private-head h3{margin:0}
.private-head .link-btn{margin:0;padding:8px 0}
.private-end{display:flex;flex-wrap:wrap;gap:20px;margin-top:12px}
.private-remove{color:var(--red);margin:0;padding:8px 0}
.blocked{margin-top:12px}
.blocked summary{cursor:pointer;color:var(--muted);padding:10px 0;min-height:44px}
.blocked-row{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:6px 0}
.blocked-row .link-btn{margin:0}
.chat-crisis{background:var(--red-soft);border:1.5px solid var(--red);border-radius:6px;padding:12px;color:var(--text);margin-top:10px}
.chat-crisis a{color:var(--red);font-weight:700}
@media (prefers-color-scheme:dark){.cover{--veil:15,22,32}.site-footer{background:#0a121b}}
/* Phones: a narrow screen crops the photos to a thin strip, so the cover is
   a plain light blue with the usual dark words instead, and the photos are
   not loaded. */
@media (max-width:899px){
  .cover{min-height:0;padding:56px 20px 48px;background:linear-gradient(160deg,#eef4fa 0%,#d9e6f3 100%);border-bottom:1px solid var(--line)}
  #coverSlides,.cover-veil,.cover-dots{display:none}
  .cover-text{text-shadow:none}
}
@media (max-width:899px) and (prefers-color-scheme:dark){
  .cover{background:linear-gradient(160deg,#17263a 0%,#1d3550 100%)}
}
/* Computers: a wide, full-window layout. Phones keep the single column. */
@media (min-width:900px){
  main,.site-header .wrap{max-width:1180px;padding-inline:32px}
  .site-header .wrap{flex-wrap:nowrap;padding-top:12px;padding-bottom:12px}
  .site-header h1{flex:0 0 auto;margin-inline-end:24px}
  .tabs{order:0;width:auto;flex:1 1 auto;gap:4px}
  .tabs a{background:none;border:0;border-radius:0;border-bottom:3px solid transparent;padding:8px 12px}
  .tabs a[aria-current="page"]{background:none;color:var(--acc);border-bottom-color:var(--acc)}
  .cover{text-align:start;padding:72px 32px;margin-bottom:28px;min-height:calc(100vh - 70px);
  }
  .cover-slide{background-position:var(--wide)}
  .cover-veil{background:linear-gradient(90deg,rgba(var(--veil),.94) 0%,rgba(var(--veil),.86) 38%,rgba(var(--veil),.35) 68%,rgba(var(--veil),.25) 100%)}
  .cover-inner{width:100%}
  .cover-text{max-width:700px}
  [dir=rtl] .cover-veil{background:linear-gradient(270deg,rgba(var(--veil),.94) 0%,rgba(var(--veil),.86) 38%,rgba(var(--veil),.35) 68%,rgba(var(--veil),.25) 100%)}
  .slogan{font-size:52px;margin-top:0}
  .cover-intro{font-size:20px;margin-inline-start:0;max-width:600px}
  .facts{grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:36px}
  .facts strong{font-size:40px}
  .section-title{font-size:28px}
  .features{grid-template-columns:repeat(4,1fr);gap:16px}
  .feature{padding:22px}
  .feature svg{width:36px;height:36px}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .injuries{grid-template-columns:repeat(5,1fr)}
  #view-comfort:not([hidden]),#view-log:not([hidden]),.learn-parts{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  #hospitalList,#cityHospitals{display:grid;grid-template-columns:1fr 1fr;column-gap:32px}
  .place+.place{border-top:0}
  .place{border-bottom:1px solid var(--line)}
  #view-cases{max-width:860px;margin:0 auto}
  #planCard{grid-column:1/-1}
}
@media (max-width:420px){.slogan{font-size:24px}h1{font-size:19px}.injury{padding:10px 12px}.injury strong{font-size:17px}}
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <h1><a href="#home" id="title"></a></h1>
    <nav class="tabs" id="tabs">
      <a href="#home" data-view="home"><span id="navHome"></span></a>
      <a href="#assess" data-view="assess"><span id="navAssess"></span></a>
      <a href="#comfort" data-view="comfort"><span id="navComfort"></span></a>
      <a href="#cases" data-view="cases"><span id="navCases"></span></a>
      <a href="#hospitals" data-view="hospitals"><span id="navHospitals"></span></a>
      <a href="#log" data-view="log"><span id="navLog"></span></a>
      <a href="#learn" data-view="learn"><span id="navLearn"></span></a>
    </nav>
    <div class="search-panel" id="searchPanel" hidden>
      <div class="search-box"><label class="visually-hidden" for="searchInput" id="searchLabel"></label><input id="searchInput" type="search" maxlength="60" autocomplete="off" enterkeyhint="search"></div>
      <div class="search-results" id="searchResults"></div>
    </div>
    <button type="button" class="search-btn" id="searchBtn" aria-expanded="false" aria-controls="searchPanel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button>
    <div class="lang-menu" id="langMenu">
      <button id="langBtn" aria-haspopup="true" aria-expanded="false" aria-controls="langList"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9M12 3c-2.5 2.6-3.8 5.6-3.8 9s1.3 6.4 3.8 9"/></svg>Language</button>
      <ul class="lang-list" id="langList" hidden>
        <li><button data-lang="en" lang="en">English</button></li>
        <li><button data-lang="zh" lang="zh-CN">中文</button></li>
        <li><button data-lang="es" lang="es">Español</button></li>
        <li><button data-lang="fr" lang="fr">Français</button></li>
        <li><button data-lang="ru" lang="ru">Русский</button></li>
        <li><button data-lang="ar" lang="ar" dir="rtl">العربية</button></li>
      </ul>
    </div>
  </div>
</header>
<p class="translated-note" id="translatedNote" hidden></p>
<p class="offline-banner" id="offlineBanner" role="status" hidden></p>
<main>

<!-- The recovery log and comfort sections need a sign-in (account.js). -->
<section class="card account-lock" id="accountLock" hidden>
  <h2 id="accountTitle"></h2>
  <p class="muted" id="accountIntro"></p>
  <p class="muted" id="accountStatus" role="status" hidden></p>
  <form id="accountForm" novalidate hidden>
    <div class="account-modes" id="accountModes" role="group">
      <button type="button" data-mode="signIn" id="accountModeSignIn"></button>
      <button type="button" data-mode="signUp" id="accountModeSignUp"></button>
    </div>
    <label class="field"><span id="accountEmailLabel"></span><input type="email" id="accountEmail" autocomplete="email" maxlength="100"></label>
    <label class="field" id="accountPasswordField"><span id="accountPasswordLabel"></span><input type="password" id="accountPassword" autocomplete="current-password" maxlength="100"></label>
    <label class="field" id="accountConfirmField"><span id="accountConfirmLabel"></span><input type="password" id="accountConfirm" autocomplete="new-password" maxlength="100"></label>
    <button type="submit" class="primary" id="accountSubmit"></button>
    <p class="error" id="accountError" role="alert" hidden></p>
    <p class="success" id="accountDone" role="status" hidden></p>
    <button type="button" class="link-btn" id="accountForgot"></button>
  </form>
  <div id="accountWait" hidden>
    <p id="accountWaitText"></p>
    <div class="actions">
      <button type="button" class="secondary" id="accountVerifiedBtn"></button>
      <button type="button" class="secondary" id="accountResendBtn"></button>
      <button type="button" class="secondary" id="accountOtherBtn"></button>
    </div>
    <p class="error" id="accountWaitError" role="alert" hidden></p>
    <p class="success" id="accountWaitDone" role="status" hidden></p>
  </div>
</section>
<div class="account-bar" id="accountBar" hidden><span id="accountWho"></span><button type="button" class="link-btn" id="accountSignOut"></button></div>

<div class="view" id="view-home" hidden>
  <a class="card home-today" id="homeToday" href="#log" hidden></a>
  <section class="cover">
    <div id="coverSlides" aria-hidden="true"></div>
    <div class="cover-veil"></div>
    <div class="cover-dots" id="coverDots"></div>
    <div class="cover-inner">
      <div class="cover-text">
        <p class="slogan" id="slogan"></p>
        <p class="cover-intro" id="coverIntro"></p>
        <p class="tour-again"><button type="button" class="link-btn" id="tourOpen"></button></p>
        <p class="cover-sos" id="coverSos"></p>
      </div>
    </div>
  </section>
  <section class="card install" id="installCard" hidden>
    <h2 id="installTitle"></h2>
    <p id="installText"></p>
    <div class="actions">
      <button type="button" class="primary" id="installBtn" hidden></button>
      <button type="button" class="link-btn" id="installDismiss"></button>
    </div>
  </section>
  <section class="facts">
    <div><strong>12</strong><span id="fact1"></span></div>
    <div><strong>3</strong><span id="fact2"></span></div>
    <div><strong>24h</strong><span id="fact3"></span></div>
    <div><strong id="languageCount"></strong><span id="fact4"></span></div>
  </section>
  <h2 class="section-title" id="featuresTitle"></h2>
  <div class="features">
    <a class="feature" href="#assess"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="1.5"/><path d="M9 4V3h6v1M9 11l2 2 4-4M9 17h6"/></svg><strong id="featAssess"></strong><span class="muted" id="featAssessText"></span></a>
    <a class="feature" href="#comfort"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><strong id="featComfort"></strong><span class="muted" id="featComfortText"></span></a>
    <a class="feature" href="#cases"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg><strong id="featCases"></strong><span class="muted" id="featCasesText"></span></a>
    <a class="feature" href="#hospitals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M12 8v8M8 12h8"/></svg><strong id="featHospitals"></strong><span class="muted" id="featHospitalsText"></span></a>
  </div>
</div>

<div class="view" id="view-assess">
<div class="row-2">
<section class="card welcome">
  <h2 id="welcomeTitle"></h2><p id="welcomeText"></p>
</section>

<section class="card alert" aria-labelledby="alertTitle">
  <h2 id="alertTitle"></h2>
  <ul id="redFlags"></ul>
  <p class="numbers" id="numbers"></p>
</section>
</div>

<section class="card">
  <h2 id="pickTitle"></h2>
  <div class="injuries" id="categories"></div>
  <div id="subPick" hidden>
    <h3 id="subTitle"></h3>
    <div class="injuries" id="injuries"></div>
  </div>
</section>

<section class="card" id="questionsCard" hidden>
  <h2 id="questionsTitle"></h2>
  <form id="questions" novalidate>

var LANG_KEY = 'injury-helper-lang';
var lang = loadLang();
var currentCategory = null;
var currentInjury = null;
var answers = {};
var showingResults = false;
// Photo state: which answers came from the photo, and what to show.

function loadLang() {
  try { var v = localStorage.getItem(LANG_KEY); return T[v] ? v : 'en'; } catch (e) { return 'en'; }
}
function saveLang() {
  try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* storage blocked: the choice just is not remembered */ }
}
function t(key) { return T[lang][key]; }
// Pick the current language from a {en, es, fr, ru, ar, zh} object; English when
// that language has no text for it.
function L(text) { return text[lang] || text.en; }
function $(id) { return document.getElementById(id); }

function fillList(listId, items) {
  var list = $(listId);
  list.innerHTML = '';
  items.forEach(function (item) {
    var li = document.createElement('li');
    li.textContent = L(item);
    list.appendChild(li);
  });
}

function isRightToLeft() {
  return lang === 'ar';
}

function renderStatic() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
  document.documentElement.dir = isRightToLeft() ? 'rtl' : 'ltr';
  document.title = t('title');
  ['title', 'welcomeTitle', 'welcomeText', 'alertTitle', 'numbers', 'pickTitle', 'subTitle', 'questionsTitle', 'firstAidTitle', 'whereTitle', 'rehabTitle', 'comfortTitle', 'counselingTitle', 'disclaimer',
   'navHome', 'navAssess', 'navComfort', 'navCases', 'navHospitals', 'navLog', 'navLearn', 'learnTitle', 'learnIntro', 'cityTitle', 'cityIntro', 'cityLabel', 'citySearch', 'hospitalsTitle', 'hospitalsIntro', 'hospitalsEmergency',
   'slogan', 'coverIntro', 'coverSos', 'featAssess', 'featAssessText', 'featComfort', 'featComfortText',
   'featCases', 'featCasesText', 'featHospitals', 'featHospitalsText', 'chatTitle', 'chatIntro', 'chatInputLabel', 'chatSend', 'chatCrisis',
   'fact1', 'fact2', 'fact3', 'fact4', 'featuresTitle', 'footerName', 'footerSos', 'photoCredit']
    .forEach(function (id) { $(id).textContent = t(id); });
  $('assessBtn').textContent = t('assess');
  $('restartBtn').textContent = t('restart');
  $('seeCasesBtn').textContent = t('seeCases');
  $('seeComfortBtn').textContent = t('seeComfort');
  $('langList').setAttribute('aria-label', t('langGroup'));
  // Languages Claude translated say so on every page.
  $('translatedNote').hidden = !T[lang].translatedNote;
  $('translatedNote').textContent = T[lang].translatedNote || '';
  // Counted from the Language menu, so the home card stays right when a language is added.
  $('languageCount').textContent = document.querySelectorAll('#langList [data-lang]').length;
  document.querySelectorAll('#langList button').forEach(function (b) {
    b.setAttribute('aria-current', b.dataset.lang === lang);
  });
  fillList('redFlags', RED_FLAGS);
  renderComfort();
  renderHospitals();
  renderKnowledge();
  $('chatInput').placeholder = t('chatPlaceholder');
  renderChatStatus();
}

// Sports health knowledge (knowledge.js). Topics the reader opened stay
// open when the language changes.
function renderKnowledge() {
  var box = $('learnParts');
  var open = {};
  box.querySelectorAll('details[open]').forEach(function (d) { open[d.dataset.key] = true; });
  box.innerHTML = '';
  KNOWLEDGE.forEach(function (part) {
    var section = document.createElement('section');
    section.className = 'card learn-part';
    var back = section.appendChild(document.createElement('button'));
    back.type = 'button';
    back.className = 'link-btn toc-back';
    back.dataset.tocBack = '';
    back.textContent = t('tocBack');
    var heading = document.createElement('h2');
    heading.textContent = L(part.title);
    section.appendChild(heading);
    part.topics.forEach(function (topic, index) {
      var details = document.createElement('details');
      details.dataset.key = part.id + index;
      details.open = !!open[details.dataset.key];
      var summary = document.createElement('summary');
      summary.textContent = L(topic.title);
      details.appendChild(summary);
      var list = document.createElement('ul');
      topic.points.forEach(function (point) {
        var li = document.createElement('li');
        li.textContent = L(point);
        list.appendChild(li);
      });
      details.appendChild(list);
      section.appendChild(details);
    });
    box.appendChild(section);
  });
}

// The city the visitor last searched for, so a language change redraws it.
var citySearchText = '';

// Map buttons in a row, like the four kinds of place below.
function mapButtons(links) {
  var box = document.createElement('div');
  box.className = 'links';
  [['google', 'googleMaps'], ['amap', 'amap']].forEach(function (pair) {
    if (!links[pair[0]]) return;
    var a = document.createElement('a');
    a.href = links[pair[0]];
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = t(pair[1]);
    box.appendChild(a);
  });
  return box;
}

function renderCityResult() {
  var box = $('cityResult');
  box.innerHTML = '';
  $('cityInput').placeholder = t('cityPlaceholder');
  if (!citySearchText) {
    var listed = document.createElement('p');
    listed.className = 'muted';
    listed.textContent = t('cityListed').replace('{0}', CITY_HOSPITALS.map(function (city) { return L(city.name); }).join(lang === 'zh' ? '、' : ', '));
    box.appendChild(listed);
    return;
  }
  var city = findCity(citySearchText);
  var title = document.createElement('h3');
  box.appendChild(title);
  if (!city) {
    title.textContent = t('cityNotListed').replace('{0}', citySearchText);
    var row = document.createElement('div');
    row.className = 'place';
    row.appendChild(mapButtons(cityMapLinks(citySearchText)));
    box.appendChild(row);
    return;
  }
  title.textContent = t('cityFound').replace('{0}', L(city.name));
  var list = document.createElement('div');
  list.id = 'cityHospitals';
  city.hospitals.forEach(function (hospital) {
    var row = document.createElement('div');
    row.className = 'place';
    row.innerHTML = '<div><strong></strong><div class="detail department"></div><div class="detail known"></div></div>';
    row.querySelector('strong').textContent = L(hospital.name);
    row.querySelector('.department').textContent = L(hospital.department);
    row.querySelector('.known').textContent = t('cityKnownFor') + L(hospital.knownFor);
    row.appendChild(mapButtons(hospitalMapLinks(city, hospital)));
    list.appendChild(row);
  });
  box.appendChild(list);
  var note = document.createElement('p');
  note.className = 'muted city-note';
  note.textContent = t('cityNote');
  box.appendChild(note);
}

$('cityForm').addEventListener('submit', function (event) {
  event.preventDefault();
  var text = $('cityInput').value.trim();
  var problem = !text ? 'cityMissing' : text.length > CITY_INPUT_MAX ? 'cityTooLong' : null;
  $('cityError').hidden = !problem;
  $('cityError').textContent = problem ? t(problem) : '';
  if (problem) return;
  citySearchText = text;
  renderCityResult();
});

function renderHospitals() {
  renderCityResult();
  var list = $('hospitalList');
  list.innerHTML = '';
  HOSPITAL_KINDS.forEach(function (kind) {
    var row = document.createElement('div');
    row.className = 'place';
    row.innerHTML = '<div><strong></strong><div class="detail"></div></div><div class="links"></div>';
    row.querySelector('strong').textContent = L(kind.name);
    row.querySelector('.detail').textContent = L(kind.when);
    row.replaceChild(mapButtons(mapLinks(kind)), row.querySelector('.links'));
    list.appendChild(row);
  });
}

// The menu shows one section at a time. The section is in the address
// (#cases, ...), so the back button and shared links work. Without one,
// the cover comes first.
var VIEWS = ['home', 'assess', 'comfort', 'cases', 'hospitals', 'log', 'learn'];

function currentView() {
  var name = location.hash.slice(1);
  return VIEWS.indexOf(name) >= 0 ? name : 'home';
}

function showView() {
  var view = currentView();
  var locked = isLockedView(view) && currentAccountState() !== 'signedIn';
  VIEWS.forEach(function (name) { $('view-' + name).hidden = name !== view || locked; });
  $('accountLock').hidden = !locked;
  $('accountBar').hidden = !isLockedView(view) || locked;
  document.querySelectorAll('#tabs a').forEach(function (a) {
    if (a.dataset.view === view) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
  scrollToCurrentTab();
  // The chart is sized to its box, which has no width while hidden.
  if (view === 'log' && !locked) renderPainTrend();
  syncGroupListener();
}

// On phones not every section fits in the menu: bring the current one into
// sight, and fade the far edge while more sections are hidden there. The menu
// starts on the left, or on the right in Arabic.
function scrollToCurrentTab() {
  var tabs = $('tabs');
  var current = tabs.querySelector('[aria-current="page"]');
  if (current && current.dataset.view !== 'home') {
    // The home tab covers the starting edge, so the current one goes next to it.
    var homeBox = tabs.querySelector('[data-view="home"]').getBoundingClientRect();
    var tabsBox = tabs.getBoundingClientRect();
    var box = current.getBoundingClientRect();
    if (isRightToLeft()) {
      var right = homeBox.left - 6;
      if (box.right > right || box.left < tabsBox.left) tabs.scrollLeft += box.right - right;
    } else {
      var left = homeBox.right + 6;
      if (box.left < left || box.right > tabsBox.right) tabs.scrollLeft += box.left - left;
    }
  }
  updateTabsFade();
}

function updateTabsFade() {
  var tabs = $('tabs');
  // Scrolling from the right gives negative scrollLeft, so use its size.

// Phone photos are large; a smaller copy is much faster for the AI.
async function shrinkPhoto(file) {
  var bitmap = await createImageBitmap(file);
  var scale = Math.min(1, 768 / Math.max(bitmap.width, bitmap.height));
  var canvas = document.createElement('canvas');
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  bitmap.close();
  return canvas;
}

    expectedOutputs: [{type: 'text', languages: [lang]}]
  });
  return availability === 'unavailable' ? 'en' : lang;
}

// ---- Comfort chat ----
// One AI session per language, so it remembers the conversation. Messages
// live only in this page and are gone after a refresh.
var chat = {session: null, sessionLang: null, busy: false, status: null, statusArg: null};

function setChatStatus(status, arg) {

}

function addBubble(text, who) {

}

// The model reads and writes the page language when Chrome supports it, and
// English otherwise, with the page translating both ways.
async function chatSession() {
  if (chat.session && chat.sessionLang === lang) return chat.session;
  if (chat.session) chat.session.destroy();
  var modelLang = 'en';
  if (lang !== 'en') {
    var availability = await LanguageModel.availability({
      expectedInputs: [{type: 'text', languages: [lang]}],
      expectedOutputs: [{type: 'text', languages: [lang]}]
    });
    if (availability !== 'unavailable') modelLang = lang;
  }
  chat.session = await LanguageModel.create({
    initialPrompts: [{role: 'system', content: chatSystemPrompt(modelLang)}],
    expectedInputs: [{type: 'text', languages: [modelLang]}],
    expectedOutputs: [{type: 'text', languages: [modelLang]}],
    monitor: function (m) {
      m.addEventListener('downloadprogress', function (e) { setChatStatus('chatDownloading', Math.round(e.loaded * 100)); });
    }
  });
  chat.sessionLang = lang;
  chat.modelLang = modelLang;
  return chat.session;
}

// Translate with Chrome's built-in Translator when the model had to use
// another language; keep the original text if that is not possible.
async function translateText(text, from, to) {
  if (from === to || !text || !window.Translator) return text;
  try {
    var translator = await Translator.create({sourceLanguage: from, targetLanguage: to});
    var translated = await translator.translate(text);
    translator.destroy();
    return translated;
  } catch (e) {
    return text;
  }
}

async function sendChat(message) {
  addBubble(message, 'me');
  if (isCrisisMessage(message)) $('chatCrisis').hidden = false;
  if (!window.LanguageModel) { setChatStatus('chatUnsupported'); return; }
  chat.busy = true;
  setChatStatus('chatThinking');
  try {
    var session = await chatSession();
    setChatStatus('chatThinking');
    var reply = await session.prompt(await translateText(message, lang, chat.modelLang));
    addBubble(await translateText(reply.trim(), chat.modelLang, lang), 'ai');
    chat.busy = false;
    setChatStatus(null);
  } catch (e) {
    chat.busy = false;
    setChatStatus('chatError');
  }
}

// ---- Group chat with people who had the same injury ----
// window.groupChatStore comes from firebase-chat.js, a module that loads
// after this script. The nickname, the room and the reported messages are
// remembered on this device only.
var GROUP_NICKNAME_KEY = 'injury-helper-group-nickname';
var GROUP_ROOM_KEY = 'injury-helper-group-room';
var GROUP_HIDDEN_KEY = 'injury-helper-group-hidden';

function readSetting(key, fallback) {
  try { var value = localStorage.getItem(key); return value === null ? fallback : JSON.parse(value); } catch (e) { return fallback; }
}

function writeSetting(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage blocked: not remembered next time */ }
}

// `status` is about loading the room: idle, loading, ready or error.
// `listening` is the room being listened to, with `stop` to end it.
var group = {
  store: null, room: readSetting(GROUP_ROOM_KEY, INJURIES[0].id), nickname: readSetting(GROUP_NICKNAME_KEY, ''),
  editingName: false, nameProblem: null, status: 'idle', messages: [], hidden: readSetting(GROUP_HIDDEN_KEY, []),
  listening: null, stop: null, sending: false, error: null, crisis: false, reported: false, lastSentAt: null, waitTimer: null
};
if (!INJURIES.some(function (injury) { return injury.id === group.room; })) group.room = INJURIES[0].id;
if (!Array.isArray(group.hidden)) group.hidden = [];

// Listens to the chosen room only while the chat is on screen and someone
// is signed in, and stops otherwise.
function syncGroupListener() {
  var wanted = group.store && group.store !== 'failed' && currentView() === 'comfort' &&
    currentAccountState() === 'signedIn' && account.user ? group.room : null;
  syncFriends(wanted ? account.user.uid : null);
  if (wanted === group.listening) return;
  if (group.stop) group.stop();
  group.stop = null;
  group.listening = wanted;
  group.messages = [];
  group.status = wanted ? 'loading' : 'idle';
  if (wanted) {
    group.stop = group.store.listen(wanted, GROUP_MESSAGES_SHOWN, function (messages) {
      if (group.listening !== wanted) return;
      var atBottom = isAtBottom($('groupLog'));
      group.messages = messages;
      group.status = 'ready';
      renderGroupChat();
      if (atBottom) scrollToBottom($('groupLog'));
    }, function () {
      if (group.listening !== wanted) return;
      group.status = 'error';
      renderGroupChat();
    });
  }
  renderGroupChat();
}

// New messages scroll into view only when the reader is already at the
// bottom, so reading older ones is not interrupted.
function isAtBottom(box) {
  return box.scrollHeight - box.scrollTop - box.clientHeight < 40;
}

function scrollToBottom(box) {
  box.scrollTop = box.scrollHeight;
}

function groupTime(millis) {
  return new Date(millis).toLocaleString(lang === 'zh' ? 'zh-CN' : lang, {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'});
}

function groupMessageBubble(message) {
  var mine = account.user && message.uid === account.user.uid;

  bubble.appendChild(meta);

  text.textContent = message.text;
  bubble.appendChild(text);
  if (!mine) {
    var actions = document.createElement('div');
    actions.className = 'bubble-actions';
    var report = document.createElement('button');
    report.type = 'button';
    report.className = 'link-btn';
    report.textContent = t('groupReport');
    report.addEventListener('click', function () { reportGroupMessage(message); });
    actions.appendChild(report);

    blockButton.addEventListener('click', function () { blockPerson(message.uid, message.nickname); });

// "Add friend" under someone's message, or a note when that is not needed.

  if (state !== 'add') {

    friendAction(function () { return group.store.sendRequest(account.user.uid, uid); }, 'groupFriendFailed');
  });

function renderGroupChat() {
  ['groupTitle', 'groupIntro', 'groupRoomLabel', 'groupNicknameLabel', 'groupNicknameSave', 'groupNicknameChange', 'groupInputLabel', 'chatCrisis']
    .forEach(function (id) { $(id === 'chatCrisis' ? 'groupCrisis' : id).textContent = t(id); });
  injuryOptions($('groupRoom'), '', group.room);
  $('groupRoom').options[0].remove();
  $('groupRoom').value = group.room;

  var naming = group.editingName || !group.nickname;
  $('groupNameForm').hidden = !naming;
  if (naming && document.activeElement !== $('groupNickname')) $('groupNickname').value = group.nickname;
  $('groupNameError').hidden = !group.nameProblem;
  $('groupNameError').textContent = group.nameProblem === 'tooLong' ? t('groupNicknameTooLong').replace('{0}', NICKNAME_MAX) : t('groupNicknameMissing');
  $('groupYou').hidden = naming;
  $('groupYouText').textContent = t('groupYouAre').replace('{0}', group.nickname);
  $('groupCrisis').hidden = !group.crisis;

  var shown = visibleMessages(withoutBlocked(group.messages, friends.blocked), group.hidden);
  var list = $('groupLog');
  list.innerHTML = '';
  shown.forEach(function (message) { list.appendChild(groupMessageBubble(message)); });
  list.hidden = shown.length === 0;

  var statusKey = null;
  if (group.store === 'failed') statusKey = 'groupUnavailable';
  else if (group.status === 'error') statusKey = 'groupFailed';
  else if (!group.store || group.status === 'loading') statusKey = 'groupLoading';
  else if (group.reported) statusKey = 'groupReported';
  else if (shown.length === 0) statusKey = 'groupEmpty';
  $('groupStatus').hidden = !statusKey;
  $('groupStatus').textContent = statusKey ? t(statusKey) : '';

  $('groupForm').hidden = naming || group.status !== 'ready';
  var wait = secondsUntilNextPost(group.lastSentAt, Date.now());
  $('groupSend').disabled = group.sending || wait > 0;
  $('groupSend').textContent = wait > 0 ? t('groupWait').replace('{0}', wait) : t('groupSend');
  $('groupInput').placeholder = t('groupPlaceholder');
  $('groupError').hidden = !group.error;
  $('groupError').textContent = group.error === 'tooLong' ? t('groupTooLong').replace('{0}', GROUP_TEXT_MAX) : group.error ? t(group.error) : '';
}

function reportGroupMessage(message) {
  if (!confirm(t('groupReportConfirm'))) return;
  group.hidden = group.hidden.concat([message.id]);
  writeSetting(GROUP_HIDDEN_KEY, group.hidden);
  group.reported = true;
  renderGroupChat();
  // Hidden here either way; a report that fails to reach the server is not retried.
  group.store.report(group.listening, message.id, account.user.uid).catch(function () {});
}

$('groupRoom').addEventListener('change', function () {
  group.room = $('groupRoom').value;
  writeSetting(GROUP_ROOM_KEY, group.room);
  group.reported = false;
  group.error = null;
  syncGroupListener();
});

$('groupNameForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var name = cleanNickname($('groupNickname').value);
  group.nameProblem = nicknameProblem(name);
  if (!group.nameProblem) {
    group.nickname = name;
    group.editingName = false;
    writeSetting(GROUP_NICKNAME_KEY, name);
    shareNickname();
  }
  renderGroupChat();
  if (!group.nameProblem) $('groupInput').focus();
});

$('groupNicknameChange').addEventListener('click', function () {
  group.editingName = true;
  renderGroupChat();
  $('groupNickname').focus();
});

$('groupForm').addEventListener('submit', function (e) {
  e.preventDefault();
  if (group.sending || secondsUntilNextPost(group.lastSentAt, Date.now()) > 0) return;
  var text = $('groupInput').value.trim();
  group.error = groupMessageProblem(text);
  group.reported = false;
  if (group.error === 'missing') group.error = null;
  if (text.length === 0 || group.error) { renderGroupChat(); return; }
  if (isCrisisMessage(text)) group.crisis = true;
  group.sending = true;
  renderGroupChat();
  group.store.send(group.listening, {uid: account.user.uid, nickname: group.nickname, text: text}).then(function () {
    $('groupInput').value = '';
    startPostWait(Date.now());
  }).catch(function (error) {
    // The server refuses a post too soon after the last one, which can happen
    // when this device's clock runs behind; wait a full gap before trying again.
    if (error && error.code === 'permission-denied') {
      group.error = 'groupTooFast';
      startPostWait(Date.now());
    } else {
      group.error = 'groupSendFailed';
    }
  }).then(function () {
    group.sending = false;
    renderGroupChat();
    scrollToBottom($('groupLog'));
  });
});

// Counts down on the send button until the next post is allowed.
function startPostWait(sentAt) {
  group.lastSentAt = sentAt;
  clearInterval(group.waitTimer);
  group.waitTimer = setInterval(function () {
    if (secondsUntilNextPost(group.lastSentAt, Date.now()) === 0) {
      clearInterval(group.waitTimer);
      if (group.error === 'groupTooFast') group.error = null;
    }
    renderGroupChat();
  }, 250);
}

$('groupInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    $('groupForm').requestSubmit();
  }
});

// ---- Friends and private chats ----
var FRIENDS_LAST_READ_KEY = 'injury-helper-friends-last-read';
var PRIVATE_MESSAGES_SHOWN = 100;

// `uid` is the account whose friends are being listened to. `names` holds
// nicknames by account id, loaded as needed. `open` is the friendship whose
// private chat is shown; `ended` says it ended while open.
var friends = {
  uid: null, stop: null, status: 'idle', incoming: [], outgoing: [], list: [], blocked: [], names: {}, busy: false, error: null,
  open: null, stopChat: null, chatStatus: 'idle', messages: [], sending: false, chatError: null, crisis: false, ended: false,
  lastRead: readSetting(FRIENDS_LAST_READ_KEY, {})
};
if (!friends.lastRead || typeof friends.lastRead !== 'object') friends.lastRead = {};

// The nickname goes to the server, so friends see it on any device. On a new
// device, the one saved there before is used.
function shareNickname() {
  if (!friends.uid) return;
  if (group.nickname) {
    group.store.saveNickname(friends.uid, group.nickname).catch(function () { /* shared again next visit */ });
    return;
  }
  group.store.loadNickname(friends.uid).then(function (nickname) {
    if (!nickname || group.nickname) return;
    group.nickname = nickname;
    writeSetting(GROUP_NICKNAME_KEY, nickname);
    renderGroupChat();
  }).catch(function () { /* the person can still pick one */ });
}

function stopFriends() {
  if (friends.stop) friends.stop();
  friends.stop = null;
  closePrivateChat();
}

function syncFriends(uid) {
  if (uid === friends.uid) return;
  stopFriends();
  friends.uid = uid;
  friends.incoming = [];
  friends.outgoing = [];
  friends.list = [];
  friends.blocked = [];
  friends.error = null;
  friends.status = uid ? 'loading' : 'idle';
  if (uid) {
    shareNickname();
    var loaded = {requests: false, friendships: false, blocks: false};
    var failed = function () {
      if (friends.uid !== uid) return;
      friends.status = 'error';
      renderFriends();
    };
    var ready = function (part) {
      loaded[part] = true;
      if (loaded.requests && loaded.friendships && loaded.blocks) friends.status = 'ready';
      loadNicknames();
      renderFriends();
      renderGroupChat();
    };
    var stopRequests = group.store.listenRequests(uid, function (requests) {
      if (friends.uid !== uid) return;
      friends.incoming = requests.incoming;
      friends.outgoing = requests.outgoing;
      ready('requests');
    }, failed);
    var stopFriendships = group.store.listenFriendships(uid, function (list) {
      if (friends.uid !== uid) return;
      friends.list = list;
      if (friends.open && !list.some(function (friendship) { return friendship.id === friends.open; })) {
        closePrivateChat();
        friends.ended = true;
      }
      ready('friendships');
    }, failed);
    var stopBlocks = group.store.listenBlocks(uid, function (blocked) {
      if (friends.uid !== uid) return;
      friends.blocked = blocked;
      ready('blocks');
    }, failed);
    friends.stop = function () { stopRequests(); stopFriendships(); stopBlocks(); };
  }
  renderFriends();
}

// Looks up the nicknames of friends and of people who sent a request.
function loadNicknames() {
  var uids = friends.list.map(function (friendship) { return friendOf(friendship, friends.uid); })
    .concat(friends.incoming.map(function (request) { return request.from; }))
    .concat(friends.blocked);
  uids.forEach(function (uid) {
    if (uid in friends.names) return;
    friends.names[uid] = null;
    group.store.loadNickname(uid).then(function (nickname) {
      friends.names[uid] = nickname;
      renderFriends();
    }).catch(function () { delete friends.names[uid]; });
  });
}

function friendName(uid) {
  return friends.names[uid] || t('friendsNoName');
}

// Runs one change to friends with the buttons disabled; `failedKey` is the
// message shown when it does not go through.
function friendAction(call, failedKey) {
  friends.busy = true;
  friends.error = null;
  renderFriends();
  renderGroupChat();
  return call().catch(function () {
    friends.error = failedKey;
  }).then(function () {
    friends.busy = false;
    renderFriends();
    renderGroupChat();
  });
}

function friendRequestRow(request) {
  var row = document.createElement('div');
  row.className = 'friend-request';
  var text = document.createElement('span');
  text.textContent = t('friendsRequestText').replace('{0}', friendName(request.from));
  row.appendChild(text);
  var buttons = document.createElement('div');
  buttons.className = 'plan-buttons';
  [['friendsAccept', 'primary'], ['friendsDecline', 'secondary'], ['friendsBlock', 'secondary']].forEach(function (pair) {
    var button = document.createElement('button');
    button.type = 'button';
    button.className = pair[1];
    button.textContent = t(pair[0]);
    button.disabled = friends.busy;
    button.addEventListener('click', function () {
      if (pair[0] === 'friendsBlock') {
        blockPerson(request.from);
      } else if (pair[0] === 'friendsAccept') {
        var alsoAsked = friends.outgoing.some(function (mine) { return mine.to === request.from; });
        friendAction(function () {
          return group.store.acceptRequest(request.from, friends.uid, friendshipId(request.from, friends.uid), alsoAsked);
        }, 'friendsActionFailed');
      } else {
        friendAction(function () { return group.store.declineRequest(request.from, friends.uid); }, 'friendsActionFailed');
      }
    });
    buttons.appendChild(button);
  });
  row.appendChild(buttons);
  return row;
}

function friendListItem(friendship) {

  return item;
}

function openFriendship() {
  return friends.list.filter(function (friendship) { return friendship.id === friends.open; })[0];
}

function renderFriends() {
  ['friendsTitle', 'friendsIntro', 'friendsRequestsTitle', 'privateBack', 'privateRemove', 'groupInputLabel', 'groupSend', 'chatCrisis', 'friendsBlock']

function renderPrivateChat(friendship) {

  $('privateInput').placeholder = t('privatePlaceholder').replace('{0}', name);

// Remembers the newest message seen in the open chat, so its dot goes away.
function markPrivateRead() {
  var newest = friends.messages.reduce(function (latest, message) { return Math.max(latest, message.createdAt || 0); }, 0);
  var friendship = openFriendship();
  if (friendship && friendship.lastMessageAt) newest = Math.max(newest, friendship.lastMessageAt);
  if (newest <= (friends.lastRead[friends.open] || 0)) return;
  friends.lastRead[friends.open] = newest;
  writeSetting(FRIENDS_LAST_READ_KEY, friends.lastRead);
}

function openPrivateChat(id) {
  closePrivateChat();
  friends.open = id;
  friends.ended = false;
  friends.chatStatus = 'loading';
  friends.stopChat = group.store.listenPrivate(id, PRIVATE_MESSAGES_SHOWN, function (messages) {
    if (friends.open !== id) return;
    var atBottom = isAtBottom($('privateLog'));
    friends.messages = messages;
    friends.chatStatus = 'ready';
    markPrivateRead();
    renderFriends();
    if (atBottom) scrollToBottom($('privateLog'));
  }, function () {
    if (friends.open !== id) return;
    friends.chatStatus = 'error';
    renderFriends();
  });
  renderFriends();
  $('friendsCard').scrollIntoView({block: 'start'});
}

function closePrivateChat() {
  if (friends.stopChat) friends.stopChat();
  friends.stopChat = null;
  friends.open = null;
  friends.messages = [];
  friends.chatStatus = 'idle';
  friends.chatError = null;
  friends.crisis = false;
}

$('privateRemove').addEventListener('click', function () {

  var id = friendship.id;

});

// Blocks someone after asking (`nickname` when known from a group message), ending the friendship and any requests
// between the two at the same time.
function blockPerson(uid, nickname) {
  if (!confirm(t('friendsBlockConfirm').replace('{0}', nickname || friendName(uid)))) return;
  var friendship = friends.list.filter(function (one) { return friendOf(one, friends.uid) === uid; })[0];
  var existing = {
    friendshipId: friendship ? friendship.id : null,
    incoming: friends.incoming.some(function (request) { return request.from === uid; }),
    outgoing: friends.outgoing.some(function (request) { return request.to === uid; })
  };
  if (friendship && friends.open === friendship.id) closePrivateChat();
  friendAction(function () { return group.store.blockUser(friends.uid, uid, existing); }, 'friendsActionFailed');
}

$('privateBlock').addEventListener('click', function () {
  var friendship = openFriendship();
  if (friendship) blockPerson(friendOf(friendship, friends.uid));
});

$('privateForm').addEventListener('submit', function (e) {
  e.preventDefault();
  if (friends.sending || !friends.open) return;
  var text = $('privateInput').value.trim();
  friends.chatError = groupMessageProblem(text);
  if (friends.chatError === 'missing') friends.chatError = null;
  if (text.length === 0 || friends.chatError) { renderFriends(); return; }
  if (isCrisisMessage(text)) friends.crisis = true;
  friends.sending = true;
  renderFriends();
  group.store.sendPrivate(friends.open, friends.uid, text).then(function () {
    $('privateInput').value = '';
  }).catch(function () {
    friends.chatError = 'groupSendFailed';
  }).then(function () {
    friends.sending = false;
    renderFriends();
    scrollToBottom($('privateLog'));
  });
});

$('privateInput').addEventListener('keydown', function (e) {

});

async function askModelAboutPhoto(injury, canvas) {
  var outputLanguage = await photoOutputLanguage();
  var session = await LanguageModel.create({
    expectedInputs: [{type: 'text', languages: ['en']}, {type: 'image'}],
    expectedOutputs: [{type: 'text', languages: [outputLanguage]}],
    monitor: function (m) {
      m.addEventListener('downloadprogress', function (e) { setPhotoStatus('photoDownloading', Math.round(e.loaded * 100)); });
    }
  });
  try {
    var json = await session.prompt([{
      role: 'user',
      content: [{type: 'text', value: photoPrompt(injury, outputLanguage)}, {type: 'image', value: canvas}]
    }], {responseConstraint: photoSchema(injury)});
    var result = JSON.parse(json);
    result.description = await translateText(result.description, outputLanguage, lang);
    return result;
  } finally {
    session.destroy();
  }
}

async function analyzePhoto(file) {
  var injury = currentInjury;
  resetPhoto();
  var run = photo.run;
  photo.url = URL.createObjectURL(file);
  if (!file.type.startsWith('image/')) { setPhotoStatus('photoBadImage'); return; }
  if (!window.LanguageModel) { setPhotoStatus('photoUnsupported'); return; }
  setPhotoStatus('photoChecking');
  var canvas;
  try {
    canvas = await shrinkPhoto(file);
  } catch (e) {
    setPhotoStatus('photoBadImage');
    return;
  }
  var result;
  try {
    result = await askModelAboutPhoto(injury, canvas);
  } catch (e) {
    // A newer photo or another injury was picked meanwhile.
    if (run !== photo.run) return;
    setPhotoStatus(e.name === 'NotSupportedError' ? 'photoUnsupported' : 'photoError');
    return;
  }
  if (run !== photo.run) return;
  var filled = applyPhotoResult(injury, answers, result);
  filled.forEach(function (id) { photo.filled[id] = true; });
  photo.description = result.isInjury ? result.description : '';
  if (!result.isInjury) setPhotoStatus('photoNotInjury');
  else if (filled.length === 0) setPhotoStatus('photoNothing');
  else setPhotoStatus('photoFilled', filled.length);
  renderQuestions();
  if (showingResults) renderResults();
  else if (!$('error').hidden) showMissing();
}

function renderRiskCheck() {
  ['riskTitle', 'riskIntro', 'riskOpen', 'riskCheck', 'riskNote'].forEach(function (key) { $(key).textContent = t(key); });
  $('riskOpen').hidden = risk.open;
  $('riskForm').hidden = !risk.open;
  var missingIds = risk.result && risk.result.status === 'missing' ? risk.result.ids : [];
  var list = $('riskQuestions');
  list.innerHTML = '';
  RISK_QUESTIONS.forEach(function (question, i) {
    var fs = document.createElement('fieldset');
    if (missingIds.indexOf(question.id) >= 0) fs.className = 'missing';
    var legend = document.createElement('legend');
    legend.textContent = (i + 1) + '. ' + L(question.text);
    fs.appendChild(legend);
    var options = document.createElement('div');
    options.className = 'options';
    question.options.forEach(function (opt) {
      var label = document.createElement('label');
      var input = document.createElement('input');
      input.type = question.multiple ? 'checkbox' : 'radio';
      input.name = 'risk-' + question.id;
      input.checked = question.multiple ? risk.answers.past.indexOf(opt.value) >= 0 : risk.answers[question.id] === opt.value;
      input.addEventListener('change', function () {
        if (question.multiple) {
          risk.answers.past = toggleRiskPastInjury(risk.answers.past, opt.value);
          // "None" and the injuries clear each other, so redraw the ticks.
          fs.querySelectorAll('input').forEach(function (box, j) { box.checked = risk.answers.past.indexOf(question.options[j].value) >= 0; });
        } else {
          risk.answers[question.id] = opt.value;
        }
        fs.classList.remove('missing');
      });
      label.appendChild(input);
      label.appendChild(document.createTextNode(L(opt.text)));
      options.appendChild(label);
    });
    fs.appendChild(options);
    list.appendChild(fs);
  });
  $('riskError').hidden = missingIds.length === 0;
  $('riskError').textContent = t('riskMissing');
  renderRiskResult();
}

  var box = $('riskResult');

  box.hidden = !(result && result.status === 'done');
  if (box.hidden) return;
  function add(tag, text) {
    var element = document.createElement(tag);
    element.textContent = text;

  }
  function addList(items) {
    var list = document.createElement('ul');

    if (area.pastInjuries.length > 0) {
