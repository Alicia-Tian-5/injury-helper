<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>运动损伤急救助手 · Sports Injury Helper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&family=Noto+Serif+SC:wght@600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
:root{
  --bg:#f4f6f9;--card:#fff;--text:#1b2733;--muted:#56626f;--line:#d9e0e8;
  --acc:#1f4e79;--acc-dark:#163a5c;--acc-soft:#e7eef6;--tint:#f0f4f8;--shadow:0 1px 3px rgba(20,40,70,.08);
  --red:#c62828;--red-soft:#fdecec;--orange:#d9480f;--orange-soft:#fff1e6;
  --yellow:#a86400;--yellow-soft:#fff8e1;--green:#2e7d32;--green-soft:#e8f5e9;
  --sans:"IBM Plex Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;
  --serif:"Source Serif 4","Noto Serif SC","Songti SC",SimSun,Georgia,serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1620;--card:#17212c;--text:#e6ebf1;--muted:#9eabb9;--line:#2b3846;
  --acc:#7fb0e0;--acc-dark:#a6c8ea;--acc-soft:#1c2b3c;--tint:#141e29;--shadow:none;
  --red:#ff6b6b;--red-soft:#3a1d1f;--orange:#ff9b5c;--orange-soft:#3a2617;
  --yellow:#f2c14e;--yellow-soft:#352d17;--green:#6fcf73;--green-soft:#1c3220;
}}
*{box-sizing:border-box}
/* Elements with display rules below must still disappear when hidden. */
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.6 var(--sans)}
/* Headings in a serif, like a printed medical handbook; body text in a plain sans for easy reading on phones. */
h1,h2,h3{font-family:var(--serif)}
html,body{overflow-x:clip}
main{max-width:680px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:21px;font-weight:700;margin:0;line-height:1.3;letter-spacing:.01em}
h2{font-size:20px;font-weight:600;margin:0 0 10px}
h3{font-size:17px;font-weight:600;margin:0 0 6px}
button{font:inherit;cursor:pointer;border:0;border-radius:4px}
.langs{flex:0 0 auto;display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.langs button{background:var(--card);color:var(--muted);border-radius:0;padding:8px 14px;font-size:15px;white-space:nowrap}
.langs button+button{border-left:1px solid var(--line)}
.langs button.on{background:var(--acc);color:#fff;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.alert{background:var(--red-soft);border-color:var(--red)}
.alert h2{color:var(--red)}
.alert ul{margin:0 0 8px;padding-left:20px}
.alert .numbers{font-weight:700;margin:0}
.muted{color:var(--muted);font-size:15px}
.injuries{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.injury{background:var(--card);color:var(--text);border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;text-align:left;min-height:72px}
.injury strong{display:block;font-size:18px;font-weight:600;color:var(--acc)}
.injury small{display:block;color:var(--muted);font-size:14px}
.injury:hover{border-color:var(--acc)}
.injury[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);box-shadow:inset 0 0 0 1px var(--acc)}
.welcome{border-left:4px solid var(--acc)}
.welcome h2{margin:0 0 2px;color:var(--acc)}
.welcome p{margin:0}
fieldset{border:0;margin:0 0 16px;padding:0}
fieldset.missing legend{color:var(--red)}
legend{font-weight:600;margin-bottom:8px;padding:0}
.options{display:flex;flex-wrap:wrap;gap:8px}
.options label{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:4px;padding:10px 14px;cursor:pointer;min-height:44px}
.options input{width:18px;height:18px;margin:0;accent-color:var(--acc)}
.options label:has(input:checked){border-color:var(--acc);background:var(--acc-soft)}
.primary{background:var(--acc);color:#fff;font-weight:600;padding:13px 22px;width:100%;font-size:18px}
.primary:hover{background:var(--acc-dark)}
.secondary{background:transparent;color:var(--acc);border:1.5px solid var(--acc);padding:10px 18px;font-weight:600}
.secondary:hover{background:var(--acc-soft)}
.error{color:var(--red);font-weight:600;margin:10px 0 0}
.photo{border:1.5px dashed var(--line);border-radius:6px;padding:14px;margin-bottom:18px}
.photo .muted{margin:0 0 10px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.file-btn{display:inline-block;position:relative;border-radius:4px;cursor:pointer}
.file-btn:focus-within{outline:2px solid var(--acc);outline-offset:2px}
.photo-result{display:flex;gap:12px;align-items:flex-start;margin-top:12px}
.photo-result img{width:96px;height:96px;object-fit:cover;border-radius:4px;flex:0 0 auto;background:var(--line)}
.photo-result p{margin:0 0 6px}
#photoDesc{font-style:italic}
.tag{font-size:12px;font-weight:600;color:var(--acc);background:var(--acc-soft);border-radius:3px;padding:1px 6px;margin-left:4px;white-space:nowrap}
.level{border-width:2px}
.level h2{margin-bottom:4px}
.level p{margin:0}
.level-emergency{background:var(--red-soft);border-color:var(--red)}.level-emergency h2{color:var(--red)}
.level-today{background:var(--orange-soft);border-color:var(--orange)}.level-today h2{color:var(--orange)}
.level-soon{background:var(--yellow-soft);border-color:var(--yellow)}.level-soon h2{color:var(--yellow)}
.level-selfCare{background:var(--green-soft);border-color:var(--green)}.level-selfCare h2{color:var(--green)}
.step-num{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;font-size:15px;margin-right:8px;vertical-align:2px}
.advice-now,.advice-where,.advice-rehab,.advice-comfort{border-top:4px solid var(--acc)}
.comfort-stage{border-left:3px solid var(--acc);padding:4px 0 4px 12px;margin-top:12px}
.comfort-stage .when{font-weight:700}
.comfort-stage p{margin:2px 0}
.comfort-stage .try{color:var(--muted);font-size:15px}
.counseling{background:var(--tint);border:1px solid var(--line);border-radius:6px;padding:14px;margin-top:16px}
.counseling h3{color:var(--acc)}
.counselor{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0}
.counselor+.counselor{border-top:1px solid var(--line)}
.counselor .detail{color:var(--muted);font-size:14px}
.counselor .links{display:flex;gap:8px}
.counselor a{background:var(--acc);color:#fff;text-decoration:none;font-weight:600;border-radius:4px;padding:8px 16px;min-height:40px;display:inline-flex;align-items:center}
ol.steps,ul.points{margin:0;padding-left:22px}
ol.steps li,ul.points li{margin-bottom:6px}
.phase{border-left:3px solid var(--acc);padding:4px 0 4px 12px;margin-top:14px}
.phase .when{font-weight:700}
.phase .goal{color:var(--muted);font-size:15px;margin-bottom:4px}
.phase ul{margin:0;padding-left:20px}
.actions{display:flex;justify-content:center;margin-top:6px}
.actions{gap:10px;flex-wrap:wrap}
.cases-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.cases-head h2{margin:0}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-weight:600;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;font:inherit;color:var(--text);background:var(--card);border:1.5px solid var(--line);border-radius:4px;padding:10px 12px}
.field textarea{resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:var(--acc)}
#caseForm{border:1.5px solid var(--line);border-radius:6px;padding:14px;margin:12px 0}
.success{color:var(--green);font-weight:600}
.filter{max-width:280px;margin-top:12px}
.case{border-top:1px solid var(--line);padding:12px 0}
.case-meta{color:var(--muted);font-size:14px;margin-bottom:4px}
.case-meta strong{color:var(--text)}
.case p{margin:0 0 6px;white-space:pre-wrap}
.case dl{margin:0}
.case dt{font-weight:600;font-size:15px;margin-top:6px}
.case dd{margin:0;white-space:pre-wrap}
.learn-intro{margin:-4px 0 16px}
.learn-part details{border-top:1px solid var(--line)}
.learn-part summary{cursor:pointer;font-weight:600;color:var(--acc);padding:12px 0;min-height:44px}
.learn-part details ul{margin:0 0 14px;padding-left:22px}
.learn-part details li{margin-bottom:6px}
.log-date input{max-width:240px}
/* 0-5 and 6-10 on two rows on phones, all eleven on one row when there is room. */
.pain-scale{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:560px}
@media (min-width:520px){.pain-scale{grid-template-columns:repeat(11,1fr)}}
.pain-scale label{position:relative;min-height:40px;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--line);border-radius:4px;cursor:pointer;font-weight:600}
.pain-scale label:has(input:checked){background:var(--acc);border-color:var(--acc);color:#fff}
.pain-scale label:focus-within{outline:2px solid var(--acc);outline-offset:2px}
#logPainHint{margin:0}
.pain-name{font-weight:600;margin:12px 0 6px}
.log-photo{display:block;max-width:220px;max-height:220px;object-fit:cover;border-radius:4px;margin-top:10px}
.link-btn{background:none;color:var(--acc);text-decoration:underline;padding:8px;margin-left:6px}
.account-lock{max-width:480px;margin-left:auto;margin-right:auto;border-top:4px solid var(--acc)}
.account-modes{display:flex;gap:8px;margin:4px 0 14px}
.account-modes button{flex:1;background:transparent;color:var(--text);border:1.5px solid var(--line);padding:10px 12px;font-weight:600}
.account-modes button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.account-lock .primary:disabled{opacity:.6}
.account-lock .link-btn{margin:8px 0 0;padding:8px 0}
.account-lock .actions{justify-content:flex-start;margin-top:12px}
.account-bar{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:4px 8px;margin:0 0 8px;font-size:15px;color:var(--muted)}
.account-bar .link-btn{margin:0}
.log-entry img{display:block;max-width:100%;max-height:360px;object-fit:contain;border-radius:4px;margin:6px 0 8px}
.log-entry .secondary{padding:6px 14px;font-size:15px}
#subPick{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.site-header{position:sticky;top:0;z-index:10;background:var(--card);border-top:4px solid var(--acc);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
h1 a{color:var(--acc)}
.site-header .wrap{max-width:680px;margin:0 auto;padding:10px 16px 8px;display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.site-header h1{flex:1 1 auto}
.tabs{order:3;width:100%;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
/* On phones the menu scrolls sideways; the fading right edge shows there is more. */
.tabs.more-right{-webkit-mask-image:linear-gradient(90deg,#000 75%,transparent);mask-image:linear-gradient(90deg,#000 75%,transparent)}
.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);font-weight:600;border-radius:4px;padding:8px 14px;min-height:40px;display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--line)}
.tabs a[aria-current="page"]{background:var(--acc);border-color:var(--acc);color:#fff}
.place{padding:12px 0}
.place+.place{border-top:1px solid var(--line)}
.place .detail{color:var(--muted);font-size:15px}
.place .links{display:flex;gap:8px;margin-top:8px}
.city-form{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.city-form .field{flex:1 1 220px;margin-bottom:0}
.city-form .primary{width:auto;flex:0 0 auto}
#cityResult h3{margin-top:16px}
.city-note{font-size:14px;margin:12px 0 0}
.plan-progress{font-weight:600;margin:4px 0 8px}
.plan-today{list-style:none;margin:0 0 12px;padding:0}
.plan-today>li{border-top:1px solid var(--line)}
.plan-today label{display:flex;align-items:center;gap:12px;padding:10px 0;min-height:44px;cursor:pointer}
.plan-today input{width:22px;height:22px;flex:0 0 auto;accent-color:var(--acc)}
.plan-today .done span{color:var(--muted);text-decoration:line-through}
.plan-today small{color:var(--muted);font-size:15px;margin-left:6px}
.plan-form{border:1px solid var(--line);border-radius:6px;padding:14px;margin:12px 0;background:var(--tint)}
.plan-form h3{margin-top:0}
.day-picks{display:flex;flex-wrap:wrap;gap:6px}
.day-picks label{position:relative}
.day-picks span{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:40px;padding:0 10px;border:1.5px solid var(--line);border-radius:4px;background:var(--card)}
.day-picks input:checked+span{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.day-picks input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.plan-dates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan-dates .field,.plan-dates input{min-width:0}
@media (max-width:420px){.plan-dates{grid-template-columns:1fr}}
.calendar-row .primary:disabled{opacity:.45;cursor:not-allowed}
.plan-buttons{display:flex;gap:8px}
.plan-buttons .primary{width:auto;flex:1}
.plan-all{margin-top:14px}
.plan-all summary{cursor:pointer;font-weight:600;color:var(--acc);padding:10px 0;min-height:44px}
.plan-item{border-top:1px solid var(--line);padding:10px 0}
.plan-item .case-meta{margin:2px 0 6px}
.plan-item small{color:var(--muted);font-weight:400;font-size:15px;margin-left:6px}
.plan-item button{margin-right:6px}
.plan-calendar{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.calendar-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.calendar-row .field{margin-bottom:0}
.calendar-row .primary{width:auto}
.rehab-to-plan{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.rehab-to-plan .success,.rehab-to-plan .muted{margin:10px 0 0}
.go-plan{display:inline-flex;align-items:center;min-height:40px;margin-top:10px;text-decoration:none;border-radius:4px}
.plan-moves{margin:0 0 6px 34px;padding-left:18px;color:var(--muted);font-size:15px}
.plan-moves li{margin:2px 0}
.home-today{display:block;text-decoration:none;color:var(--text);border-left:4px solid var(--acc);margin:0 0 12px}
.home-today strong{color:var(--acc)}
.trend{margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.trend svg{display:block;width:100%;height:auto}
.trend .grid{stroke:var(--line);stroke-width:1}
.trend .axis-label{fill:var(--muted);font-size:13px}
.trend polyline{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.trend-legend{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px}
.trend-legend li::before{content:"";display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle;background:currentColor}
.trend-rest{color:var(--acc);stroke:var(--acc);fill:var(--acc)}
.trend-exercise{color:var(--orange);stroke:var(--orange);fill:var(--orange)}
.trend-legend li span{color:var(--text)}
.place a{background:var(--acc);color:#fff;text-decoration:none;font-weight:600;border-radius:4px;padding:8px 14px;min-height:40px;display:inline-flex;align-items:center}
/* Cover photos are free under the Unsplash License; COVER_SLIDES in the
   script lists each one with its photographer. */
/* Photos change every few seconds behind a light veil that keeps the words readable. */
.cover{--veil:244,247,251;position:relative;overflow:hidden;background:#e7eef6;
  text-align:center;margin:-16px calc(50% - 50vw) 18px;padding:48px 16px;min-height:calc(100vh - 110px);display:flex;align-items:center}
.cover-slide{position:absolute;inset:0;background-size:cover;background-position:var(--position);opacity:0;transition:opacity .9s ease}
.cover-slide.on{opacity:1}
.cover-veil{position:absolute;inset:0;background:rgba(var(--veil),.8)}
.cover-inner{position:relative;z-index:1}
.cover-dots{position:absolute;left:0;right:0;bottom:10px;z-index:1;display:flex;justify-content:center;gap:2px}
.cover-dots button{width:32px;height:32px;background:none;padding:0;display:flex;align-items:center;justify-content:center}
.cover-dots button::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--acc);opacity:.3}
.cover-dots button[aria-current="true"]::before{opacity:1}
@media (prefers-reduced-motion:reduce){.cover-slide{transition:none}}
/* Soft glow behind the words so they stay sharp over the photo. */
.cover-text{text-shadow:0 0 18px rgba(var(--veil),.9)}
.cover-inner{max-width:1180px;margin:0 auto}
.cover-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.facts div{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--acc);border-radius:4px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.facts strong{display:block;font-size:28px;font-weight:700;color:var(--acc);line-height:1.2}
.facts span{color:var(--muted);font-size:15px}
.section-title{font-size:22px;font-weight:600;margin:0 0 12px}
.row-2>.card{margin-bottom:14px}
.site-footer{background:#13283f;color:#e3eaf2;margin-top:24px}
.site-footer .wrap{max-width:1180px;margin:0 auto;padding:28px 16px;text-align:center}
.site-footer p{margin:0 0 8px}
.footer-name{font-weight:600;font-size:18px}
.footer-note{color:#a9b8c8;font-size:14px}
.footer-note a{color:inherit}
.slogan{font-size:28px;font-weight:700;line-height:1.3;margin:14px 0 12px;color:var(--acc)}
.cover-intro{color:var(--text);margin:0 auto 22px;max-width:460px}
.start{display:inline-block;width:auto;text-decoration:none;padding:14px 32px;border-radius:4px}
.cover-sos{color:var(--red);font-size:15px;font-weight:600;margin:16px 0 0}
.features{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.feature{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;color:var(--text);text-decoration:none;box-shadow:var(--shadow)}
.feature svg{width:30px;height:30px;color:var(--acc);margin-bottom:6px}
.feature strong{color:var(--acc);font-weight:600}
.feature:hover{border-color:var(--acc)}
h1 a{text-decoration:none}
.chat-log{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.bubble{max-width:85%;padding:10px 14px;border-radius:8px;white-space:pre-wrap}
.bubble.me{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:2px}
.bubble.ai{align-self:flex-start;background:var(--acc-soft);color:var(--text);border-bottom-left-radius:2px}
.chat-form{display:flex;gap:8px;align-items:flex-end}
.chat-form textarea{flex:1;font:inherit;color:var(--text);background:var(--card);border:1.5px solid var(--line);border-radius:4px;padding:10px 12px;resize:vertical}
.chat-form textarea:focus{outline:2px solid var(--acc);border-color:var(--acc)}
.chat-form .primary{width:auto;padding:12px 18px;font-size:17px}
.chat-crisis{background:var(--red-soft);border:1.5px solid var(--red);border-radius:6px;padding:12px;color:var(--text);margin-top:10px}
.chat-crisis a{color:var(--red);font-weight:700}
.start{text-decoration:none}
@media (prefers-color-scheme:dark){.cover{--veil:15,22,32}.site-footer{background:#0a121b}}
/* Computers: a wide, full-window layout. Phones keep the single column. */
@media (min-width:900px){
  main,.site-header .wrap{max-width:1180px;padding-left:32px;padding-right:32px}
  .site-header .wrap{flex-wrap:nowrap;padding-top:12px;padding-bottom:12px}
  .site-header h1{flex:0 0 auto;margin-right:24px}
  .tabs{order:0;width:auto;flex:1 1 auto;gap:4px}
  .tabs a{background:none;border:0;border-radius:0;border-bottom:3px solid transparent;padding:8px 12px}
  .tabs a[aria-current="page"]{background:none;color:var(--acc);border-bottom-color:var(--acc)}
  .cover{text-align:left;padding:72px 32px;margin-bottom:28px;min-height:calc(100vh - 70px);
  }
  .cover-slide{background-position:var(--wide)}
  .cover-veil{background:linear-gradient(90deg,rgba(var(--veil),.94) 0%,rgba(var(--veil),.86) 38%,rgba(var(--veil),.35) 68%,rgba(var(--veil),.25) 100%)}
  .cover-inner{width:100%}
  .cover-text{max-width:700px}
  .cover-actions{justify-content:flex-start}
  .slogan{font-size:52px;margin-top:0}
  .cover-intro{font-size:20px;margin-left:0;max-width:600px}
  .facts{grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:36px}
  .facts strong{font-size:40px}
  .section-title{font-size:28px}
  .features{grid-template-columns:repeat(4,1fr);gap:16px}
  .feature{padding:22px}
  .feature svg{width:36px;height:36px}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .injuries{grid-template-columns:repeat(5,1fr)}
  #view-comfort:not([hidden]),#view-log:not([hidden]),.learn-parts{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  #hospitalList,#cityHospitals{display:grid;grid-template-columns:1fr 1fr;column-gap:32px}
  .place+.place{border-top:0}
  .place{border-bottom:1px solid var(--line)}
  #view-cases{max-width:860px;margin:0 auto}
  #planCard{grid-column:1/-1}
}
@media (max-width:420px){.slogan{font-size:24px}h1{font-size:19px}.injury{padding:10px 12px}.injury strong{font-size:17px}}

<div class="view" id="view-home" hidden>

</div>

<div class="view" id="view-assess">
<div class="row-2">
<section class="card welcome">

</section>

<section class="card alert" aria-labelledby="alertTitle">

</section>
</div>

<section class="card">

  </div>
</section>

<section class="card" id="questionsCard" hidden>

var LANG_KEY = 'injury-helper-lang';
var lang = loadLang();
var currentCategory = null;
var currentInjury = null;
var answers = {};
var showingResults = false;
// Photo state: which answers came from the photo, and what to show.
var photo = {run: 0, filled: {}, status: null, statusArg: '', description: '', url: null};

function loadLang() {
  try { var v = localStorage.getItem(LANG_KEY); return T[v] ? v : 'zh'; } catch (e) { return 'zh'; }
}
function saveLang() {
  try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* storage blocked: the choice just is not remembered */ }
}
function t(key) { return T[lang][key]; }
// Pick the current language from a {en, zh} object; English when that
// language has no text yet (Spanish injury content, for now).
function L(text) { return text[lang] || text.en; }
function $(id) { return document.getElementById(id); }

function fillList(listId, items) {
  var list = $(listId);
  list.innerHTML = '';
  items.forEach(function (item) {
    var li = document.createElement('li');
    li.textContent = L(item);
    list.appendChild(li);
  });
}

function renderStatic() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
  document.title = t('title');
  ['title', 'welcomeTitle', 'welcomeText', 'alertTitle', 'numbers', 'pickTitle', 'subTitle', 'questionsTitle', 'firstAidTitle', 'whereTitle', 'rehabTitle', 'comfortTitle', 'counselingTitle', 'disclaimer',
   'navAssess', 'navComfort', 'navCases', 'navHospitals', 'navLog', 'navLearn', 'learnTitle', 'learnIntro', 'cityTitle', 'cityIntro', 'cityLabel', 'citySearch', 'hospitalsTitle', 'hospitalsIntro', 'hospitalsEmergency',
   'slogan', 'coverIntro', 'startBtn', 'coverSos', 'featAssess', 'featAssessText', 'featComfort', 'featComfortText',
   'featCases', 'featCasesText', 'featHospitals', 'featHospitalsText', 'chatTitle', 'chatIntro', 'chatInputLabel', 'chatSend', 'chatCrisis',
   'chatCta', 'fact1', 'fact2', 'fact3', 'fact4', 'featuresTitle', 'footerName', 'footerSos', 'photoCredit']
    .forEach(function (id) { $(id).textContent = t(id); });
  $('assessBtn').textContent = t('assess');
  $('restartBtn').textContent = t('restart');
  $('seeCasesBtn').textContent = t('seeCases');
  $('seeComfortBtn').textContent = t('seeComfort');
  $('langs').setAttribute('aria-label', t('langGroup'));
  document.querySelectorAll('#langs button').forEach(function (b) {
    b.classList.toggle('on', b.dataset.lang === lang);
    b.setAttribute('aria-pressed', b.dataset.lang === lang);
  });
  fillList('redFlags', RED_FLAGS);
  renderComfort();
  renderHospitals();
  renderKnowledge();
  $('chatInput').placeholder = t('chatPlaceholder');
  renderChatStatus();
}

// Sports health knowledge (knowledge.js). Topics the reader opened stay
// open when the language changes.
function renderKnowledge() {
  var box = $('learnParts');
  var open = {};
  box.querySelectorAll('details[open]').forEach(function (d) { open[d.dataset.key] = true; });
  box.innerHTML = '';
  KNOWLEDGE.forEach(function (part) {
    var section = document.createElement('section');
    section.className = 'card learn-part';
    var heading = document.createElement('h2');
    heading.textContent = L(part.title);
    section.appendChild(heading);
    part.topics.forEach(function (topic, index) {
      var details = document.createElement('details');
      details.dataset.key = part.id + index;
      details.open = !!open[details.dataset.key];
      var summary = document.createElement('summary');
      summary.textContent = L(topic.title);
      details.appendChild(summary);
      var list = document.createElement('ul');
      topic.points.forEach(function (point) {
        var li = document.createElement('li');
        li.textContent = L(point);
        list.appendChild(li);
      });
      details.appendChild(list);
      section.appendChild(details);
    });
    box.appendChild(section);
  });
}

// The city the visitor last searched for, so a language change redraws it.
var citySearchText = '';

// Map buttons in a row, like the four kinds of place below.
function mapButtons(links) {
  var box = document.createElement('div');
  box.className = 'links';
  [['google', 'googleMaps'], ['amap', 'amap']].forEach(function (pair) {
    if (!links[pair[0]]) return;
    var a = document.createElement('a');
    a.href = links[pair[0]];
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = t(pair[1]);
    box.appendChild(a);
  });
  return box;
}

function renderCityResult() {
  var box = $('cityResult');
  box.innerHTML = '';
  $('cityInput').placeholder = t('cityPlaceholder');
  if (!citySearchText) {
    var listed = document.createElement('p');

// The menu shows one section at a time. The section is in the address
// (#cases, ...), so the back button and shared links work. Without one,
// the cover comes first.
var VIEWS = ['home', 'assess', 'comfort', 'cases', 'hospitals', 'log', 'learn'];

function currentView() {
  var name = location.hash.slice(1);
  return VIEWS.indexOf(name) >= 0 ? name : 'home';
}

function showView() {
  var view = currentView();
  var locked = isLockedView(view) && currentAccountState() !== 'signedIn';
  VIEWS.forEach(function (name) { $('view-' + name).hidden = name !== view || locked; });
  $('accountLock').hidden = !locked;
  $('accountBar').hidden = !isLockedView(view) || locked;
  document.querySelectorAll('#tabs a').forEach(function (a) {
    if (a.dataset.view === view) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
  scrollToCurrentTab();
  // The chart is sized to its box, which has no width while hidden.
  if (view === 'log' && !locked) renderPainTrend();
}

// On phones not every section fits in the menu: bring the current one into
// sight, and fade the right edge while more sections are hidden there.
function scrollToCurrentTab() {
  var tabs = $('tabs');
  var current = tabs.querySelector('[aria-current="page"]');
  if (current) {
    var tabsBox = tabs.getBoundingClientRect();
    var box = current.getBoundingClientRect();
    if (box.left < tabsBox.left || box.right > tabsBox.right) tabs.scrollLeft += box.left - tabsBox.left - 16;
  }
  updateTabsFade();
}

function updateTabsFade() {
  var tabs = $('tabs');
  tabs.classList.toggle('more-right', tabs.scrollLeft + tabs.clientWidth < tabs.scrollWidth - 2);
}

$('tabs').addEventListener('scroll', updateTabsFade);

// Phone photos are large; a smaller copy is much faster for the AI.
async function shrinkPhoto(file) {
  var bitmap = await createImageBitmap(file);
  var scale = Math.min(1, 768 / Math.max(bitmap.width, bitmap.height));
  var canvas = document.createElement('canvas');
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  bitmap.close();
  return canvas;
}

// Chrome's model may not write every language; fall back to English.
async function photoOutputLanguage() {
  if (lang === 'en') return 'en';
  var availability = await LanguageModel.availability({
    expectedInputs: [{type: 'text', languages: ['en']}, {type: 'image'}],
    expectedOutputs: [{type: 'text', languages: [lang]}]
  });
  return availability === 'unavailable' ? 'en' : lang;
}

// ---- Comfort chat ----
// One AI session per language, so it remembers the conversation. Messages
// live only in this page and are gone after a refresh.
var chat = {session: null, sessionLang: null, busy: false, status: null, statusArg: null};

function setChatStatus(status, arg) {
  chat.status = status;
  chat.statusArg = arg;
  renderChatStatus();
}

function renderChatStatus() {

function addBubble(text, who) {
  var bubble = document.createElement('div');
  bubble.className = 'bubble ' + who;
  bubble.textContent = text;
  $('chatLog').appendChild(bubble);
  bubble.scrollIntoView({behavior: 'smooth', block: 'nearest'});
}

// The model reads and writes the page language when Chrome supports it, and
// English otherwise, with the page translating both ways.
async function chatSession() {
  if (chat.session && chat.sessionLang === lang) return chat.session;
  if (chat.session) chat.session.destroy();
  var modelLang = 'en';
  if (lang !== 'en') {
    var availability = await LanguageModel.availability({
      expectedInputs: [{type: 'text', languages: [lang]}],
      expectedOutputs: [{type: 'text', languages: [lang]}]
    });
    if (availability !== 'unavailable') modelLang = lang;
  }
  chat.session = await LanguageModel.create({
    initialPrompts: [{role: 'system', content: chatSystemPrompt(modelLang)}],
    expectedInputs: [{type: 'text', languages: [modelLang]}],
    expectedOutputs: [{type: 'text', languages: [modelLang]}],
    monitor: function (m) {
      m.addEventListener('downloadprogress', function (e) { setChatStatus('chatDownloading', Math.round(e.loaded * 100)); });
    }
  });
  chat.sessionLang = lang;
  chat.modelLang = modelLang;
  return chat.session;
}

// Translate with Chrome's built-in Translator when the model had to use
// another language; keep the original text if that is not possible.
async function translateText(text, from, to) {
  if (from === to || !text || !window.Translator) return text;
  try {
    var translator = await Translator.create({sourceLanguage: from, targetLanguage: to});
    var translated = await translator.translate(text);
    translator.destroy();
    return translated;
  } catch (e) {
    return text;
  }
}

async function sendChat(message) {
  addBubble(message, 'me');
  if (isCrisisMessage(message)) $('chatCrisis').hidden = false;
  if (!window.LanguageModel) { setChatStatus('chatUnsupported'); return; }
  chat.busy = true;
  setChatStatus('chatThinking');
  try {
    var session = await chatSession();
    setChatStatus('chatThinking');
    var reply = await session.prompt(await translateText(message, lang, chat.modelLang));
    addBubble(await translateText(reply.trim(), chat.modelLang, lang), 'ai');
    chat.busy = false;
    setChatStatus(null);
  } catch (e) {
    chat.busy = false;
    setChatStatus('chatError');
  }
}

$('chatForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var message = cleanChatMessage($('chatInput').value);
  if (!message || chat.busy) return;
  $('chatInput').value = '';
  sendChat(message);
});

// Enter sends; Shift+Enter starts a new line.
$('chatInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    $('chatForm').requestSubmit();
  }
});

async function askModelAboutPhoto(injury, canvas) {
  var outputLanguage = await photoOutputLanguage();
  var session = await LanguageModel.create({
    expectedInputs: [{type: 'text', languages: ['en']}, {type: 'image'}],
    expectedOutputs: [{type: 'text', languages: [outputLanguage]}],
    monitor: function (m) {
      m.addEventListener('downloadprogress', function (e) { setPhotoStatus('photoDownloading', Math.round(e.loaded * 100)); });
    }
  });
  try {
    var json = await session.prompt([{
      role: 'user',
      content: [{type: 'text', value: photoPrompt(injury, outputLanguage)}, {type: 'image', value: canvas}]
    }], {responseConstraint: photoSchema(injury)});
    var result = JSON.parse(json);
    result.description = await translateText(result.description, outputLanguage, lang);
    return result;
  } finally {
    session.destroy();
  }
}

async function analyzePhoto(file) {
  var injury = currentInjury;
  resetPhoto();
  var run = photo.run;
  photo.url = URL.createObjectURL(file);
  if (!file.type.startsWith('image/')) { setPhotoStatus('photoBadImage'); return; }
  if (!window.LanguageModel) { setPhotoStatus('photoUnsupported'); return; }
  setPhotoStatus('photoChecking');
  var canvas;
  try {
    canvas = await shrinkPhoto(file);
  } catch (e) {
    setPhotoStatus('photoBadImage');
    return;
  }
  var result;
  try {
    result = await askModelAboutPhoto(injury, canvas);
  } catch (e) {
    // A newer photo or another injury was picked meanwhile.
    if (run !== photo.run) return;
    setPhotoStatus(e.name === 'NotSupportedError' ? 'photoUnsupported' : 'photoError');
    return;
  }
  if (run !== photo.run) return;
  var filled = applyPhotoResult(injury, answers, result);
  filled.forEach(function (id) { photo.filled[id] = true; });
  photo.description = result.isInjury ? result.description : '';
  if (!result.isInjury) setPhotoStatus('photoNotInjury');
  else if (filled.length === 0) setPhotoStatus('photoNothing');
  else setPhotoStatus('photoFilled', filled.length);
  renderQuestions();
  if (showingResults) renderResults();
  else if (!$('error').hidden) showMissing();
}

$('photoInput').addEventListener('change', function () {

var rehabToPlan = {added: null, problem: null};

function resetRehabToPlan() {
  rehabToPlan = {added: null, problem: null};
  var today = logDateString(new Date());
  $('rehabPlanDate').value = today;
  $('rehabPlanDate').max = today;
}

function renderRehabToPlan() {
  var timed = currentInjury.rehab.some(function (stage) { return stage.days; });
  ['rehabPlanTitle', 'rehabPlanDateLabel', 'rehabPlanBtn', 'rehabPlanGo'].forEach(function (id) { $(id).textContent = t(id); });
  $('rehabPlanHint').textContent = t(timed ? 'rehabPlanHint' : 'rehabPlanNone');
  $('rehabPlanForm').hidden = !timed;
  $('rehabPlanError').textContent = rehabToPlan.problem ? t(rehabToPlan.problem) : '';
  $('rehabPlanError').hidden = !rehabToPlan.problem;
  var added = rehabToPlan.added;
  $('rehabPlanDone').hidden = !added;
  $('rehabPlanGo').hidden = !added;
  $('rehabPlanLater').hidden = !added;
  if (!added) return;
  var now = added.filter(function (item) { return isDueOn(item, logDateString(new Date())); })[0];
  $('rehabPlanDone').textContent = t('rehabPlanAdded').replace('{0}', added.length) +
    (now ? (lang === 'zh' ? '' : ' ') + t('rehabPlanNow').replace('{0}', planItemName(now)) : '');
  var later = untimedRehabStages(currentInjury).map(function (stage) { return L(stage.when); });
  $('rehabPlanLater').hidden = later.length === 0;
  $('rehabPlanLater').textContent = t('rehabPlanLater').replace('{0}', later.join(lang === 'zh' ? '、' : ', '));
}

$('rehabPlanBtn').addEventListener('click', function () {
  var date = $('rehabPlanDate').value;
  var today = logDateString(new Date());
  rehabToPlan.added = null;
  rehabToPlan.problem = !DATE_PATTERN.test(date) || date > today ? 'rehabPlanBadDate' : null;
  var items = rehabToPlan.problem ? [] : rehabPlanItems(currentInjury, date, today, new Date());
  if (!rehabToPlan.problem && items.length === 0) rehabToPlan.problem = 'rehabPlanAllPast';
  if (rehabToPlan.problem) { renderRehabToPlan(); return; }
  $('rehabPlanBtn').disabled = true;
  planStore.replaceRehab(currentInjury.id, items).then(function () {
    rehabToPlan.added = items;
    return loadPlan();
  }).catch(function () {
    rehabToPlan.problem = 'rehabPlanFailed';
  }).then(function () {
    $('rehabPlanBtn').disabled = false;
    renderRehabToPlan();
  });
});
resetRehabToPlan();

    var label = document.createElement('label');

function problemText(p) {
  var limits = CASE_FIELDS[p.field] || {};
  return t('problem_' + p.problem)
    .replace('{0}', t('caseNames')[p.field])

function caseCard(c) {
  var injury = findInjury(c.injury);

function renderCases() {

  Object.keys(CASE_FIELDS).forEach(function (field) { $('caseLabel-' + field).textContent = t('caseLabels')[field]; });
  injuryOptions($('caseInjury'), t('choose'), $('caseInjury').value);

var TREND_CLASSES = {painRest: 'trend-rest', painExercise: 'trend-exercise'};
var TREND_NAMES = {painRest: 'trendRest', painExercise: 'trendExercise'};

// A score like 2.5 as "2.5", and 3 as "3".
function trendScore(score) { return String(Math.round(score * 10) / 10); }

function svgElement(name, attributes) {
  var element = document.createElementNS('http://www.w3.org/2000/svg', name);
  Object.keys(attributes).forEach(function (key) { element.setAttribute(key, attributes[key]); });
  return element;
}

// A line chart of the two pain scores. Days are spaced by real time, so a
// week without records shows as a longer gap. It is drawn at the box's real
// width, so the labels keep their size on a phone.
function painTrendChart(points, width) {
  var height = 220, left = 30, right = 12, top = 12, bottom = 30;
  var totalDays = Math.max(1, daysBetween(points[0].date, points[points.length - 1].date));
  function x(date) { return left + daysBetween(points[0].date, date) / totalDays * (width - left - right); }
  function y(score) { return top + (1 - score / LOG_PAIN_MAX) * (height - top - bottom); }
  var svg = svgElement('svg', {viewBox: '0 0 ' + width + ' ' + height, role: 'img', 'aria-labelledby': 'logTrendTitle'});
  [0, 5, 10].forEach(function (score) {
    svg.appendChild(svgElement('line', {class: 'grid', x1: left, x2: width - right, y1: y(score), y2: y(score)}));
    var label = svgElement('text', {class: 'axis-label', x: left - 8, y: y(score) + 4, 'text-anchor': 'end'});
    label.textContent = score;
    svg.appendChild(label);
  });
  [points[0], points[points.length - 1]].forEach(function (point, index) {
    var label = svgElement('text', {class: 'axis-label', x: x(point.date), y: height - 10, 'text-anchor': index === 0 ? 'start' : 'end'});
    label.textContent = formatShortDate(point.date);
    svg.appendChild(label);
  });
  LOG_PAIN_FIELDS.forEach(function (field) {
    var scored = points.filter(function (point) { return point[field] !== null; });
    var line = svgElement('polyline', {class: TREND_CLASSES[field], points: scored.map(function (point) { return x(point.date) + ',' + y(point[field]); }).join(' ')});
    svg.appendChild(line);
    scored.forEach(function (point) {
      var dot = svgElement('circle', {class: TREND_CLASSES[field], cx: x(point.date), cy: y(point[field]), r: 4.5});
      var tip = svgElement('title', {});
      tip.textContent = formatShortDate(point.date) + ' · ' + t(TREND_NAMES[field]) + ' ' + trendScore(point[field]) + '/10';
      dot.appendChild(tip);
      svg.appendChild(dot);
    });
  });
  return svg;
}

function formatShortDate(dateString) {
  var parts = dateString.split('-').map(Number);
  return new Date(parts[0], parts[1] - 1, parts[2]).toLocaleDateString(lang === 'zh' ? 'zh-CN' : lang, {month: 'short', day: 'numeric'});
}

// The trend sits above the records once there are any. With fewer than two
// days of scores there is no line to draw, so it says what to do instead.
function renderPainTrend() {
  var ready = log.status === 'ready' && log.entries.length > 0;
  $('logTrend').hidden = !ready;
  if (!ready) return;
  var points = painTrend(log.entries);
  $('logTrendTitle').textContent = t('logTrendTitle');
  $('logTrendHint').textContent = t(points.length === 0 ? 'logTrendNone' : points.length === 1 ? 'logTrendOneMore' : 'logTrendHint');
  var chart = $('logTrendChart');
  var legend = $('logTrendLegend');
  chart.innerHTML = '';
  legend.innerHTML = '';
  if (points.length < 2) return;
  chart.appendChild(painTrendChart(points, Math.max(260, chart.clientWidth || 600)));
  LOG_PAIN_FIELDS.forEach(function (field) {
    var scores = points.filter(function (point) { return point[field] !== null; }).map(function (point) { return point[field]; });
    if (scores.length === 0) return;
    var item = document.createElement('li');
    item.className = TREND_CLASSES[field];
    var text = document.createElement('span');
    var change = scores.length === 1 ? trendScore(scores[0])
      : t('trendChange').replace('{0}', trendScore(scores[0])).replace('{1}', trendScore(scores[scores.length - 1]));
    text.textContent = t(TREND_NAMES[field]) + ' ' + change;
    item.appendChild(text);
    legend.appendChild(item);
  });
}

// One button per pain score. Tapping the chosen score again clears it,
// since the score is optional.
function buildPainScale(field) {
  var scale = $(field);
  for (var score = 0; score <= LOG_PAIN_MAX; score++) {
    var label = document.createElement('label');
    label.innerHTML = '<input type="radio" class="visually-hidden"><span></span>';
    label.querySelector('input').name = field;
    label.querySelector('input').value = score;
    label.querySelector('span').textContent = score;
    scale.appendChild(label);
  }
  var checkedBefore = null;
  scale.addEventListener('pointerdown', function () {
    checkedBefore = scale.querySelector('input:checked');
  });
  scale.addEventListener('click', function (e) {
    if (e.target.tagName === 'INPUT' && e.target === checkedBefore) {
      e.target.checked = false;
      checkedBefore = null;
    }
  });
}

var PLAN_PROBLEM_TEXT = {
  name: function (p) { return p.problem === 'tooLong' ? t('planProblemNameLong').replace('{0}', PLAN_NAME_MAX) : t('planProblemName'); },
  amount: function () { return t('planProblemAmountLong').replace('{0}', PLAN_AMOUNT_MAX); },
  days: function () { return t('planProblemDays'); },
  start: function () { return t('planProblemStart'); },
  end: function () { return t('planProblemEnd'); }
};

function planDaysText(item) {
  if (item.days.length === 7) return t('planEveryDay');
  var names = item.days.map(function (day) { return t('weekdays')[day]; });
  return t('planWeekly').replace('{0}', names.join(lang === 'zh' ? '、' : ', '));
}

function planDatesText(item) {
  if (!item.end) return t('planFrom').replace('{0}', formatShortDate(item.start));
  return t('planRange').replace('{0}', formatShortDate(item.start)).replace('{1}', formatShortDate(item.end));
}

// A stage added from the results shows its goal in the page's language.
function planItemName(item) {
  var stage = rehabStageOf(item);
  return stage ? L(stage.goal) : item.name;
}

function planItemLabel(item) {
  var label = document.createElement('span');
  label.textContent = planItemName(item);
  if (item.amount) {
    var amount = document.createElement('small');
    amount.textContent = item.amount;
    label.appendChild(amount);
  }
  return label;
}

// The day buttons in the form: "every day" and one per weekday, Monday first.
function buildDayPicks() {
  var box = $('planDays');
  ['all', 1, 2, 3, 4, 5, 6, 0].forEach(function (day) {
    var label = document.createElement('label');
    label.innerHTML = '<input type="checkbox" class="visually-hidden"><span></span>';
    label.querySelector('input').value = day;
    box.appendChild(label);
  });
  box.addEventListener('change', function (e) {
    var boxes = box.querySelectorAll('input');
    if (e.target.value === 'all') boxes.forEach(function (input) { input.checked = e.target.checked; });
    else boxes[0].checked = [].slice.call(boxes, 1).every(function (input) { return input.checked; });
  });
}

function setPickedDays(days) {
  $('planDays').querySelectorAll('input').forEach(function (input) {
    input.checked = input.value === 'all' ? days.length === 7 : days.indexOf(Number(input.value)) >= 0;
  });
}

function pickedDays() {
  return [].slice.call($('planDays').querySelectorAll('input:checked'))
    .filter(function (input) { return input.value !== 'all'; })
    .map(function (input) { return Number(input.value); });
}

function renderPlan() {
  ['planTitle', 'planIntro', 'planNameLabel', 'planAmountLabel', 'planDaysLabel', 'planStartLabel', 'planEndLabel',
   'calendarTitle', 'calendarHint', 'calendarTimeLabel', 'calendarBtn', 'calendarNone', 'calendarDone']
    .forEach(function (id) { $(id).textContent = t(id); });
  $('planCancelBtn').textContent = t('planCancel');
  $('planName').placeholder = t('planNamePlaceholder');
  $('planAmount').placeholder = t('planAmountPlaceholder');
  $('planDays').querySelectorAll('span').forEach(function (span, index) {
    span.textContent = index === 0 ? t('planEveryDay') : t('weekdays')[[1, 2, 3, 4, 5, 6, 0][index - 1]];
  });
  $('planTodayTitle').textContent = t('planTodayTitle').replace('{0}', formatLogDate(plan.today));

  var ready = plan.status === 'ready';
  var due = ready ? itemsDueOn(plan.items, plan.today) : [];
  var doneCount = due.filter(function (item) { return plan.done.indexOf(item.id) >= 0; }).length;
  var progressKey = plan.status === 'loading' ? 'logLoading' : plan.status === 'error' ? 'planLoadFailed'
    : plan.items.length === 0 ? 'planEmpty' : due.length === 0 ? 'planNoneToday'
    : doneCount === due.length ? 'planAllDone' : 'planProgress';
  $('planProgress').textContent = t(progressKey).replace('{0}', doneCount).replace('{1}', due.length);

  var today = $('planToday');
  today.innerHTML = '';
  due.forEach(function (item) {
    var row = document.createElement('li');
    var label = document.createElement('label');
    var box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = plan.done.indexOf(item.id) >= 0;
    box.dataset.id = item.id;
    label.className = box.checked ? 'done' : '';
    label.appendChild(box);
    label.appendChild(planItemLabel(item));
    row.appendChild(label);
    var stage = rehabStageOf(item);
    if (stage) {
      var moves = document.createElement('ul');
      moves.className = 'plan-moves';
      stage.moves.forEach(function (move) {
        var li = document.createElement('li');
        li.textContent = L(move);
        moves.appendChild(li);
      });
      row.appendChild(moves);
    }
    today.appendChild(row);
  });
  $('planError').textContent = t('planSaveFailed');
  $('planError').hidden = !(plan.saveFailed && !plan.formOpen);
  $('planSaved').textContent = t('planSavedMsg');
  $('planSaved').hidden = !plan.saved;

  $('planAddBtn').textContent = t('planAdd');
  $('planAddBtn').hidden = plan.formOpen || !ready;
  $('planForm').hidden = !plan.formOpen;
  $('planFormTitle').textContent = t(plan.editing ? 'planFormEdit' : 'planFormAdd');
  $('planSaveBtn').textContent = t(plan.editing ? 'planUpdate' : 'planSave');
  $('planSaveBtn').disabled = plan.saving;
  var errors = plan.problems.map(function (p) { return PLAN_PROBLEM_TEXT[p.field](p); });
  if (plan.saveFailed && plan.formOpen) errors.push(t('planSaveFailed'));
  $('planFormError').textContent = errors.join(' ');
  $('planFormError').hidden = errors.length === 0;

  var items = sortPlanItems(plan.items, plan.today);
  $('planAll').hidden = items.length === 0;
  $('planListTitle').textContent = t('planListTitle').replace('{0}', items.length);
  var list = $('planList');
  list.innerHTML = '';
  items.forEach(function (item) {
    var row = document.createElement('div');
    row.className = 'plan-item';
    var name = document.createElement('strong');
    name.appendChild(planItemLabel(item));
    var meta = document.createElement('div');
    meta.className = 'case-meta';
    var notes = [planDaysText(item), planDatesText(item)];
    if (isPlanItemOver(item, plan.today)) notes.push(t('planOver'));
    else if (item.start > plan.today) notes.push(t('planNotYet'));
    meta.textContent = notes.join(' · ');
    row.appendChild(name);
    row.appendChild(meta);
    [['planEdit', 'edit'], ['planDelete', 'delete']].forEach(function (pair) {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'secondary';
      button.textContent = t(pair[0]);
      button.dataset.action = pair[1];
      button.dataset.id = item.id;
      row.appendChild(button);
    });
    list.appendChild(row);
  });

  var active = plan.items.filter(function (item) { return !isPlanItemOver(item, plan.today); });
  $('calendarBtn').disabled = active.length === 0;
  $('calendarNone').hidden = !ready || active.length > 0;
  $('calendarDone').hidden = !plan.calendarDone;

  $('homeToday').hidden = due.length === 0 || currentAccountState() !== 'signedIn';
  if (due.length > 0) {
    $('homeToday').innerHTML = '<strong></strong> <span class="muted"></span>';
    $('homeToday').querySelector('strong').textContent = doneCount === due.length
      ? t('homeTodayAllDone').split('{0}').join(due.length)
      : t('homeToday').replace('{0}', doneCount).replace('{1}', due.length);
    $('homeToday').querySelector('span').textContent = t('homeTodayGo');
  }
}

// Reads the plan and today's ticks. A new day starts with nothing ticked.
function loadPlan() {
  plan.today = logDateString(new Date());
  return Promise.all([planStore.all(), planStore.doneOn(plan.today)]).then(function (results) {
    plan.items = results[0];
    plan.done = results[1];
    plan.status = 'ready';
  }).catch(function () {
    plan.status = 'error';
  }).then(renderPlan);
}

function openPlanForm(item) {
  plan.formOpen = true;
  plan.editing = item || null;
  plan.problems = [];
  plan.saveFailed = false;
  plan.saved = false;
  $('planName').value = item ? planItemName(item) : '';
  $('planAmount').value = item ? item.amount : '';
  setPickedDays(item ? item.days : ALL_WEEKDAYS);
  $('planStart').value = item ? item.start : plan.today;
  $('planEnd').value = item ? item.end : '';
  renderPlan();
  $('planForm').scrollIntoView({block: 'nearest'});
  $('planName').focus();
}

$('planAddBtn').addEventListener('click', function () { openPlanForm(null); });

$('planCancelBtn').addEventListener('click', function () {
  plan.formOpen = false;
  plan.problems = [];
  renderPlan();
});

$('planForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var item = planItemFromForm({name: $('planName').value, amount: $('planAmount').value, days: pickedDays(),
    start: $('planStart').value, end: $('planEnd').value}, new Date());
  if (plan.editing) {
    item.id = plan.editing.id;
    item.createdAt = plan.editing.createdAt;
    // A stage keeps its link (and its list of moves) unless it was renamed.
    if (plan.editing.ref && item.name === planItemName(plan.editing)) {
      item.name = plan.editing.name;
      item.ref = plan.editing.ref;
    }
  }
  plan.problems = planItemProblems(item);
  plan.saveFailed = false;
  if (plan.problems.length > 0) { renderPlan(); return; }
  plan.saving = true;
  renderPlan();
  planStore.save(item).then(function () {
    plan.formOpen = false;
    plan.editing = null;
    plan.saved = true;
    plan.calendarDone = false;
    return loadPlan();
  }).catch(function () {
    plan.saveFailed = true;
  }).then(function () {
    plan.saving = false;
    renderPlan();
  });
});

$('planToday').addEventListener('change', function (e) {
  var id = Number(e.target.dataset.id);
  var done = e.target.checked;
  plan.done = plan.done.filter(function (doneId) { return doneId !== id; }).concat(done ? [id] : []);
  plan.saved = false;
  plan.saveFailed = false;
  renderPlan();
  planStore.setDone(id, plan.today, done).catch(function () {
    plan.saveFailed = true;
    return loadPlan();

$('planList').addEventListener('click', function (e) {
  var id = Number(e.target.dataset.id);

  if (e.target.dataset.action === 'edit') { openPlanForm(item); return; }
  if (e.target.dataset.action !== 'delete' || !confirm(t('planDeleteConfirm').replace('{0}', planItemName(item)))) return;
  plan.saved = false;
  plan.calendarDone = false;
  planStore.remove(id).catch(function () { plan.saveFailed = true; }).then(loadPlan);
});

// Downloads a calendar file; phones and computers offer to add it to their calendar.
$('calendarBtn').addEventListener('click', function () {
  var time = /^\d{2}:\d{2}$/.test($('calendarTime').value) ? $('calendarTime').value : '20:00';
  var active = plan.items.filter(function (item) { return !isPlanItemOver(item, plan.today); });
  var named = active.map(function (item) { return Object.assign({}, item, {name: planItemName(item)}); });
  var file = new Blob([planCalendar(named, time, t('calendarEventTitle'), new Date())], {type: 'text/calendar'});
  var link = document.createElement('a');
  link.href = URL.createObjectURL(file);
  link.download = 'rehab-reminders.ics';
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(function () { URL.revokeObjectURL(link.href); }, 1000);
  plan.calendarDone = true;
  renderPlan();
});

// Coming back to the page on a new day shows the new day's exercises.
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && plan.today !== logDateString(new Date())) loadPlan();
});

buildDayPicks();

// ---- Cover slideshow ----
// `position` keeps the subject in view on a phone, where the photo is cropped
// narrow; `wide` is for computers, where the words sit on the left. `crop`
// cuts the photo first (rect=x,y,width,height in the original's pixels).
var COVER_SLIDES = [
  {photo: 'photo-1758691463582-11aea602cd4a', crop: 'rect=0,150,2560,1440', position: '72% 25%', wide: 'right 25%', author: 'Vitaly Gariev', page: 'https://unsplash.com/photos/a-smiling-doctor-with-glasses-and-stethoscope-stands-arms-crossed-XqMo4OlBnh0'},
  {photo: 'photo-1461896836934-ffe607ba8211', position: '60% 60%', author: 'Braden Collum', page: 'https://unsplash.com/photos/man-on-running-field-9HI8UJMSdZA'},
  {photo: 'photo-1706777193603-76c3e9613553', position: '45% 50%', author: 'Tom Claes', page: 'https://unsplash.com/photos/a-person-sitting-on-a-chair-with-a-foot-in-a-cast-gkgLYinrRtM'},
  {photo: 'photo-1649751361457-01d3a696c7e6', position: '55% 40%', author: 'yury kirillov', page: 'https://unsplash.com/photos/a-man-getting-his-leg-examined-by-a-doctor-pbUWW-CBoqY'},
  {photo: 'photo-1645005513713-9e2b92a687d3', position: '50% 40%', author: 'Sincerely Media', page: 'https://unsplash.com/photos/a-man-and-a-woman-holding-dumbs-in-their-hands-inoZpsBQRqk'}
];
var COVER_SECONDS = 4.5;
var cover = {current: 0, timer: null};

function coverImage(slide) {
  return 'url("https://images.unsplash.com/' + slide.photo + '?' + (slide.crop ? slide.crop + '&' : '') + 'w=1920&q=80&auto=format&fit=crop")';
}

// A photo is only downloaded when it is shown or about to be, to save data on phones.
function loadCoverSlide(index) {
  var layer = $('coverSlides').children[index];
  if (!layer.style.backgroundImage) layer.style.backgroundImage = coverImage(COVER_SLIDES[index]);
}

function showCoverSlide(index) {
  cover.current = (index + COVER_SLIDES.length) % COVER_SLIDES.length;
  loadCoverSlide(cover.current);
  loadCoverSlide((cover.current + 1) % COVER_SLIDES.length);
  [].forEach.call($('coverSlides').children, function (layer, i) { layer.classList.toggle('on', i === cover.current); });
  [].forEach.call($('coverDots').children, function (dot, i) { dot.setAttribute('aria-current', String(i === cover.current)); });
}

// Moves on every few seconds, unless the visitor asked for less motion, the
// tab is hidden, or another section is open. Picking a dot restarts the wait.
function startCoverTimer() {
  clearInterval(cover.timer);
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  cover.timer = setInterval(function () {
    if (!document.hidden && !$('view-home').hidden) showCoverSlide(cover.current + 1);
  }, COVER_SECONDS * 1000);
}

function buildCover() {
  COVER_SLIDES.forEach(function (slide, index) {
    var layer = document.createElement('div');
    layer.className = 'cover-slide';
    layer.style.setProperty('--position', slide.position);
    layer.style.setProperty('--wide', slide.wide || slide.position);
    $('coverSlides').appendChild(layer);
    var dot = document.createElement('button');
    dot.type = 'button';
    dot.addEventListener('click', function () {
      showCoverSlide(index);
      startCoverTimer();
    });
    $('coverDots').appendChild(dot);
  });
  showCoverSlide(0);
  startCoverTimer();
}

function renderCover() {
  [].forEach.call($('coverDots').children, function (dot, index) {
    dot.setAttribute('aria-label', t('coverSlide').replace('{0}', index + 1));
  });
  var credits = $('photoCredits');
  credits.innerHTML = '';
  COVER_SLIDES.forEach(function (slide, index) {
    if (index > 0) credits.appendChild(document.createTextNode(' · '));
    var link = document.createElement('a');
    link.href = slide.page;
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = slide.author;
    credits.appendChild(link);
  });
}

buildCover();
renderCover();
loadPlan();

$('seeCasesBtn').addEventListener('click', function () {
  cases.filter = currentInjury ? currentInjury.id : '';
  renderCases();
  location.hash = 'cases';
});

$('seeComfortBtn').addEventListener('click', function () {
  location.hash = 'comfort';
});

$('questions').addEventListener('submit', function (e) {
  e.preventDefault();
  if (showMissing() > 0) {
    $('q-' + missingAnswers(currentInjury, answers)[0]).scrollIntoView({behavior: 'smooth', block: 'center'});
    return;
  }
  showingResults = true;
  renderResults();
  $('results').scrollIntoView({behavior: 'smooth', block: 'start'});
});

$('restartBtn').addEventListener('click', function () {
  currentCategory = null;
  currentInjury = null;
  clearAnswers();
  $('questionsCard').hidden = true;
  renderAll();
  window.scrollTo({top: 0, behavior: 'smooth'});
});

document.querySelectorAll('#langs button').forEach(function (b) {
  b.addEventListener('click', function () {
    lang = b.dataset.lang;
    saveLang();
    renderAll();
  });
});

// ---- Sign-in for the private sections ----
// Firebase checks the email and password; the rules are in account.js.

function currentAccountState() {
  if (account.status !== 'ready') return account.status;
  return accountState(account.user, accountOwner.get(), new Date());
}

var ACCOUNT_PROBLEM_TEXT = {
  'email|missing': 'accountEmailMissing',
  'email|bad': 'accountEmailBad',
  'password|missing': 'accountPasswordMissing',
  'password|tooShort': 'accountPasswordShort',
  'password|tooLong': 'accountPasswordLong',
  'confirm|different': 'accountConfirmDifferent'
};

function showMessage(id, key) {
  $(id).hidden = !key;
  $(id).textContent = key ? t(key) : '';
}

function renderAccount() {
  var state = currentAccountState();
  if (window.accountStore) accountStore.setLanguage(lang === 'zh' ? 'zh-CN' : lang);
  // A sign-in older than 7 days is ended here; Firebase then reports nobody.
  if (state === 'expired' && !account.signingOut) {
    account.signingOut = true;
    account.expired = true;
    accountStore.signOut().catch(function () { account.signingOut = false; });
  }
  if (state === 'signedIn' && !accountOwner.get()) accountOwner.set(account.user);

  var asking = state === 'signedOut' || state === 'expired';
  var waiting = state === 'unverified' || state === 'otherAccount';
  $('accountTitle').textContent = t('accountTitle');
  $('accountIntro').textContent = t('accountIntro');
  var status = state === 'loading' ? 'accountLoading' : state === 'error' ? 'accountUnavailable'
    : asking && account.expired ? 'accountExpired' : null;
  showMessage('accountStatus', status);

  $('accountForm').hidden = !asking;
  var mode = account.mode;
  $('accountModes').hidden = mode === 'reset';
  $('accountModes').setAttribute('aria-label', t('accountModes'));
  $('accountModeSignIn').textContent = t('accountSignIn');
  $('accountModeSignUp').textContent = t('accountSignUp');
  $('accountModeSignIn').setAttribute('aria-pressed', mode === 'signIn');
  $('accountModeSignUp').setAttribute('aria-pressed', mode === 'signUp');
  $('accountEmailLabel').textContent = t('accountEmail');
  $('accountPasswordLabel').textContent = mode === 'signUp' ? t('accountNewPassword') : t('accountPassword');
  $('accountPassword').autocomplete = mode === 'signUp' ? 'new-password' : 'current-password';
  $('accountPasswordField').hidden = mode === 'reset';
  $('accountConfirmField').hidden = mode !== 'signUp';
  $('accountConfirmLabel').textContent = t('accountConfirm');
  $('accountSubmit').disabled = account.busy;
  $('accountSubmit').textContent = account.busy ? t('accountBusy')
    : t({signIn: 'accountSignIn', signUp: 'accountCreate', reset: 'accountSendReset'}[mode]);
  var problemText = account.problems.map(function (p) { return t(ACCOUNT_PROBLEM_TEXT[p.field + '|' + p.problem]); }).join(' ');
  $('accountError').hidden = !problemText && !account.error;
  $('accountError').textContent = problemText || (account.error ? t(account.error) : '');
  showMessage('accountDone', asking ? account.done : null);
  $('accountForgot').textContent = mode === 'reset' ? t('accountBack') : t('accountForgot');

  $('accountWait').hidden = !waiting;
  if (waiting) {
    var owner = accountOwner.get();
    $('accountWaitText').textContent = state === 'unverified'
      ? t('accountCheckEmail').replace('{0}', account.user.email)
      : t('accountOtherOwner').replace('{0}', maskEmail(owner.email));
    $('accountVerifiedBtn').hidden = state !== 'unverified';
    $('accountResendBtn').hidden = state !== 'unverified';
    $('accountVerifiedBtn').textContent = t('accountVerified');
    $('accountResendBtn').textContent = t('accountResend');
    $('accountOtherBtn').textContent = t('accountUseOther');
    $('accountVerifiedBtn').disabled = $('accountResendBtn').disabled = account.busy;
  }
  showMessage('accountWaitError', waiting ? account.error : null);
  showMessage('accountWaitDone', waiting ? account.done : null);

  if (state === 'signedIn') $('accountWho').textContent = t('accountWho').replace('{0}', account.user.email);
  $('accountSignOut').textContent = t('accountSignOut');
}

// Redraws everything that depends on being signed in.
function accountChanged() {
  renderAccount();
  renderPlan();
  showView();
}

function setAccountMode(mode) {
  account.mode = mode;
  account.problems = [];
  account.error = null;
  account.done = null;
  accountChanged();
}

// Runs one Firebase call with the buttons disabled; `done` is the message to
// show when it worked.
function accountAction(call, done) {
  account.busy = true;
  account.problems = [];
  account.error = null;
  account.done = null;
  renderAccount();
  return call().then(function () {
    account.done = done;
  }).catch(function (e) {
    account.error = (e && e.messageKey) || accountErrorKey(e && e.code);
  }).then(function () {
    account.busy = false;
    accountChanged();
  });
}

// Called by firebase-account.js whenever the signed-in user changes.
window.onAccountChange = function (user) {
  account.status = 'ready';
  account.user = user;
  if (!user) account.signingOut = false;
  if (user && currentAccountState() === 'signedIn') account.expired = false;
  accountChanged();
};
// Called if firebase-account.js or the Firebase library cannot be loaded.
window.onAccountFailed = function () {
  account.status = 'error';
  accountChanged();
};

$('accountModes').addEventListener('click', function (event) {
  var button = event.target.closest('button[data-mode]');
  if (button) setAccountMode(button.dataset.mode);
});

$('accountForgot').addEventListener('click', function () {
  setAccountMode(account.mode === 'reset' ? 'signIn' : 'reset');
});

$('accountForm').addEventListener('submit', function (event) {
  event.preventDefault();
  if (account.busy) return;
  var mode = account.mode;
  var form = {email: $('accountEmail').value, password: $('accountPassword').value, confirm: $('accountConfirm').value};
  account.problems = accountProblems(form, mode);
  account.error = null;
  account.done = null;
  if (account.problems.length) {
    renderAccount();
    return;
  }
  var email = form.email.trim();
  var call = {
    signIn: function () { return accountStore.signIn(email, form.password); },
    signUp: function () { return accountStore.signUp(email, form.password); },
    reset: function () { return accountStore.resetPassword(email); }
  }[mode];
  accountAction(call, mode === 'reset' ? 'accountResetSent' : null).then(function () {
    if (!account.error) {
      $('accountPassword').value = '';
      $('accountConfirm').value = '';
    }
  });
});

$('accountVerifiedBtn').addEventListener('click', function () {
  accountAction(function () {
    return accountStore.refresh().then(function (user) {
      account.user = user;
      if (user && !user.emailVerified) throw {messageKey: 'accountNotVerified'};
    });
  }, null);
});

$('accountResendBtn').addEventListener('click', function () {
  accountAction(function () { return accountStore.resendVerification(); }, 'accountResent');
});

function signOutOfAccount() {
  account.mode = 'signIn';
  accountAction(function () { return accountStore.signOut(); }, null);
}
$('accountOtherBtn').addEventListener('click', signOutOfAccount);
$('accountSignOut').addEventListener('click', signOutOfAccount);

// A page left open for days also locks once the sign-in is 7 days old.
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && account.status === 'ready') accountChanged();
});

renderAll();
showView();
</script>
<script type="module" src="firebase-cases.js" onerror="onCaseStoreFailed()"></script>
<script type="module" src="firebase-account.js" onerror="onAccountFailed()"></script>
