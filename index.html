// ---- Warm-up follow-along ----
// The timer keeps running when the language changes; only the texts redraw.
var warmup = {sport: '', timer: null, interval: null, audio: null};

// A short beep when a move ends, plus a buzz on phones that support it.
function warmupBeep() {
  if (navigator.vibrate) navigator.vibrate(200);
  if (!warmup.audio) return;
  var osc = warmup.audio.createOscillator();
  var gain = warmup.audio.createGain();
  osc.frequency.value = 880;
  gain.gain.value = 0.2;
  osc.connect(gain);
  gain.connect(warmup.audio.destination);
  osc.start();
  osc.stop(warmup.audio.currentTime + 0.25);
}

function warmupStopTimer() {
  clearInterval(warmup.interval);
  warmup.interval = null;
}

function renderWarmup() {
  ['warmupTitle', 'warmupIntro', 'warmupSportLabel', 'warmupStart', 'warmupSkip', 'warmupStop', 'warmupDoneTitle', 'warmupDoneText', 'warmupAgain']
    .forEach(function (key) { $(key).textContent = t(key); });
  var select = $('warmupSport');
  select.innerHTML = '';
  var first = document.createElement('option');
  first.value = '';
  first.textContent = t('warmupSportPick');
  select.appendChild(first);
  RISK_SPORTS.forEach(function (sport) {
    var option = document.createElement('option');
    option.value = sport.id;
    option.textContent = L(sport.name);
    select.appendChild(option);
  });
  select.value = warmup.sport;
  var steps = warmupRoutine(warmup.sport);
  $('warmupStart').disabled = !warmup.sport;
  $('warmupPreview').hidden = !warmup.sport;
  $('warmupTotal').textContent = t('warmupTotal').replace('{0}', warmupTotalMinutes(warmup.sport)).replace('{1}', steps.length);
  var list = $('warmupList');
  list.innerHTML = '';
  steps.forEach(function (step) {
    list.appendChild(document.createElement('li')).textContent = L(WARMUP_MOVES[step.move].name) + ' · ' + warmupClock(step.seconds);
  });
  var timer = warmup.timer;
  $('warmupSetup').hidden = !!timer;
  $('warmupRun').hidden = !timer || timer.done;
  $('warmupDone').hidden = !timer || !timer.done;
  if (!timer || timer.done) return;
  var move = WARMUP_MOVES[steps[timer.index].move];
  $('warmupStep').textContent = t('warmupStep').replace('{0}', timer.index + 1).replace('{1}', steps.length);
  $('warmupMove').textContent = L(move.name);
  $('warmupHow').textContent = L(move.how);
  $('warmupClock').textContent = warmupClock(timer.left);
  $('warmupClock').classList.toggle('paused', timer.paused);
  var next = steps[timer.index + 1];
  $('warmupNext').textContent = next ? t('warmupNext').replace('{0}', L(WARMUP_MOVES[next.move].name)) : t('warmupLast');
  $('warmupPause').textContent = t(timer.paused ? 'warmupResume' : 'warmupPause');
}

// Moves the timer on, beeping when a move changes or the warm-up ends.
function warmupSetTimer(timer) {
  var moved = warmup.timer && (timer.index !== warmup.timer.index || timer.done);
  warmup.timer = timer;
  if (moved) warmupBeep();
  if (timer.done) warmupStopTimer();
  renderWarmup();
}

$('warmupSport').addEventListener('change', function () {
  warmup.sport = this.value;
  renderWarmup();
});

$('warmupStart').addEventListener('click', function () {
  // Sound may only start after a tap, so the audio is set up here.
  var AudioType = window.AudioContext || window.webkitAudioContext;
  if (!warmup.audio && AudioType) warmup.audio = new AudioType();
  warmup.timer = warmupStart(warmup.sport);
  warmupStopTimer();
  warmup.interval = setInterval(function () { warmupSetTimer(warmupTick(warmup.timer)); }, 1000);
  renderWarmup();
  $('warmupCard').scrollIntoView({behavior: 'smooth', block: 'start'});
});

$('warmupPause').addEventListener('click', function () { warmupSetTimer(warmupTogglePause(warmup.timer)); });
$('warmupSkip').addEventListener('click', function () { warmupSetTimer(warmupSkip(warmup.timer)); });

function warmupBackToStart() {
  warmupStopTimer();
  warmup.timer = null;
  renderWarmup();
}
$('warmupStop').addEventListener('click', warmupBackToStart);
$('warmupAgain').addEventListener('click', warmupBackToStart);

// ---- Training load log ----
var training = {entries: loadTrainingEntries(), problems: [], saved: false};

function renderTraining() {
  ['trainingTitle', 'trainingIntro', 'trainingDateLabel', 'trainingMinutesLabel', 'trainingEffortLabel', 'trainingSave', 'trainingListTitle', 'trainingEmpty', 'trainingNote']
    .forEach(function (key) { $(key).textContent = t(key); });
  var today = logDateString(new Date());
  $('trainingDate').max = today;
  if (!$('trainingDate').value) $('trainingDate').value = today;
  var effort = $('trainingEffort');
  var chosen = effort.value;
  effort.innerHTML = '';
  var first = document.createElement('option');
  first.value = '';
  first.textContent = t('trainingEffortPick');
  effort.appendChild(first);
  for (var level = 1; level <= 10; level++) {
    var option = document.createElement('option');
    option.value = String(level);
    var word = {1: 'trainingEffort1', 5: 'trainingEffort5', 10: 'trainingEffort10'}[level];
    option.textContent = word ? level + ' · ' + t(word) : String(level);
    effort.appendChild(option);
  }
  effort.value = chosen;
  $('trainingError').hidden = training.problems.length === 0;
  $('trainingError').textContent = training.problems.map(function (field) { return t('trainingBad_' + field); }).join(' ');
  $('trainingSaved').hidden = !training.saved;
  $('trainingSaved').textContent = t('trainingSavedMsg');

  var box = $('trainingResult');
  box.innerHTML = '';
  var result = trainingLoadResult(training.entries, today);
  box.hidden = result.status === 'empty';
  function add(text, className) {
    var p = document.createElement('p');
    p.textContent = text;
    if (className) p.className = className;
    box.appendChild(p);
  }
  if (result.status === 'tooSoon') {
    add(t('trainingThisWeek').replace('{0}', result.thisWeek));
    add(t('trainingTooSoon'), 'muted');
  } else if (result.status === 'jump' || result.status === 'steady') {
    add(t('trainingThisWeek').replace('{0}', result.thisWeek) + ' ' + t('trainingAverage').replace('{0}', result.average));
    if (result.status === 'jump') {
      add(result.percent === null ? t('trainingJumpFromZero') : t('trainingJump').replace('{0}', result.percent), 'training-jump');
      add(t('trainingJumpTip'));
    } else {
      add(t(result.thisWeek < result.average ? 'trainingLighter' : 'trainingSteady'));
    }
  }

  var list = $('trainingList');
  list.innerHTML = '';
  var sorted = sortTrainingEntries(training.entries);
  $('trainingEmpty').hidden = sorted.length > 0;
  sorted.forEach(function (entry) {
    var li = document.createElement('li');
    var text = document.createElement('span');
    text.textContent = t('trainingEntry').replace('{0}', entry.date).replace('{1}', entry.minutes).replace('{2}', entry.effort).replace('{3}', trainingLoad(entry));
    var remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'secondary';
    remove.textContent = t('logDelete');
    remove.addEventListener('click', function () {
      if (!confirm(t('logDeleteConfirm'))) return;
      var kept = training.entries.filter(function (other) { return other.id !== entry.id; });
      if (!saveTrainingEntries(kept)) return alert(t('logSaveFailed'));
      training.entries = kept;
      training.saved = false;
      renderTraining();
    });
    li.appendChild(text);
    li.appendChild(remove);
    list.appendChild(li);
  });
}

$('trainingForm').addEventListener('submit', function (event) {
  event.preventDefault();
  var today = logDateString(new Date());
  var date = $('trainingDate').value;
  var minutes = $('trainingMinutes').value.trim();
  var effort = $('trainingEffort').value;
  training.problems = trainingEntryProblems(date, minutes, effort, today);
  training.saved = false;
  if (training.problems.length === 0) {
    var entry = {id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date: date, minutes: Number(minutes), effort: Number(effort), createdAt: Date.now()};
    var entries = training.entries.concat([entry]);
    if (saveTrainingEntries(entries)) {
      training.entries = entries;
      training.saved = true;
      $('trainingMinutes').value = '';
      $('trainingEffort').value = '';
    } else {
      training.problems = ['storage'];
    }
  }
  renderTraining();
  $(training.saved ? 'trainingResult' : 'trainingError').scrollIntoView({behavior: 'smooth', block: 'nearest'});
});

// ---- Weather reminder ----
// `request` counts lookups, so an older answer arriving late is ignored.
var weather = {status: 'idle', error: '', place: '', day: null, request: 0};

function renderWeather() {
  ['weatherTitle', 'weatherIntro', 'weatherCityLabel', 'weatherSearch', 'weatherHereBtn', 'weatherNote'].forEach(function (key) { $(key).textContent = t(key); });
  $('weatherCity').placeholder = t('weatherCityHint');
  $('weatherLoading').hidden = weather.status !== 'loading';
  $('weatherLoading').textContent = t('weatherLoadingMsg');
  $('weatherError').hidden = weather.status !== 'error';
  $('weatherError').textContent = weather.error ? t(weather.error) : '';
  var box = $('weatherResult');
  box.innerHTML = '';
  box.hidden = weather.status !== 'done';
  if (box.hidden) return;
  var day = weather.day;
  box.appendChild(document.createElement('h3')).textContent = weather.place || t('weatherHere');
  var facts = document.createElement('ul');
  facts.className = 'points';
  [
    t('weatherTemp').replace('{0}', Math.round(day.min)).replace('{1}', Math.round(day.max)),
    t('weatherFeels').replace('{0}', Math.round(day.feelsMin)).replace('{1}', Math.round(day.feelsMax)),
    t('weatherRain').replace('{0}', day.rainChance),
    t('weatherWind').replace('{0}', Math.round(day.wind)),
    t('weatherUv').replace('{0}', Math.round(day.uv))
  ].forEach(function (text) { facts.appendChild(document.createElement('li')).textContent = text; });
  box.appendChild(facts);
  var warnings = weatherWarnings(day);
  if (warnings.length === 0) {
    var good = box.appendChild(document.createElement('p'));
    good.className = 'weather-good';
    good.textContent = t('weatherGood');
    return;
  }
  warnings.forEach(function (id) {
    box.appendChild(document.createElement('h4')).textContent = t('weatherWarn_' + id);
    var list = document.createElement('ul');
    list.className = 'points';
    WEATHER_TIPS[id].forEach(function (tip) { list.appendChild(document.createElement('li')).textContent = L(tip); });
    box.appendChild(list);
  });
}

function weatherFail(request, errorKey) {
  if (request !== weather.request) return;
  weather.status = 'error';
  weather.error = errorKey;
  renderWeather();
}

// Looks up today's forecast for a place and shows it.
function showWeatherFor(request, place) {
  fetch(weatherForecastUrl(place.latitude, place.longitude))
    .then(function (response) { if (!response.ok) throw new Error('forecast ' + response.status); return response.json(); })
    .then(function (json) {
      if (request !== weather.request) return;
      var day = weatherDayFromForecast(json);
      if (!day) return weatherFail(request, 'weatherFailed');
      weather.status = 'done';
      weather.place = place.name;
      weather.day = day;
      renderWeather();
      $('weatherResult').scrollIntoView({behavior: 'smooth', block: 'nearest'});
    })
    .catch(function () { weatherFail(request, 'weatherFailed'); });
}

function startWeatherLookup() {
  weather.request++;
  weather.status = 'loading';
  weather.error = '';
  renderWeather();
  return weather.request;
}

$('weatherForm').addEventListener('submit', function (event) {
  event.preventDefault();
  var city = $('weatherCity').value.trim();
  if (!city) {
    weather.status = 'error';
    weather.error = 'weatherEmpty';
    renderWeather();
    return;
  }
  var request = startWeatherLookup();
  var languages = weatherSearchLanguages(city, lang);
  function search(index) {
    if (index >= languages.length) return weatherFail(request, 'weatherNotFound');
    fetch(weatherSearchUrl(city, languages[index]))
      .then(function (response) { if (!response.ok) throw new Error('search ' + response.status); return response.json(); })
      .then(function (json) {
        var place = weatherPlaceFromSearch(json);
        if (place) showWeatherFor(request, place);
        else search(index + 1);
      })
      .catch(function () { weatherFail(request, 'weatherFailed'); });
  }
  search(0);
});

$('weatherHereBtn').addEventListener('click', function () {
  if (!navigator.geolocation) {
    weather.status = 'error';
    weather.error = 'weatherNoLocation';
    renderWeather();
    return;
  }
  var request = startWeatherLookup();
  navigator.geolocation.getCurrentPosition(function (position) {
    showWeatherFor(request, {name: '', latitude: position.coords.latitude, longitude: position.coords.longitude});
  }, function (error) {
    weatherFail(request, error.code === error.PERMISSION_DENIED ? 'weatherNoPermission' : 'weatherNoLocation');
  }, {timeout: 15000, maximumAge: 600000});
});

// A group of radio buttons or checkboxes. `key` is the answer it fills; a
// list answer takes several ticks. `explain` adds a second, smaller line.
function dvChoices(legendText, key, items, multiple) {
  var fs = document.createElement('fieldset');
  fs.appendChild(document.createElement('legend')).textContent = legendText;
  var options = document.createElement('div');
  options.className = 'options';
  items.forEach(function (item) {
    var label = document.createElement('label');
    var input = document.createElement('input');
    input.type = multiple ? 'checkbox' : 'radio';
    input.name = 'dv-' + key;
    input.checked = multiple ? dv.answers[key].indexOf(item.id) >= 0 : dv.answers[key] === item.id;
    input.addEventListener('change', function () {
      if (multiple) {
        dv.answers[key] = dv.answers[key].filter(function (id) { return id !== item.id; });
        if (input.checked) dv.answers[key].push(item.id);
      } else {
        dv.answers[key] = item.id;
      }
      dvSave();
      renderDvNote();
    });
    label.appendChild(input);
    var text = document.createElement('span');
    text.textContent = L(item.name);
    if (item.explain) text.appendChild(document.createElement('small')).textContent = L(item.explain);
    label.appendChild(text);
    options.appendChild(label);
  });
  fs.appendChild(options);
  return fs;
}

function dvSelect(labelText, pickText, values, current, onChange) {
  var label = document.createElement('label');
  label.className = 'field';
  label.appendChild(document.createElement('span')).textContent = labelText;
  var select = document.createElement('select');
  select.appendChild(new Option(pickText, ''));
  values.forEach(function (pair) { select.appendChild(new Option(pair[1], pair[0])); });
  select.value = current;
  select.addEventListener('change', function () { onChange(select.value); });
  label.appendChild(select);
  return label;
}

// ---- Guide: how to use this site ----
// `step` is the index in TOUR_STEPS while the tour is open, or -1.
var tour = {step: -1};

function renderTour() {
  $('tourOpen').textContent = t('tourOpen');
  document.querySelectorAll('#tabs a.tour-target').forEach(function (a) { a.classList.remove('tour-target'); });
  var open = tour.step >= 0;
  $('tour').hidden = !open;
  document.body.classList.toggle('touring', open);
  if (!open) return;
  var step = TOUR_STEPS[tour.step];
  var dots = $('tourDots');
  dots.innerHTML = '';
  TOUR_STEPS.forEach(function (other, i) { dots.appendChild(document.createElement('span')).className = i === tour.step ? 'on' : ''; });
  $('tourStepText').textContent = t('tourStepOf').replace('{0}', tour.step + 1).replace('{1}', TOUR_STEPS.length);
  $('tourTitle').textContent = L(step.title);
  $('tourText').textContent = L(step.text);
  $('tourSkip').textContent = t('tourSkip');
  $('tourSos').textContent = t('coverSos');

  var body = $('tourBody');
  body.innerHTML = '';
  function addButton(text, className, onClick) {
    var button = document.createElement('button');
    button.type = 'button';
    button.className = className;
    button.textContent = text;
    button.addEventListener('click', onClick);
    body.appendChild(button);
  }
  if (step.id === 'choose') {
    addButton(t('tourHurt'), 'primary', function () { closeTour('assess'); });
    addButton(t('tourLookAround'), 'secondary', function () { showTourStep(tour.step + 1); });
  } else if (step.go) {
    addButton(t('tourGo'), 'secondary', function () { closeTour(step.go); });
  }

  $('tourBack').textContent = t('tourBack');
  $('tourBack').hidden = tour.step === 0;
  var last = tour.step === TOUR_STEPS.length - 1;
  $('tourNext').textContent = t(last ? 'tourFinish' : 'tourNext');
  // On "Right now, you are…" the two big buttons are the way on.
  $('tourNext').hidden = step.id === 'choose';

  step.tabs.forEach(function (view) {
    var tab = document.querySelector('#tabs a[data-view="' + view + '"]');
    tab.classList.add('tour-target');
    tab.scrollIntoView({block: 'nearest', inline: 'center'});
  });
  updateTabsFade();
}

function showTourStep(index) {
  tour.step = index;
  renderTour();
  $('tourTitle').setAttribute('tabindex', '-1');
  $('tourTitle').focus();
}

function openTour() {
  showTourStep(0);
}

// `view` is where to go next, if anywhere; otherwise the focus goes back to
// "How to use this site", the only way to open the guide.
function closeTour(view) {
  tour.step = -1;
  renderTour();
  if (view && view !== currentView()) location.hash = view;
  else $('tourOpen').focus();
}

$('tourOpen').addEventListener('click', openTour);
$('tourSkip').addEventListener('click', function () { closeTour(null); });
$('tourBack').addEventListener('click', function () { showTourStep(tour.step - 1); });
$('tourNext').addEventListener('click', function () {
  if (tour.step === TOUR_STEPS.length - 1) closeTour('home');
  else showTourStep(tour.step + 1);
});

// Escape skips; the arrow keys move between steps; Tab stays in the card.
document.addEventListener('keydown', function (e) {
  if (tour.step < 0) return;
  if (e.key === 'Escape') {
    closeTour(null);
  } else if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && !e.target.matches('input, select, textarea')) {
    var forward = (e.key === 'ArrowRight') !== isRightToLeft();
    if (forward && !$('tourNext').hidden) $('tourNext').click();
    if (!forward && tour.step > 0) showTourStep(tour.step - 1);
  } else if (e.key === 'Tab') {
    var focusable = Array.prototype.filter.call($('tourCard').querySelectorAll('button'), function (b) { return !b.hidden; });
    var first = focusable[0];
    var lastButton = focusable[focusable.length - 1];
    if (e.shiftKey && (document.activeElement === first || !$('tourCard').contains(document.activeElement))) {
      e.preventDefault();
      lastButton.focus();
    } else if (!e.shiftKey && document.activeElement === lastButton) {
      e.preventDefault();
      first.focus();
    }
  }
});

// The box opens from the magnifier button in the header, on every page.
var SEARCH_ENTRIES = buildSearchEntries(T);
var SEARCH_TYPE_KEYS = {feature: 'searchTypeFeature', injury: 'searchTypeInjury', topic: 'searchTypeTopic', city: 'searchTypeCity'};

function renderSearch() {
  $('searchBtn').setAttribute('aria-label', t('searchOpen'));
  $('searchBtn').title = t('searchOpen');
  $('searchLabel').textContent = t('searchOpen');
  $('searchInput').placeholder = t('searchPlaceholder');
  renderSearchResults($('searchInput'), $('searchResults'), !$('searchPanel').hidden);
}

// `showHelp` shows the suggested words while nothing is typed yet.
function renderSearchResults(input, box, showHelp) {
  box.innerHTML = '';
  var query = input.value.trim();
  function chips() {
    var row = document.createElement('div');
    row.className = 'search-chips';
    t('searchSuggestions').split('|').forEach(function (word) {
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.textContent = word;
      chip.addEventListener('click', function () {
        input.value = word;
        renderSearchResults(input, box, true);
        input.focus();
      });
      row.appendChild(chip);
    });
    box.appendChild(row);
  }
  function hint(text) {
    var p = document.createElement('p');
    p.className = 'search-hint';
    p.textContent = text;
    box.appendChild(p);
  }
  if (!query) {
    if (!showHelp) return;
    hint(t('searchTry'));
    chips();
    return;
  }
  var results = searchSite(query, lang, SEARCH_ENTRIES);
  if (results.length === 0) {
    hint(t('searchNone').replace('{0}', query));
    chips();
    return;
  }
  var list = document.createElement('ul');
  list.className = 'search-list';
  results.forEach(function (entry) {
    var button = document.createElement('button');
    button.type = 'button';
    var type = document.createElement('span');
    type.className = 'search-type';
    type.textContent = t(SEARCH_TYPE_KEYS[entry.type]);
    button.appendChild(type);
    button.appendChild(document.createElement('strong')).textContent = entry.title[lang] || entry.title.en;
    var text = entry.text[lang] || entry.text.en;
    if (text) button.appendChild(document.createElement('small')).textContent = text;
    button.addEventListener('click', function () { openSearchResult(entry); });
    list.appendChild(document.createElement('li')).appendChild(button);
  });
  box.appendChild(list);
}

function setSearchPanelOpen(open) {
  $('searchPanel').hidden = !open;
  $('searchBtn').setAttribute('aria-expanded', open);
  renderSearchResults($('searchInput'), $('searchResults'), open);
  if (open) $('searchInput').focus();
}

// Scrolls to a section and briefly outlines it, so the eye finds it. Used
// by search results and the contents list on the health page.
function flashSection(element) {
  if (!element) return;
  element.scrollIntoView({behavior: 'smooth', block: 'start'});
  element.classList.remove('flash-outline');
  void element.offsetWidth;
  element.classList.add('flash-outline');
}

function openSearchResult(entry) {
  setSearchPanelOpen(false);
  $('searchInput').value = '';
  var view = {feature: entry.view, injury: 'assess', topic: 'learn', city: 'hospitals'}[entry.type];
  location.hash = view;
  // Showing a view scrolls to the top, so act once it is shown.
  setTimeout(function () {
    if (entry.type === 'feature') {
      var anchor = entry.anchor && $(entry.anchor);
      if (anchor) flashSection(anchor.closest('section') || anchor);
    } else if (entry.type === 'injury') {
      var injury = findInjury(entry.injury);
      pickCategory(CATEGORIES.filter(function (category) { return category.injuries.indexOf(injury) >= 0; })[0]);
      pickInjury(injury);
      flashSection($('questionsCard'));
    } else if (entry.type === 'topic') {
      var details = $('learnParts').querySelector('details[data-key="' + entry.topic + '"]');
      details.open = true;
      flashSection(details);
    } else if (entry.type === 'city') {
      var city = CITY_HOSPITALS.filter(function (c) { return c.id === entry.city; })[0];
      $('cityInput').value = city.name[lang] || city.name.en;
      citySearchText = $('cityInput').value;
      renderCityResult();
      flashSection($('cityResult').closest('section'));
    }
  }, 60);
}

$('searchBtn').addEventListener('click', function () { setSearchPanelOpen($('searchPanel').hidden); });

(function () {
  var input = $('searchInput');
  var box = $('searchResults');
  input.addEventListener('input', function () { renderSearchResults(input, box, true); });
  input.addEventListener('focus', function () { renderSearchResults(input, box, true); });
  input.addEventListener('keydown', function (e) {
    var first = box.querySelector('.search-list button');
    if (e.key === 'Enter' && first) {
      e.preventDefault();
      first.click();
    } else if (e.key === 'ArrowDown' && first) {
      e.preventDefault();
      first.focus();
    }
  });
  // Up and down move through the results; Escape goes back to the box.
  box.addEventListener('keydown', function (e) {
    var buttons = Array.prototype.slice.call(box.querySelectorAll('.search-list button'));
    var index = buttons.indexOf(document.activeElement);
    if (index < 0) return;
    if (e.key === 'ArrowDown' && index < buttons.length - 1) { e.preventDefault(); buttons[index + 1].focus(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); (index === 0 ? input : buttons[index - 1]).focus(); }
  });
})();

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && !$('searchPanel').hidden) {
    setSearchPanelOpen(false);
    $('searchBtn').focus();
  }
});

function renderReturnToSport() {
  ['rtsTitle', 'rtsIntro', 'rtsInjuryLabel', 'rtsHopTitle', 'rtsHopHint', 'rtsHopInjured', 'rtsHopOther', 'rtsCheck', 'rtsNote']
    .forEach(function (key) { $(key).textContent = t(key); });

    option.textContent = L(findInjury(id).name);
    select.appendChild(option);
  });
  select.value = rts.injury;

  var missingIds = rts.result && rts.result.status === 'missing' ? rts.result.ids : [];

    legend.textContent = (i + 1) + '. ' + L(question.text);
    fs.appendChild(legend);
    var options = document.createElement('div');
    options.className = 'options';

      var label = document.createElement('label');
      var input = document.createElement('input');
      input.type = 'radio';
      input.name = 'rts-' + question.id;
      input.checked = rts.answers[question.id] === opt.value;
      input.addEventListener('change', function () {
        rts.answers[question.id] = opt.value;
        fs.classList.remove('missing');
      });
      label.appendChild(input);
      label.appendChild(document.createTextNode(L(opt.text)));
      options.appendChild(label);
    });
    fs.appendChild(options);
    list.appendChild(fs);
  });
  var selfCheck = questions.length > 0;

  $('rtsCheck').hidden = !selfCheck;

  if (status === 'badHop') $('rtsError').textContent = t('rtsBadHop');

function renderReturnToSportResult() {
  var box = $('rtsResult');
  box.innerHTML = '';
  var result = rts.injury && RTS_DOCTOR_INJURIES.indexOf(rts.injury) >= 0 ? {status: 'doctor'} : rts.result;
  var shown = result && ['doctor', 'notYet', 'stepByStep', 'ready'].indexOf(result.status) >= 0;
  box.hidden = !shown;
  if (!shown) return;
  function add(tag, text) {
    var element = document.createElement(tag);
    element.textContent = text;
    box.appendChild(element);
    return element;
  }
  function addList(tag, items) {
    var list = document.createElement(tag);
    list.className = tag === 'ol' ? 'steps' : 'points';
    items.forEach(function (text) { list.appendChild(document.createElement('li')).textContent = text; });
    box.appendChild(list);
  }
  var hopLine = result.hopPercent != null ? t('rtsHopShown').replace('{0}', result.hopPercent) : null;
  if (result.status === 'doctor') {
    add('h3', t('rtsDoctorTitle'));
    add('p', t('rtsDoctorText'));
  } else if (result.status === 'notYet') {
    add('h3', t('rtsNotYetTitle'));
    add('p', t('rtsNotYetIntro'));
    addList('ul', result.failed.map(function (id) {
      if (id === 'hopDistance') return L(RTS_HOP_WORK).replace('{0}', result.hopPercent);
      return L(RTS_QUESTIONS.filter(function (q) { return q.id === id; })[0].work);
    }));
  } else {
    add('h3', t(result.status === 'ready' ? 'rtsReadyTitle' : 'rtsStepTitle'));
    if (hopLine) add('p', hopLine);
    add('p', t(result.status === 'ready' ? 'rtsReadyIntro' : 'rtsStepIntro'));
    addList('ol', RTS_STAGES.map(L));
    add('p', t(result.status === 'ready' ? 'rtsReadyTips' : 'rtsStepHop'));
  }
}

// Builds the text fields once; later renders only update labels, so typed
// text survives a language switch.
function buildCaseFields() {
  var box = $('caseFields');
  Object.keys(CASE_FIELDS).forEach(function (field) {
    var label = document.createElement('label');
    label.className = 'field';
    var span = document.createElement('span');
    span.id = 'caseLabel-' + field;
    var input = document.createElement(CASE_FIELDS[field].max > 200 ? 'textarea' : 'input');
    input.id = 'case-' + field;
    input.maxLength = CASE_FIELDS[field].max;
    if (input.tagName === 'TEXTAREA') input.rows = field === 'story' ? 4 : 3;
    label.appendChild(span);
    label.appendChild(input);
    box.appendChild(label);

function problemText(p) {
  var limits = CASE_FIELDS[p.field] || {};
  return t('problem_' + p.problem)
    .replace('{0}', t('caseNames')[p.field])
    .replace('{1}', p.problem === 'tooShort' ? limits.min : limits.max);
}

function caseCard(c) {
  var injury = findInjury(c.injury);
  var article = document.createElement('article');
  article.className = 'case';
  var meta = document.createElement('div');
  meta.className = 'case-meta';
  var name = document.createElement('strong');
  name.textContent = injury ? L(injury.name) : '';
  meta.appendChild(name);
  meta.appendChild(document.createTextNode(' · ' + (c.nickname || t('anonymous')) + ' · ' + formatCaseDate(c.createdAt)));
  article.appendChild(meta);
  var story = document.createElement('p');
  story.textContent = c.story;
  article.appendChild(story);
  var details = document.createElement('dl');
  ['treatment', 'recovery', 'lesson'].forEach(function (field) {
    if (!c[field]) return;
    var dt = document.createElement('dt');
    dt.textContent = t('caseNames')[field];
    var dd = document.createElement('dd');
    dd.textContent = c[field];
    details.appendChild(dt);
    details.appendChild(dd);
  });
  if (details.children.length) article.appendChild(details);
  return article;
}

function renderCases() {
  ['casesTitle', 'casesIntro', 'caseInjuryLabel', 'privacyNote', 'filterLabel'].forEach(function (id) { $(id).textContent = t(id); });
  Object.keys(CASE_FIELDS).forEach(function (field) { $('caseLabel-' + field).textContent = t('caseLabels')[field]; });
  injuryOptions($('caseInjury'), t('choose'), $('caseInjury').value);
  injuryOptions($('caseFilter'), t('filterAll'), cases.filter);

  var canPost = cases.status === 'ready';
  $('shareBtn').hidden = !canPost;
  $('shareBtn').textContent = t(cases.formOpen ? 'shareCancel' : 'shareBtn');
  $('shareBtn').setAttribute('aria-expanded', cases.formOpen);
  $('caseForm').hidden = !(canPost && cases.formOpen);
  $('postBtn').textContent = t(cases.posting ? 'posting' : 'postBtn');
  $('postBtn').disabled = cases.posting;
  var errors = cases.postFailed ? [t('postFailed')] : cases.problems.map(problemText);
  $('caseError').textContent = errors.join(' ');
  $('caseError').hidden = errors.length === 0;
  $('casePosted').textContent = t('posted');
  $('casePosted').hidden = !cases.posted;

  var shown = filterCases(cases.list, cases.filter);
  $('caseFilter').parentNode.hidden = !canPost || cases.list.length === 0;
  var statusKey = {loading: 'casesLoading', error: 'casesError', notSetUp: 'casesNotSetUp'}[cases.status] ||
    (cases.list.length === 0 ? 'casesEmpty' : shown.length === 0 ? 'casesEmptyFilter' : '');
  $('casesStatus').textContent = statusKey ? t(statusKey) : '';
  $('casesStatus').hidden = !statusKey;
  var list = $('caseList');
  list.innerHTML = '';
  if (canPost) shown.forEach(function (c) { list.appendChild(caseCard(c)); });
}

function loadSharedCases() {
  if (!window.caseStore.configured) {
    cases.status = 'notSetUp';
    renderCases();
    return Promise.resolve();
  }
  return window.caseStore.loadCases().then(function (list) {
    cases.list = list;
    cases.status = 'ready';
  }).catch(function () {
    cases.status = 'error';
  }).then(renderCases);
}

// Called by firebase-cases.js once it has loaded.
window.onCaseStoreReady = loadSharedCases;
// Called if firebase-cases.js or the Firebase library cannot be loaded.
window.onCaseStoreFailed = function () {
  cases.status = 'error';
  renderCases();
};

  Object.keys(CASE_FIELDS).forEach(function (field) { input[field] = $('case-' + field).value; });

  var sharedCase = caseFromForm(input, lang === 'zh' ? 'zh' : 'en');
  cases.problems = caseProblems(sharedCase);
  cases.postFailed = false;
  if (cases.problems.length > 0) { renderCases(); return; }
  cases.posting = true;
  renderCases();
  window.caseStore.postCase(sharedCase).then(function () {
    cases.formOpen = false;
    cases.posted = true;
    cases.filter = sharedCase.injury;
    $('caseForm').reset();
    return loadSharedCases();
  }).catch(function () {
    cases.postFailed = true;
  }).then(function () {
    cases.posting = false;
    renderCases();

});

// A score like 2.5 as "2.5", and 3 as "3".
function trendScore(score) { return String(Math.round(score * 10) / 10); }

function svgElement(name, attributes) {
  var element = document.createElementNS('http://www.w3.org/2000/svg', name);
  Object.keys(attributes).forEach(function (key) { element.setAttribute(key, attributes[key]); });
  return element;
}

// A line chart of the two pain scores. Days are spaced by real time, so a
// week without records shows as a longer gap. It is drawn at the box's real
// width, so the labels keep their size on a phone.
function painTrendChart(points, width) {
  var height = 220, left = 30, right = 12, top = 12, bottom = 30;
  var totalDays = Math.max(1, daysBetween(points[0].date, points[points.length - 1].date));
  function x(date) { return left + daysBetween(points[0].date, date) / totalDays * (width - left - right); }
  function y(score) { return top + (1 - score / LOG_PAIN_MAX) * (height - top - bottom); }
  // Time runs left to right in every language, Arabic too, so the labels keep their places.
  var svg = svgElement('svg', {viewBox: '0 0 ' + width + ' ' + height, role: 'img', 'aria-labelledby': 'logTrendTitle', direction: 'ltr'});
  [0, 5, 10].forEach(function (score) {
    svg.appendChild(svgElement('line', {class: 'grid', x1: left, x2: width - right, y1: y(score), y2: y(score)}));
    var label = svgElement('text', {class: 'axis-label', x: left - 8, y: y(score) + 4, 'text-anchor': 'end'});
    label.textContent = score;
    svg.appendChild(label);
  });
  [points[0], points[points.length - 1]].forEach(function (point, index) {
    var label = svgElement('text', {class: 'axis-label', x: x(point.date), y: height - 10, 'text-anchor': index === 0 ? 'start' : 'end'});
    label.textContent = formatShortDate(point.date);
    svg.appendChild(label);
  });
  LOG_PAIN_FIELDS.forEach(function (field) {
    var scored = points.filter(function (point) { return point[field] !== null; });
    var line = svgElement('polyline', {class: TREND_CLASSES[field], points: scored.map(function (point) { return x(point.date) + ',' + y(point[field]); }).join(' ')});
    svg.appendChild(line);
    scored.forEach(function (point) {
      var dot = svgElement('circle', {class: TREND_CLASSES[field], cx: x(point.date), cy: y(point[field]), r: 4.5});
      var tip = svgElement('title', {});
      tip.textContent = formatShortDate(point.date) + ' · ' + t(TREND_NAMES[field]) + ' ' + trendScore(point[field]) + '/10';
      dot.appendChild(tip);
      svg.appendChild(dot);
    });
  });
  return svg;
}

function formatShortDate(dateString) {
  var parts = dateString.split('-').map(Number);
  return new Date(parts[0], parts[1] - 1, parts[2]).toLocaleDateString(lang === 'zh' ? 'zh-CN' : lang, {month: 'short', day: 'numeric'});
}

// The trend sits above the records once there are any. With fewer than two
// days of scores there is no line to draw, so it says what to do instead.
function renderPainTrend() {
  var ready = log.status === 'ready' && log.entries.length > 0;
  $('logTrend').hidden = !ready;
  if (!ready) return;
  var points = painTrend(log.entries);
  $('logTrendTitle').textContent = t('logTrendTitle');
  $('logTrendHint').textContent = t(points.length === 0 ? 'logTrendNone' : points.length === 1 ? 'logTrendOneMore' : 'logTrendHint');
  var chart = $('logTrendChart');
  var legend = $('logTrendLegend');
  chart.innerHTML = '';
  legend.innerHTML = '';
  if (points.length < 2) return;
  chart.appendChild(painTrendChart(points, Math.max(260, chart.clientWidth || 600)));
  fillPainLegend(legend, painSummary(points));
}

// "Pain at rest 6 → 2" for each kind of pain that was scored.
function fillPainLegend(legend, summary) {
  LOG_PAIN_FIELDS.forEach(function (field) {
    var scores = summary[field];
    if (!scores) return;
    var item = document.createElement('li');
    item.className = TREND_CLASSES[field];
    var text = document.createElement('span');
    var change = scores.days === 1 ? trendScore(scores.first)
      : t('trendChange').replace('{0}', trendScore(scores.first)).replace('{1}', trendScore(scores.last));
    text.textContent = t(TREND_NAMES[field]) + ' ' + change;
    item.appendChild(text);
    legend.appendChild(item);
  });
}

// Runs `draw` with the texts of another language, so the report can be in
// the doctor's language while the page stays in the visitor's.
function inLanguage(code, draw) {
  var pageLang = lang;
  lang = code;
  try { draw(); } finally { lang = pageLang; }

function drawReport(sheet, data) {
  function add(parent, tag, text, className) {
    var element = document.createElement(tag);
    if (text) element.textContent = text;
    if (className) element.className = className;
    parent.appendChild(element);
    return element;
  }
  add(sheet, 'h2', t('reportHeading')).id = 'reportHeading';
  add(sheet, 'p', t('reportRange').replace('{0}', formatLogDate(data.from)).replace('{1}', formatLogDate(data.to)), 'report-range');
  add(sheet, 'p', t('reportNote').replace('{0}', t('title')), 'muted');

  add(sheet, 'h3', t('reportPain'));
  if (Object.keys(data.pain).length === 0) {
    add(sheet, 'p', t('reportPainNone'), 'muted');
  } else {
    var trend = add(sheet, 'div', '', 'trend');
    if (data.painPoints.length >= 2) {
      var chart = painTrendChart(data.painPoints, Math.max(260, Math.min(640, window.innerWidth - 64)));
      chart.setAttribute('aria-labelledby', 'reportHeading');
      trend.appendChild(chart);
    }
    fillPainLegend(add(trend, 'ul', '', 'trend-legend'), data.pain);
  }

  add(sheet, 'h3', t('reportExercises'));
  if (data.exercises.length === 0) add(sheet, 'p', t('reportExercisesNone'), 'muted');
  else {
    var list = add(sheet, 'ul', '', 'report-exercises');
    data.exercises.forEach(function (count) {
      var item = add(list, 'li', planItemName(count.item) + (count.item.amount ? ' (' + count.item.amount + ')' : '') + ': ');
      add(item, 'strong', t('reportExerciseDone').replace('{0}', count.done).replace('{1}', count.due));
      add(item, 'small', ' · ' + planDatesText(count.item));
    });
  }

  add(sheet, 'h3', t('reportRecords'));
  if (data.records.length === 0) add(sheet, 'p', t('reportRecordsNone'), 'muted');
  data.records.forEach(function (entry) {
    var record = add(sheet, 'div', '', 'report-record');
    add(record, 'strong', formatLogDate(entry.date));
    record.appendChild(document.createTextNode(entryPainText(entry)));
    add(record, 'p', entry.text);
    if (entry.photo) {
      var img = add(record, 'img');
      img.src = entry.photo;
      img.alt = t('logPhotoAlt');
    }
  });
}

// `pending` is a backup file read but not restored yet; `problem` names the
// text of what went wrong.
var backup = {pending: null, made: false, empty: false, restored: null, problem: null, busy: false};

function renderBackupCard() {
  ['backupTitle', 'backupIntro', 'backupMake', 'backupRestore', 'backupEmpty', 'backupMade', 'backupConfirmYes', 'backupCancel']
    .forEach(function (id) { $(id).textContent = t(id); });
  $('backupEmpty').hidden = !backup.empty;
  $('backupMade').hidden = !backup.made;
  $('backupAsk').hidden = !backup.pending;
  if (backup.pending) {
    $('backupAskText').textContent = t('backupConfirm')
      .replace('{0}', formatLogDate(logDateString(new Date(backup.pending.createdAt))))
      .replace('{1}', backup.pending.entries.length)
      .replace('{2}', backup.pending.items.length);
  }
  $('backupConfirmYes').disabled = backup.busy;
  $('backupRestored').hidden = !backup.restored;
  if (backup.restored) {
    $('backupRestored').textContent = t('backupRestored')
      .replace('{0}', backup.restored.entries).replace('{1}', backup.restored.items).replace('{2}', backup.restored.skipped);
  }
  $('backupProblem').hidden = !backup.problem;
  $('backupProblem').textContent = backup.problem ? t(backup.problem) : '';
}

function resetBackupMessages() {
  backup.made = false;
  backup.empty = false;
  backup.restored = null;
  backup.problem = null;
}

function readAllRecords() {
  return Promise.all([logStore.all(), planStore.all(), planStore.allDone()]);
}

$('backupMake').addEventListener('click', function () {
  resetBackupMessages();
  backup.pending = null;
  readAllRecords().then(function (results) {
    if (results[0].length === 0 && results[1].length === 0) {
      backup.empty = true;
      return;
    }
    var text = JSON.stringify(makeBackup(results[0], results[1], results[2], new Date()));
    var link = document.createElement('a');
    link.href = URL.createObjectURL(new Blob([text], {type: 'application/json'}));
    link.download = backupFileName(logDateString(new Date()));
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(link.href); }, 1000);
    backup.made = true;
  }).catch(function () {
    backup.problem = 'logLoadFailed';
  }).then(renderBackupCard);
});

$('backupFile').addEventListener('change', function (e) {
  var file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  resetBackupMessages();
  file.text().then(function (text) {
    backup.pending = readBackup(text);
    if (!backup.pending) backup.problem = 'backupBad';
  }).catch(function () {
    backup.pending = null;
    backup.problem = 'backupBad';
  }).then(renderBackupCard);
});

$('backupCancel').addEventListener('click', function () {
  backup.pending = null;
  renderBackupCard();
});

// Exercises and ticks go in first, then records, each in one transaction.
$('backupConfirmYes').addEventListener('click', function () {
  backup.busy = true;
  renderBackupCard();
  readAllRecords().then(function (results) {
    var merge = mergeBackup(backup.pending, {entries: results[0], items: results[1]});
    return planStore.restore(merge.items, merge.done).then(function () {
      return logStore.addAll(merge.entries);
    }).then(function () {
      backup.restored = {
        entries: merge.entries.length,
        items: merge.items.filter(function (pair) { return pair.existingId === null; }).length,
        skipped: merge.skipped
      };
      backup.pending = null;
    });
  }).catch(function () {
    backup.problem = 'backupFailed';
  }).then(function () {
    backup.busy = false;
    return Promise.all([loadLog(), loadPlan()]);
  });
});

$('reportPrint').addEventListener('click', function () { window.print(); });

$('reportClose').addEventListener('click', function () {

// One button per pain score. Tapping the chosen score again clears it,
// since the score is optional.
function buildPainScale(field) {
  var scale = $(field);
  for (var score = 0; score <= LOG_PAIN_MAX; score++) {
    var label = document.createElement('label');
    label.innerHTML = '<input type="radio" class="visually-hidden"><span></span>';
    label.querySelector('input').name = field;
    label.querySelector('input').value = score;
    label.querySelector('span').textContent = score;
    scale.appendChild(label);
  }
  var checkedBefore = null;
  scale.addEventListener('pointerdown', function () {
    checkedBefore = scale.querySelector('input:checked');
  });
  scale.addEventListener('click', function (e) {
    if (e.target.tagName === 'INPUT' && e.target === checkedBefore) {
      e.target.checked = false;
      checkedBefore = null;
    }
  });
}

LOG_PAIN_FIELDS.forEach(buildPainScale);
resetLogDate();
loadLog();

// ---- Rehab plan ----

var PLAN_PROBLEM_TEXT = {
  name: function (p) { return p.problem === 'tooLong' ? t('planProblemNameLong').replace('{0}', PLAN_NAME_MAX) : t('planProblemName'); },
  amount: function () { return t('planProblemAmountLong').replace('{0}', PLAN_AMOUNT_MAX); },
  days: function () { return t('planProblemDays'); },
  start: function () { return t('planProblemStart'); },
  end: function () { return t('planProblemEnd'); }
};

function planDaysText(item) {
  if (item.days.length === 7) return t('planEveryDay');
  var names = item.days.map(function (day) { return t('weekdays')[day]; });
  return t('planWeekly').replace('{0}', names.join(lang === 'zh' ? '、' : ', '));
}

function planDatesText(item) {
  if (!item.end) return t('planFrom').replace('{0}', formatShortDate(item.start));
  return t('planRange').replace('{0}', formatShortDate(item.start)).replace('{1}', formatShortDate(item.end));
}

// A stage added from the results shows its goal in the page's language.
function planItemName(item) {
  var stage = rehabStageOf(item);
  return stage ? L(stage.goal) : item.name;
}

function planItemLabel(item) {
  var label = document.createElement('span');
  label.textContent = planItemName(item);
  if (item.amount) {
    var amount = document.createElement('small');
    amount.textContent = item.amount;
    label.appendChild(amount);
  }
  return label;
}

// The day buttons in the form: "every day" and one per weekday, Monday first.
function buildDayPicks() {
  var box = $('planDays');
  ['all', 1, 2, 3, 4, 5, 6, 0].forEach(function (day) {
    var label = document.createElement('label');
    label.innerHTML = '<input type="checkbox" class="visually-hidden"><span></span>';
    label.querySelector('input').value = day;
    box.appendChild(label);
  });
  box.addEventListener('change', function (e) {
    var boxes = box.querySelectorAll('input');
    if (e.target.value === 'all') boxes.forEach(function (input) { input.checked = e.target.checked; });
    else boxes[0].checked = [].slice.call(boxes, 1).every(function (input) { return input.checked; });
  });
}

function setPickedDays(days) {
  $('planDays').querySelectorAll('input').forEach(function (input) {
    input.checked = input.value === 'all' ? days.length === 7 : days.indexOf(Number(input.value)) >= 0;
  });
}

function pickedDays() {
  return [].slice.call($('planDays').querySelectorAll('input:checked'))
    .filter(function (input) { return input.value !== 'all'; })
    .map(function (input) { return Number(input.value); });
}

function renderPlan() {
  ['planTitle', 'planIntro', 'planNameLabel', 'planAmountLabel', 'planDaysLabel', 'planStartLabel', 'planEndLabel',
   'calendarTitle', 'calendarHint', 'calendarTimeLabel', 'calendarBtn', 'calendarNone', 'calendarDone']
    .forEach(function (id) { $(id).textContent = t(id); });
  $('planCancelBtn').textContent = t('planCancel');
  $('planName').placeholder = t('planNamePlaceholder');
  $('planAmount').placeholder = t('planAmountPlaceholder');
  $('planDays').querySelectorAll('span').forEach(function (span, index) {
    span.textContent = index === 0 ? t('planEveryDay') : t('weekdays')[[1, 2, 3, 4, 5, 6, 0][index - 1]];
  });
  $('planTodayTitle').textContent = t('planTodayTitle').replace('{0}', formatLogDate(plan.today));

  var ready = plan.status === 'ready';
  var due = ready ? itemsDueOn(plan.items, plan.today) : [];
  var doneCount = due.filter(function (item) { return plan.done.indexOf(item.id) >= 0; }).length;
  var progressKey = plan.status === 'loading' ? 'logLoading' : plan.status === 'error' ? 'planLoadFailed'
    : plan.items.length === 0 ? 'planEmpty' : due.length === 0 ? 'planNoneToday'
    : doneCount === due.length ? 'planAllDone' : 'planProgress';
  $('planProgress').textContent = t(progressKey).replace('{0}', doneCount).replace('{1}', due.length);

  var today = $('planToday');
  today.innerHTML = '';
  due.forEach(function (item) {
    var row = document.createElement('li');
    var label = document.createElement('label');
    var box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = plan.done.indexOf(item.id) >= 0;
    box.dataset.id = item.id;
    label.className = box.checked ? 'done' : '';
    label.appendChild(box);
    label.appendChild(planItemLabel(item));
    row.appendChild(label);
    var stage = rehabStageOf(item);
    if (stage) {
      var moves = document.createElement('ul');
      moves.className = 'plan-moves';
      stage.moves.forEach(function (move) {
        var li = document.createElement('li');
        li.textContent = L(move);
        moves.appendChild(li);
      });
      row.appendChild(moves);
    }
    today.appendChild(row);
  });
  $('planError').textContent = t('planSaveFailed');
  $('planError').hidden = !(plan.saveFailed && !plan.formOpen);
  $('planSaved').textContent = t('planSavedMsg');
  $('planSaved').hidden = !plan.saved;

  $('planAddBtn').textContent = t('planAdd');
  $('planAddBtn').hidden = plan.formOpen || !ready;
  $('planForm').hidden = !plan.formOpen;
  $('planFormTitle').textContent = t(plan.editing ? 'planFormEdit' : 'planFormAdd');
  $('planSaveBtn').textContent = t(plan.editing ? 'planUpdate' : 'planSave');
  $('planSaveBtn').disabled = plan.saving;
  var errors = plan.problems.map(function (p) { return PLAN_PROBLEM_TEXT[p.field](p); });
  if (plan.saveFailed && plan.formOpen) errors.push(t('planSaveFailed'));
  $('planFormError').textContent = errors.join(' ');
  $('planFormError').hidden = errors.length === 0;

  var items = sortPlanItems(plan.items, plan.today);
  $('planAll').hidden = items.length === 0;
  $('planListTitle').textContent = t('planListTitle').replace('{0}', items.length);
  var list = $('planList');
  list.innerHTML = '';
  items.forEach(function (item) {
    var row = document.createElement('div');
    row.className = 'plan-item';
    var name = document.createElement('strong');
    name.appendChild(planItemLabel(item));
    var meta = document.createElement('div');
    meta.className = 'case-meta';
    var notes = [planDaysText(item), planDatesText(item)];
    if (isPlanItemOver(item, plan.today)) notes.push(t('planOver'));
    else if (item.start > plan.today) notes.push(t('planNotYet'));
    meta.textContent = notes.join(' · ');
    row.appendChild(name);
    row.appendChild(meta);
    [['planEdit', 'edit'], ['planDelete', 'delete']].forEach(function (pair) {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'secondary';
      button.textContent = t(pair[0]);
      button.dataset.action = pair[1];
      button.dataset.id = item.id;
      row.appendChild(button);
    });
    list.appendChild(row);
  });

  var active = plan.items.filter(function (item) { return !isPlanItemOver(item, plan.today); });
  $('calendarBtn').disabled = active.length === 0;
  $('calendarNone').hidden = !ready || active.length > 0;
  $('calendarDone').hidden = !plan.calendarDone;

  $('homeToday').hidden = due.length === 0 || currentAccountState() !== 'signedIn';
  if (due.length > 0) {
    $('homeToday').innerHTML = '<strong></strong> <span class="muted"></span>';
    $('homeToday').querySelector('strong').textContent = doneCount === due.length
      ? t('homeTodayAllDone').split('{0}').join(due.length)
      : t('homeToday').replace('{0}', doneCount).replace('{1}', due.length);
    $('homeToday').querySelector('span').textContent = t('homeTodayGo');
  }
}

// Reads the plan and today's ticks. A new day starts with nothing ticked.
function loadPlan() {
  plan.today = logDateString(new Date());
  return Promise.all([planStore.all(), planStore.doneOn(plan.today)]).then(function (results) {
    plan.items = results[0];
    plan.done = results[1];
    plan.status = 'ready';
  }).catch(function () {
    plan.status = 'error';
  }).then(renderPlan);
}

function openPlanForm(item) {
  plan.formOpen = true;
  plan.editing = item || null;
  plan.problems = [];
  plan.saveFailed = false;
  plan.saved = false;
  $('planName').value = item ? planItemName(item) : '';
  $('planAmount').value = item ? item.amount : '';
  setPickedDays(item ? item.days : ALL_WEEKDAYS);
  $('planStart').value = item ? item.start : plan.today;
  $('planEnd').value = item ? item.end : '';
  renderPlan();
  $('planForm').scrollIntoView({block: 'nearest'});
  $('planName').focus();
}

$('planAddBtn').addEventListener('click', function () { openPlanForm(null); });

$('planCancelBtn').addEventListener('click', function () {
  plan.formOpen = false;
  plan.problems = [];
  renderPlan();
});

$('planForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var item = planItemFromForm({name: $('planName').value, amount: $('planAmount').value, days: pickedDays(),
    start: $('planStart').value, end: $('planEnd').value}, new Date());
  if (plan.editing) {
    item.id = plan.editing.id;
    item.createdAt = plan.editing.createdAt;
    // A stage keeps its link (and its list of moves) unless it was renamed.
    if (plan.editing.ref && item.name === planItemName(plan.editing)) {
      item.name = plan.editing.name;
      item.ref = plan.editing.ref;
    }
  }
  plan.problems = planItemProblems(item);
  plan.saveFailed = false;
  if (plan.problems.length > 0) { renderPlan(); return; }
  plan.saving = true;
  renderPlan();
  planStore.save(item).then(function () {
    plan.formOpen = false;
    plan.editing = null;
    plan.saved = true;
    plan.calendarDone = false;
    return loadPlan();
  }).catch(function () {
    plan.saveFailed = true;
  }).then(function () {
    plan.saving = false;
    renderPlan();
  });
});

$('planToday').addEventListener('change', function (e) {
  var id = Number(e.target.dataset.id);
  var done = e.target.checked;
  plan.done = plan.done.filter(function (doneId) { return doneId !== id; }).concat(done ? [id] : []);
  plan.saved = false;
  plan.saveFailed = false;
  renderPlan();
  planStore.setDone(id, plan.today, done).catch(function () {
    plan.saveFailed = true;
    return loadPlan();
  });
});

$('planList').addEventListener('click', function (e) {
  var id = Number(e.target.dataset.id);
  var item = plan.items.filter(function (candidate) { return candidate.id === id; })[0];
  if (!item) return;
  if (e.target.dataset.action === 'edit') { openPlanForm(item); return; }
  if (e.target.dataset.action !== 'delete' || !confirm(t('planDeleteConfirm').replace('{0}', planItemName(item)))) return;
  plan.saved = false;
  plan.calendarDone = false;
  planStore.remove(id).catch(function () { plan.saveFailed = true; }).then(loadPlan);
});

// Downloads a calendar file; phones and computers offer to add it to their calendar.
$('calendarBtn').addEventListener('click', function () {
  var time = reminderTime($('calendarTime').value);
  var active = plan.items.filter(function (item) { return !isPlanItemOver(item, plan.today); });
  var named = active.map(function (item) { return Object.assign({}, item, {name: planItemName(item)}); });
  var file = new Blob([planCalendar(named, time, t('calendarEventTitle'), new Date())], {type: 'text/calendar'});
  var link = document.createElement('a');
  link.href = URL.createObjectURL(file);
  link.download = 'rehab-reminders.ics';
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(function () { URL.revokeObjectURL(link.href); }, 1000);
  plan.calendarDone = true;
  renderPlan();
});

// Coming back to the page on a new day shows the new day's exercises.
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && plan.today !== logDateString(new Date())) loadPlan();
});

buildDayPicks();

// ---- Cover slideshow ----
// `position` keeps the subject in view on a phone, where the photo is cropped
// narrow; `wide` is for computers, where the words sit on the left. `crop`
// cuts the photo first (rect=x,y,width,height in the original's pixels).
var COVER_SLIDES = [
  {photo: 'photo-1758691463582-11aea602cd4a', crop: 'rect=0,150,2560,1440', position: '72% 25%', wide: 'right 25%', author: 'Vitaly Gariev', page: 'https://unsplash.com/photos/a-smiling-doctor-with-glasses-and-stethoscope-stands-arms-crossed-XqMo4OlBnh0'},
  {photo: 'photo-1461896836934-ffe607ba8211', position: '60% 60%', author: 'Braden Collum', page: 'https://unsplash.com/photos/man-on-running-field-9HI8UJMSdZA'},
  {photo: 'photo-1706777193603-76c3e9613553', position: '45% 50%', author: 'Tom Claes', page: 'https://unsplash.com/photos/a-person-sitting-on-a-chair-with-a-foot-in-a-cast-gkgLYinrRtM'},
  {photo: 'photo-1649751361457-01d3a696c7e6', position: '55% 40%', author: 'yury kirillov', page: 'https://unsplash.com/photos/a-man-getting-his-leg-examined-by-a-doctor-pbUWW-CBoqY'},
  {photo: 'photo-1645005513713-9e2b92a687d3', position: '50% 40%', author: 'Sincerely Media', page: 'https://unsplash.com/photos/a-man-and-a-woman-holding-dumbs-in-their-hands-inoZpsBQRqk'}
];
var COVER_SECONDS = 4.5;
var cover = {current: 0, timer: null};

function coverImage(slide) {
  return 'url("https://images.unsplash.com/' + slide.photo + '?' + (slide.crop ? slide.crop + '&' : '') + 'w=1920&q=80&auto=format&fit=crop")';
}

// A photo is only downloaded when it is shown or about to be, to save data on phones.
// Photos are only shown, and so only loaded, on wide screens.
var wideCover = window.matchMedia('(min-width:900px)');

function loadCoverSlide(index) {
  if (!wideCover.matches) return;
  var layer = $('coverSlides').children[index];
  if (!layer.style.backgroundImage) layer.style.backgroundImage = coverImage(COVER_SLIDES[index]);
}

function showCoverSlide(index) {
  cover.current = (index + COVER_SLIDES.length) % COVER_SLIDES.length;
  loadCoverSlide(cover.current);
  loadCoverSlide((cover.current + 1) % COVER_SLIDES.length);
  [].forEach.call($('coverSlides').children, function (layer, i) { layer.classList.toggle('on', i === cover.current); });
  [].forEach.call($('coverDots').children, function (dot, i) { dot.setAttribute('aria-current', String(i === cover.current)); });
}

// Moves on every few seconds, unless the visitor asked for less motion, the
// tab is hidden, or another section is open. Picking a dot restarts the wait.
function startCoverTimer() {
  clearInterval(cover.timer);
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  cover.timer = setInterval(function () {
    if (!document.hidden && !$('view-home').hidden && wideCover.matches) showCoverSlide(cover.current + 1);
  }, COVER_SECONDS * 1000);
}

function buildCover() {
  COVER_SLIDES.forEach(function (slide, index) {
    var layer = document.createElement('div');
    layer.className = 'cover-slide';
    layer.style.setProperty('--position', slide.position);
    layer.style.setProperty('--wide', slide.wide || slide.position);
    $('coverSlides').appendChild(layer);
    var dot = document.createElement('button');
    dot.type = 'button';
    dot.addEventListener('click', function () {
      showCoverSlide(index);
      startCoverTimer();
    });
    $('coverDots').appendChild(dot);
  });
  showCoverSlide(0);
  startCoverTimer();
}

function renderCover() {
  [].forEach.call($('coverDots').children, function (dot, index) {
    dot.setAttribute('aria-label', t('coverSlide').replace('{0}', index + 1));
  });
  var credits = $('photoCredits');
  credits.innerHTML = '';
  COVER_SLIDES.forEach(function (slide, index) {
    if (index > 0) credits.appendChild(document.createTextNode(' · '));
    var link = document.createElement('a');
    link.href = slide.page;
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = slide.author;
    credits.appendChild(link);
  });
}

buildCover();
renderCover();
// A phone turned sideways, or a window made wider, starts showing photos.
wideCover.addEventListener('change', function () { showCoverSlide(cover.current); });
loadPlan();

$('seeComfortBtn').addEventListener('click', function () {

// The language list opens under the Language button and closes after a
// choice, a tap anywhere else, or Escape.
function setLangListOpen(open) {
  $('langList').hidden = !open;
  $('langBtn').setAttribute('aria-expanded', open);
}
$('langBtn').addEventListener('click', function () {
  setLangListOpen($('langList').hidden);
});
document.addEventListener('click', function (e) {

document.querySelectorAll('#langList button').forEach(function (b) {

    saveLang();

// ---- Sign-in for the private sections ----
// Firebase checks the email and password; the rules are in account.js.

function currentAccountState() {
  if (account.status !== 'ready') return account.status;
  return accountState(account.user, accountOwner.get(), new Date());
}

var ACCOUNT_PROBLEM_TEXT = {
  'email|missing': 'accountEmailMissing',
  'email|bad': 'accountEmailBad',
  'password|missing': 'accountPasswordMissing',
  'password|tooShort': 'accountPasswordShort',
  'password|onlySpaces': 'accountPasswordSpaces',
  'password|tooLong': 'accountPasswordLong',
  'confirm|different': 'accountConfirmDifferent'
};

function showMessage(id, key) {
  $(id).hidden = !key;
  $(id).textContent = key ? t(key) : '';
}

function renderAccount() {
  var state = currentAccountState();
  if (window.accountStore) accountStore.setLanguage(lang === 'zh' ? 'zh-CN' : lang);
  // A sign-in older than 7 days is ended here; Firebase then reports nobody.
  if (state === 'expired' && !account.signingOut) {
    account.signingOut = true;
    account.expired = true;
    accountStore.signOut().catch(function () { account.signingOut = false; });
  }
  if (state === 'signedIn' && !accountOwner.get()) accountOwner.set(account.user);

  var asking = state === 'signedOut' || state === 'expired';
  var waiting = state === 'unverified' || state === 'otherAccount';
  $('accountTitle').textContent = t('accountTitle');
  $('accountIntro').textContent = t('accountIntro');
  var status = state === 'loading' ? 'accountLoading' : state === 'error' ? 'accountUnavailable'
    : asking && account.expired ? 'accountExpired' : null;
  showMessage('accountStatus', status);

  $('accountForm').hidden = !asking;
  var mode = account.mode;
  $('accountModes').hidden = mode === 'reset';
  $('accountModes').setAttribute('aria-label', t('accountModes'));
  $('accountModeSignIn').textContent = t('accountSignIn');
  $('accountModeSignUp').textContent = t('accountSignUp');
  $('accountModeSignIn').setAttribute('aria-pressed', mode === 'signIn');
  $('accountModeSignUp').setAttribute('aria-pressed', mode === 'signUp');
  $('accountEmailLabel').textContent = t('accountEmail');
  $('accountPasswordLabel').textContent = mode === 'signUp' ? t('accountNewPassword') : t('accountPassword');
  $('accountPassword').autocomplete = mode === 'signUp' ? 'new-password' : 'current-password';
  $('accountPasswordField').hidden = mode === 'reset';
  $('accountConfirmField').hidden = mode !== 'signUp';
  $('accountConfirmLabel').textContent = t('accountConfirm');
  $('accountSubmit').disabled = account.busy;
  $('accountSubmit').textContent = account.busy ? t('accountBusy')
    : t({signIn: 'accountSignIn', signUp: 'accountCreate', reset: 'accountSendReset'}[mode]);
  var problemText = account.problems.map(function (p) { return t(ACCOUNT_PROBLEM_TEXT[p.field + '|' + p.problem]); }).join(' ');
  $('accountError').hidden = !problemText && !account.error;
  $('accountError').textContent = problemText || (account.error ? t(account.error) : '');
  showMessage('accountDone', asking ? account.done : null);
  $('accountForgot').textContent = mode === 'reset' ? t('accountBack') : t('accountForgot');

  $('accountWait').hidden = !waiting;
  if (waiting) {
    var owner = accountOwner.get();
    $('accountWaitText').textContent = state === 'unverified'
      ? t('accountCheckEmail').replace('{0}', account.user.email)
      : t('accountOtherOwner').replace('{0}', maskEmail(owner.email));
    $('accountVerifiedBtn').hidden = state !== 'unverified';
    $('accountResendBtn').hidden = state !== 'unverified';
    $('accountVerifiedBtn').textContent = t('accountVerified');
    $('accountResendBtn').textContent = t('accountResend');
    $('accountOtherBtn').textContent = t('accountUseOther');
    $('accountVerifiedBtn').disabled = $('accountResendBtn').disabled = account.busy;
  }
  showMessage('accountWaitError', waiting ? account.error : null);
  showMessage('accountWaitDone', waiting ? account.done : null);

  if (state === 'signedIn') $('accountWho').textContent = t('accountWho').replace('{0}', account.user.email);
  $('accountSignOut').textContent = t('accountSignOut');
}

// Redraws everything that depends on being signed in.
function accountChanged() {
  renderAccount();
  renderPlan();
  showView();
}

function setAccountMode(mode) {
  account.mode = mode;
  account.problems = [];
  account.error = null;
  account.done = null;
  accountChanged();
}

// Runs one Firebase call with the buttons disabled; `done` is the message to
// show when it worked.
function accountAction(call, done) {
  account.busy = true;
  account.problems = [];
  account.error = null;
  account.done = null;
  renderAccount();
  return call().then(function () {
    account.done = done;
  }).catch(function (e) {
    account.error = (e && e.messageKey) || accountErrorKey(e && e.code);
  }).then(function () {
    account.busy = false;
    accountChanged();
  });
}

// Called by firebase-account.js whenever the signed-in user changes.
window.onAccountChange = function (user) {
  account.status = 'ready';
  account.user = user;
  if (!user) account.signingOut = false;
  if (user && currentAccountState() === 'signedIn') account.expired = false;
  accountChanged();
};
// Called if firebase-account.js or the Firebase library cannot be loaded.
window.onAccountFailed = function () {
  account.status = 'error';
  accountChanged();
};

$('accountModes').addEventListener('click', function (event) {
  var button = event.target.closest('button[data-mode]');
  if (button) setAccountMode(button.dataset.mode);
});

$('accountForgot').addEventListener('click', function () {
  setAccountMode(account.mode === 'reset' ? 'signIn' : 'reset');
});

$('accountForm').addEventListener('submit', function (event) {
  event.preventDefault();
  if (account.busy) return;
  var mode = account.mode;
  var form = {email: $('accountEmail').value, password: $('accountPassword').value, confirm: $('accountConfirm').value};
  account.problems = accountProblems(form, mode);
  account.error = null;
  account.done = null;
  if (account.problems.length) {
    renderAccount();
    return;
  }
  var email = form.email.trim();
  var call = {
    signIn: function () { return accountStore.signIn(email, form.password); },
    signUp: function () { return accountStore.signUp(email, form.password); },
    reset: function () { return accountStore.resetPassword(email); }
  }[mode];
  accountAction(call, mode === 'reset' ? 'accountResetSent' : null).then(function () {
    if (!account.error) {
      $('accountPassword').value = '';
      $('accountConfirm').value = '';
    }
  });
});

$('accountVerifiedBtn').addEventListener('click', function () {
  accountAction(function () {
    return accountStore.refresh().then(function (user) {
      account.user = user;
      if (user && !user.emailVerified) throw {messageKey: 'accountNotVerified'};
    });
  }, null);
});

$('accountResendBtn').addEventListener('click', function () {
  accountAction(function () { return accountStore.resendVerification(); }, 'accountResent');
});

function signOutOfAccount() {
  account.mode = 'signIn';
  accountAction(function () { return accountStore.signOut(); }, null);
}
$('accountOtherBtn').addEventListener('click', signOutOfAccount);
$('accountSignOut').addEventListener('click', signOutOfAccount);

// A page left open for days also locks once the sign-in is 7 days old.
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && account.status === 'ready') accountChanged();
});

// ---- On the home screen, and offline ----
// sw.js keeps a copy of the site; install.js decides which help to show.

var install = {prompt: null, dismissed: false};
try { install.dismissed = localStorage.getItem(INSTALL_DISMISSED_KEY) === 'yes'; } catch (e) { /* storage blocked */ }

function renderInstall() {
  var help = installHelp({
    standalone: window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true,
    dismissed: install.dismissed,
    canPrompt: install.prompt !== null,
    ios: isIosDevice(navigator.userAgent, navigator.platform, navigator.maxTouchPoints),
    android: /Android/.test(navigator.userAgent)
  });
  $('installCard').hidden = help === 'none';
  $('installTitle').textContent = t('installTitle');
  $('installText').textContent = t({prompt: 'installPromptText', ios: 'installIos', android: 'installAndroid', none: 'installPromptText'}[help]);
  $('installBtn').hidden = help !== 'prompt';
  $('installBtn').textContent = t('installBtn');
  $('installDismiss').textContent = t('installDismiss');
}

function renderOffline() {
  $('offlineBanner').hidden = navigator.onLine;
  $('offlineBanner').textContent = t('offlineBanner');
}

// Android Chrome offers its own install window; keep it for the button.
window.addEventListener('beforeinstallprompt', function (event) {
  event.preventDefault();
  install.prompt = event;
  renderInstall();
});
window.addEventListener('appinstalled', function () {
  install.prompt = null;
  install.dismissed = true;
  renderInstall();
});

$('installBtn').addEventListener('click', function () {
  if (!install.prompt) return;
  install.prompt.prompt();
  install.prompt.userChoice.then(function () {
    install.prompt = null;
    renderInstall();
  });
});

$('installDismiss').addEventListener('click', function () {
  install.dismissed = true;
  try { localStorage.setItem(INSTALL_DISMISSED_KEY, 'yes'); } catch (e) { /* storage blocked: shown again next time */ }
  renderInstall();
});

window.addEventListener('online', renderOffline);
window.addEventListener('offline', renderOffline);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function () { /* the site still works online */ });
}

renderAll();
showView();
</script>
